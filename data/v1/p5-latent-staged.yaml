- id: DIAG-P5-LATENT-L4-ID-01
  version: "1.0"
  split: calibration
  paradigm: P5
  thread: J-潜在操作
  schema_id: latent-set-affine-identification-probe-v1
  schema_name: 跨表示匿名仿射操作码本辨识诊断
  level: 4
  source:
    domain: 八位基因开关盲校准
    problem: >-
      状态是 b1…b8 的八位串。P(i1,…,i8) 输出原串第 i1,…,i8 位，再与掩码逐位异或。
      八个匿名程序 S1—S8 分别实现 F1—F8 中不同的一项。候选变换：
      F1=P(2,3,4,5,6,7,8,1)⊕00000000；F2=P(8,1,2,3,4,5,6,7)⊕00000000；
      F3=P(8,7,6,5,4,3,2,1)⊕00000000；F4=P(2,1,4,3,6,5,8,7)⊕00000000；
      F5=P(1,2,3,4,5,6,7,8)⊕10110110；F6=P(1,2,3,4,5,6,7,8)⊕01101001；
      F7=P(2,4,1,3,6,8,5,7)⊕00000000；F8=P(4,1,6,2,8,3,7,5)⊕11001010。
      单条日志可能兼容多项候选，但代码本是一一对应。校准日志：
      S1:00100011→11000100；S2:01111100→00111110；S3:10001000→00010001；
      S4:00000000→10110110；S5:01000001→10000010；S6:10010000→01100000；
      S7:01101010→11011101；S8:01001110→00100111。
      求唯一代码本，并按 S1—S8 顺序输出八个等式，最后输出 UNUSED=NONE。
    solution: >-
      每条日志先保留全部兼容候选，再施加八个程序必须使用互不相同变换的约束。
      唯一全局匹配为 S1=F3、S2=F2、S3=F1、S4=F5、S5=F4、S6=F7、S7=F8、S8=F6；八项全部使用。
    answer: S1=F3;S2=F2;S3=F1;S4=F5;S5=F4;S6=F7;S7=F8;S8=F6;UNUSED=NONE
  target:
    domain: 八站信号编织机盲校准
    problem: >-
      状态是站位 a—h 中当前点亮者的集合。路由 G=取(x1,…,x8)△M 表示新站位 a—h 依次复制旧站位
      x1—x8 是否点亮，再把 M 中站位翻转。八张匿名路由卡 T1—T8 实现九项候选中的八项且互不重复。
      候选路由：G1=取(b,c,d,e,f,g,h,a)△∅；G2=取(h,a,b,c,d,e,f,g)△∅；
      G3=取(h,g,f,e,d,c,b,a)△∅；G4=取(b,a,d,c,f,e,h,g)△∅；
      G5=取(a,b,c,d,e,f,g,h)△{a,c,d,f,g}；G6=取(a,b,c,d,e,f,g,h)△{b,c,e,h}；
      G7=取(b,d,a,c,f,h,e,g)△∅；G8=取(d,a,f,b,h,c,g,e)△{a,b,e,g}；
      G9=取(b,a,d,c,f,e,h,g)△{c,d,f,h}。单条观测可能兼容多项候选。观测记录：
      T7:{c,g,h}→{a,b,f}；T3:{a,d,f,g,h}→{b,d,e,f,g}；T2:{b,c,e,f}→{c,d,f,g}；
      T1:{c,d,f}→{b,d,e,f,h}；T6:{a,b,e,h}→{a,d,g,h}；T4:{a,b,c,d,e,f,g}→{b,e}；
      T5:{d,f,g,h}→{a,b,c,e}；T8:{a,b,f,h}→{a,c,e,f}。
      求唯一代码本，并严格按 T1—T8 顺序输出八个“卡=候选”段，最后输出 UNUSED=未使用候选；共九段，以分号分隔。
    answer:
      parts:
        - {type: string, value: T1=G6}
        - {type: string, value: T2=G2}
        - {type: string, value: T3=G9}
        - {type: string, value: T4=G5}
        - {type: string, value: T5=G3}
        - {type: string, value: T6=G1}
        - {type: string, value: T7=G8}
        - {type: string, value: T8=G7}
        - {type: string, value: UNUSED=G4}
  mapping:
    objects: {源八位向量: 目标点亮站位集合, 位位置 b1…b8: 站位 a…h, 位排列 P: 新站位取旧站位成员关系, 异或掩码: 集合对称差, S1…S8: T5/T2/T6/T4/T3/T8/T7/T1}
    shared_relations: [位值 1 等价于站位属于集合, 排列后异或等价于成员复制后取对称差, 单条记录只定义兼容候选集合, 全部匿名代码必须联合满足注入约束, 未使用候选由全局匹配而非单条观测确定]
    removed_relations: [T3 沿用 source S5 的无翻转成对交换 G4]
    added_relations: [T3 改为成对交换后再翻转 c/d/f/h 的 G9]
    adaptation_required: [跨越位串与集合表示建立 F/G 对应, 联合全部观测恢复 T3=G9, 判定 G4 而非 G9 未使用]
    varied: [只测码本辨识而不混入最短路, 目标从位串改成集合表示, 候选从八项扩为九项并编辑一项关系]
  lure:
    problem: 使用相同卡名和九项候选，但冻结 source 映射得到的旧码本，不采用 T3 观测要求的新翻转关系；输出八个旧等式和未使用项。
    solution: 旧码本与真实目标只在 T3/未使用项处不同：T3=G4，G9 未使用。
    answer:
      parts:
        - {type: string, value: T1=G6}
        - {type: string, value: T2=G2}
        - {type: string, value: T3=G4}
        - {type: string, value: T4=G5}
        - {type: string, value: T5=G3}
        - {type: string, value: T6=G1}
        - {type: string, value: T7=G8}
        - {type: string, value: T8=G7}
        - {type: string, value: UNUSED=G9}
    why_surface_similar: 保留全部卡名、候选与七项未变化的映射。
    why_structurally_different: lure 冻结旧码本，违反 T3 观测并交换真实使用项与未使用项。
    wrong_schema_id: stale-set-affine-codebook-identification-01
  copy_probe:
    answer:
      parts:
        - {type: string, value: T1=G6}
        - {type: string, value: T2=G2}
        - {type: string, value: T3=G4}
        - {type: string, value: T4=G5}
        - {type: string, value: T5=G3}
        - {type: string, value: T6=G1}
        - {type: string, value: T7=G8}
        - {type: string, value: T8=G7}
        - {type: string, value: UNUSED=G9}
    derivation: 跨表征逐码复制 source 码本，不用目标观测重新辨识 T3。
  hints:
    schema_name: 跨表示匿名仿射操作码本辨识诊断
    oracle_mindset: {insight: 把集合成员编码为位向量，为每条观测列候选集合，再求唯一注入匹配和未使用候选。, when_to_use: 匿名操作语义由有歧义的局部输入输出联合确定时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p5_latent:verify_diag_p5_latent_l4_id_01
    method: dual-representation-injective-codebook-enumeration
