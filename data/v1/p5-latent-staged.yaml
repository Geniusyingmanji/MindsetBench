      F1=P(2,3,4,5,6,7,8,1)⊕00000000；F2=P(8,1,2,3,4,5,6,7)⊕00000000；
      F3=P(8,7,6,5,4,3,2,1)⊕00000000；F4=P(2,1,4,3,6,5,8,7)⊕00000000；
      F5=P(1,2,3,4,5,6,7,8)⊕10110110；F6=P(1,2,3,4,5,6,7,8)⊕01101001；
      F7=P(2,4,1,3,6,8,5,7)⊕00000000；F8=P(4,1,6,2,8,3,7,5)⊕11001010。
      代码本：S1=F3；S2=F2；S3=F1；S4=F5；S5=F4；S6=F7；S7=F8；S8=F6。卡成本：
      S1[2]；S2[1]；S3[2]；S4[2]；S5[2]；S6[4]；S7[5]；S8[6]。
      每问独立、每张卡至多一次且按输出顺序作用：Q1:初态=00000001;目标=11100001；
      Q2:初态=01100011;目标=10110111；Q3:初态=01100101;目标=01101010。求三问唯一最低成本计划。
    solution: >-
      在每问的“八位状态×已用卡集合”上运行一致代价搜索，直到队列中不存在同成本竞争目标。
      三问唯一最优依次为 12;S3>S7>S2>S4>S5、14;S5>S6>S7>S1>S2、10;S2>S5>S7>S1。
    answer: 12;S3>S7>S2>S4>S5;14;S5>S6>S7>S1>S2;10;S2>S5>S7>S1
  target:
    domain: 八站信号编织机显式码本规划
    problem: >-
      状态是点亮站位集合。G=取(x1,…,x8)△M 表示新 a—h 依次复制旧 x1—x8 的成员关系，再翻转 M。
      候选路由：G1=取(b,c,d,e,f,g,h,a)△∅；G2=取(h,a,b,c,d,e,f,g)△∅；
      G3=取(h,g,f,e,d,c,b,a)△∅；G4=取(b,a,d,c,f,e,h,g)△∅；
      G5=取(a,b,c,d,e,f,g,h)△{a,c,d,f,g}；G6=取(a,b,c,d,e,f,g,h)△{b,c,e,h}；
      G7=取(b,d,a,c,f,h,e,g)△∅；G8=取(d,a,f,b,h,c,g,e)△{a,b,e,g}；
      G9=取(b,a,d,c,f,e,h,g)△{c,d,f,h}。本题已给出正确代码本，无需再从观测恢复：
      代码本：T1=G6；T2=G2；T3=G9；T4=G5；T5=G3；T6=G1；T7=G8；T8=G7。卡成本：
      T5[2]；T2[1]；T6[2]；T4[2]；T3[2]；T8[4]；T7[5]；T1[6]。
      每问独立、每张卡至多一次且按输出顺序作用：Q1:初集={h};目标集={a,b,c,h}；
      Q2:初集={b,c,g,h};目标集={a,c,d,f,g,h}；Q3:初集={b,c,f,h};目标集={b,c,e,g}。
      求三问唯一最低成本计划。最后一行严格输出六段：Q1成本;Q1卡串;Q2成本;Q2卡串;Q3成本;Q3卡串。
    answer:
      parts:
        - {type: number, value: "7"}
        - {type: string, value: T5>T3>T4>T2}
        - {type: number, value: "11"}
        - {type: string, value: T5>T3>T2>T8>T6}
        - {type: number, value: "11"}
        - {type: string, value: T8>T3>T2>T5>T6}
  mapping:
    objects: {八位状态: 点亮站位集合, F1…F9: G1…G9, S1…S8: T5/T2/T6/T4/T3/T8/T7/T1, 路径代价: 路由卡成本之和, 每问已用卡集合: 每问独立重置}
    shared_relations: [位排列异或与集合取位对称差等价, 显式码本决定每张卡的状态转移, 每张卡在每问至多使用一次, 三个查询的已用集合相互独立, 目标是在精确到达集合的计划中全局最小化成本]
    removed_relations: [T3 使用旧的无翻转 G4]
    added_relations: [T3 显式指定为带 c/d/f/h 翻转的 G9]
    adaptation_required: [接受题面给出的新码本而非复制旧 T3, 对每问分别搜索完整状态×已用卡空间, 证明成本 11 的 Q2/Q3 五卡计划优于更早发现的高成本路径]
