  hints:
    schema_name: 证据谱系去重、双向佐证与局部独立性修订
    oracle_mindset: {insight: 为支持侧和反对侧分别建立来源等价类；两个方向都必须在去重后判门槛。, when_to_use: 同一主张同时存在支持链与反驳链时。}
