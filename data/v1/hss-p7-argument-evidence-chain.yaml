      J1B 转述 J1A，报道 J1C 依据所谓预算底稿 P2；真实性核验判定 P2 经过伪造，且没有反对报道。
      关于 J2，J2A、J2B、J2C 都追溯到同一匿名帖子 P3并支持 J2；
      J2D、J2E 分别依据互不相干的 P4、P5并反对 J2。
      关于 J3，两项支持和两项反对各自来自四个互不相干的来源 P6、P7、P8、P9。
      按 J1、J2、J3 输出“主张=标签”，以分号分隔。
    answer: {parts: [{type: label, value: J1=UNCORROBORATED}, {type: label, value: J2=REJECTED}, {type: label, value: J3=CONTESTED}]}
  mapping:
    objects: {工程一手记录: 新闻原始信源, 报告转引: 媒体转述, 真实性警报: 伪造核验, 支持假设: 支持新闻主张, 反对假设: 否定新闻主张}
    shared_relations: [转述不会创造新来源, 失效根使全部依赖证据失效, 支持与反对分别要求两个独立根, 双侧达标形成争议状态]
