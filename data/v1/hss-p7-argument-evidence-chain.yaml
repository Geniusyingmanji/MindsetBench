  paradigm: P7
  thread: E-信噪判别
  schema_id: provenance-aware-corroboration-v1
  schema_name: 证据谱系去重、双向佐证与局部独立性修订
  chain: hss-p7-argument-evidence-v1
  level: 3
  source: *hss_argument_source
  target:
    domain: 虚构艺术品来源委员会档案摘要
    problem: >-
      委员会规定：支持或反对一项来源判断都需至少两个彼此独立的档案家族；同一底本的图录、展签和新闻稿只算一个家族，
      对底本的真实性否定会传到所有复制品；不同底本若由同一送审包协调生成也只算一个家族。
      A 是“该物曾合法入境”：图录 A1 来自成交册 O1，
      展签 A2 抄自图录 A1，新闻稿 A3 又抄自 A2；海关底册 A4 来自另一档案 O2，四项均支持 A。
      B 是“捐赠者在界年以前拥有该物”：三份所有权支持材料最终都来自同一本失踪笔记 O3；
      两份反证分别来自税册 O4 和保险清单 O5。
      C 是“该物在指定年代修复”：两项支持来自 O6/O7，两项反对来自 O8/O9，四者独立。
      D 是“印章真实”：D1、D2 分别经 O10、O11 支持，但鉴定警报认定印章底片 O11 不真实。
      E 是“经销商独立核验过来源”：支持材料 E1、E2 分别追到 O12、O13，但编辑日志证明 O12/O13
      均由同一份经销商送审包生成；反对材料 E3、E4 分别来自互不相干的 O14、O15。
      F 是“修复剂符合年代”：联合实验报告 F1 同时综合独立原始记录 O16、O17并支持 F；反对报道 F2 来自 O18，
      后续报道 F3 只转引 F2。对 A—F 使用 SUPPORTED、REJECTED、CONTESTED、UNCORROBORATED。
    answer_format: A=<LABEL>;B=<LABEL>;C=<LABEL>;D=<LABEL>;E=<LABEL>;F=<LABEL>，其中 <LABEL> 必须使用题面给出的英文标签之一。
    answer: {parts: [{type: label, value: A=SUPPORTED}, {type: label, value: B=REJECTED}, {type: label, value: C=CONTESTED}, {type: label, value: D=UNCORROBORATED}, {type: label, value: E=REJECTED}, {type: label, value: F=SUPPORTED}]}
  mapping:
    objects: {工程假设: 来源判断, 一手记录: 档案底本, 报告转引链: 图录展签新闻稿链, 真实性警报: 鉴定警报, 正反报告: 支持与反对来源判断}
    shared_relations: [按最终底本形成来源等价类, 多级抄录不增加独立性, 支持与反对两侧分别应用双来源门槛, 两侧同时达标形成争议, 根真实性攻击向所有复制材料传播]
    added_relations: [不同底本可因同一协调送审包而再次合并, 单份综合报告可携带两个独立根]
    adaptation_required: [同时处理文件到根和根到生产家族两层去重, 不把综合报告的载体数量误当成来源数量]
    varied: [跨到艺术史与博物馆治理, 从规则清单变为档案摘要, 六项判断同时混合转引簇双向冲突底本攻击协调生产与多根报告]
  lure:
    problem: >-
      使用相同摘要，但把每份呈现出来的图录、展签、新闻稿或报告分别计数；不合并协调生成的底本，
      鉴定警报也只排除 O11 本身而不排除引用它的 D2。联合报告 F1 仍只按一份呈现材料计数。
    solution: >-
      A 为 SUPPORTED；B 的三份支持和两份反对形成 CONTESTED；C 为 CONTESTED；D 有两份支持而为 SUPPORTED；
      E 的两份支持和两份反对形成 CONTESTED；F 只有一份支持报告而有两份反对报道，为 REJECTED。
    answer: {parts: [{type: label, value: A=SUPPORTED}, {type: label, value: B=CONTESTED}, {type: label, value: C=CONTESTED}, {type: label, value: D=SUPPORTED}, {type: label, value: E=CONTESTED}, {type: label, value: F=REJECTED}]}
    why_surface_similar: 同一委员会、同一材料和同一四标签输出。
    why_structurally_different: lure 用材料载体代替来源家族，同时忽略根的二次聚类、攻击传播和一份报告的多根来源。
    wrong_schema_id: artifact-count-with-local-attack-01
  copy_probe:
    answer: {parts: [{type: label, value: A=SUPPORTED}, {type: label, value: B=CONTESTED}, {type: label, value: C=CONTESTED}, {type: label, value: D=SUPPORTED}, {type: label, value: E=CONTESTED}, {type: label, value: F=REJECTED}]}
    derivation: 对呈现材料逐份投票，没有恢复底本谱系、协调家族、攻击范围或综合报告的多根来源。
  hints:
    schema_name: 证据谱系去重、双向佐证与局部独立性修订
    oracle_mindset: {insight: 把“材料”改写成“底本—复制品”图；独立性属于底本家族，真实性攻击也作用于家族。, when_to_use: 图录、展签、新闻、译本或回忆录可能共享未明示的档案底本时。}
  verification:
    entrypoint: mindsetbench.verification.hss_argument_evidence:verify_hss_p7_arg_evidence_l3_01
    method: cross-genre-archive-provenance-reconstruction
  provenance: original synthetic case; all objects, archives, and committees are fictional
  verified: A 有 O1/O2；B 为一支持根对两反对根；C 双侧达标；D 只剩 O10；E 的两支持根合并而反对有两族；F 的单份报告携带 O16/O17 两根。

- id: HSS-P7-ARG-EVIDENCE-L4-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：目标题直接陈述“来自/转引/同源/失效”等整理后的来源关系，识别步骤为零；GPT-5.6-sol 三条件 100%。远域版本见 far-evidence-independence 系列（来源关系须从可行性推断）。
  paradigm: P7
  thread: E-信噪判别
  schema_id: provenance-aware-corroboration-v1
  schema_name: 证据谱系去重、双向佐证与局部独立性修订
  chain: hss-p7-argument-evidence-v1
  level: 4
  source: *hss_argument_source
  target:
    domain: 虚构匿名改革文书的历史归属争论
    problem: >-
      编纂者评估四项互不排他的历史主张。每一方向至少需要两个独立证据家族；转引同一文本不增加家族。
      新披露的编纂原则进一步说明：不同文本若由同一次协调性生产过程生成，仍只算一个独立证据家族。
      H1 主张林某主笔：日记 A1 来自底稿 A0，报刊 A2 转引 A1，私人信件 A4 来自底本 A3；
      但编辑通信证明，日记底稿 A0 与私人信件 A3 都是在同一次编辑简报后形成，三项均支持 H1，无反证。
      H2 主张乔某主笔：打印所账簿 B1 来自 B0，投递回执 B3 来自 B2，两项支持；
      打印所账簿 B0 与投递回执 B2 没有共同上游；另有独立回忆 B5 来自 B4并反对 H2。
      H3 主张二人共同创作：支持材料 C1/C3 来自 C0/C2，反对材料 C5/C7 来自 C4/C6；
      H3 的两项支持与两项反对分属四个证据家族。
      H4 主张官方委员会集体起草：印章证据 D1 来自底片 D0，登记证据 D3 来自底本 D2；
      流程簿显示印章底片 D0 与登记簿 D2 都由同一份委员会送审包生成，两项均支持 H4且无反证。
      H5 主张文书由赞助人授意：两项支持 E1/E3 来自底本 E0/E2，但二者都由同一份赞助人指令生成；
      两项反对 E5/E7 分别来自互不相干的 E4/E6。
      H6 主张定稿晚于罢工：两项支持 F1/F3 来自独立底本 F0/F2；两项反对 F5/F7 来自独立底本 F4/F6，
      但新鉴定认定 F4 为后配伪件，该结论使 F5 失效。按 H1—H6 分类。
