  lure:
    problem: >-
      对每个主张只数报道篇数；真实性核验仅删除被直接点名的底稿 P2，不沿依赖关系删除 J1C。输出三项标签。
    solution: J1 有三篇支持报道，标为 SUPPORTED；J2 三篇支持、两篇反对，标为 CONTESTED；J3 两侧均达标，仍为 CONTESTED。
    answer: {parts: [{type: label, value: J1=SUPPORTED}, {type: label, value: J2=CONTESTED}, {type: label, value: J3=CONTESTED}]}
