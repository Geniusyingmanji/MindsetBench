- id: HSS-P7-ARG-EVIDENCE-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：目标题直接陈述“来自/转引/同源/失效”等整理后的来源关系，识别步骤为零；GPT-5.6-sol 三条件 100%。远域版本见 far-evidence-independence 系列（来源关系须从可行性推断）。
  paradigm: P7
  thread: E-信噪判别
  schema_id: provenance-aware-corroboration-v1
  schema_name: 证据谱系去重、双向佐证与局部独立性修订
  chain: hss-p7-argument-evidence-v1
  level: 0
  source: &hss_argument_source
    domain: 工程事故证据审查手册
    problem: >-
      审查组对每个假设都先把报告追溯到最初的一手记录；转引、摘录或改写同一一手记录只算一个来源。
      真实性警报会使该一手记录及其全部转引失效。支持侧和反对侧分别至少需要两个独立来源：
      仅支持侧达标记 SUPPORTED，仅反对侧达标记 REJECTED，两侧都达标记 CONTESTED，
      两侧都未达标记 UNCORROBORATED。
      假设 A：A1 支持并来自 O1，A2 支持但只转引 A1，A3 支持并来自独立的 O2。
      假设 B：B1 支持并来自 O3，B2 转引 B1，B3 转引 B2；B4 反对并来自 O4，B5 反对并来自 O5。
      假设 C：C1、C2 支持并分别来自 O6、O7；C3、C4 反对并分别来自 O8、O9。
      假设 D：D1、D2 支持并分别来自 O10、O11，但真实性警报判定 O11 失效。
      按 A、B、C、D 顺序输出“假设=标签”，以分号分隔。
    solution: >-
      A 的 A1/A2 共享 O1，与 O2 合计两个支持来源，故 SUPPORTED。B 只有一个支持根 O3，
      却有两个反对根 O4/O5，故 REJECTED。C 两侧各有两个独立根，故 CONTESTED。
      D 的 O11 及其报告失效后只剩 O10，故 UNCORROBORATED。
    answer: A=SUPPORTED;B=REJECTED;C=CONTESTED;D=UNCORROBORATED
  target:
    domain: 单一工程日志的重复转述
    problem: >-
      仍按源审查手册判断假设 X。E1 直接整理自原始日志 O1；E2 只转引 E1；
      E3 又只摘录 E2，三份材料都支持 X，且没有反对材料。输出 X=标签。
    answer: {parts: [{type: label, value: X=UNCORROBORATED}]}
  mapping:
    objects: {一手记录: 原始日志 O1, 直接报告: E1, 转引报告: E2, 二次摘录: E3}
    shared_relations: [转引继承上游来源, 同一来源的多份文档只计一次, 达不到两个独立支持来源时不构成佐证]
    varied: [缩减为一个假设和一条三级转引链]
  lure:
    problem: 将 E1、E2、E3 当作三份彼此独立的支持材料，仍以两份为门槛。输出 X=标签。
    solution: 表面计数得到三份支持材料，超过门槛，因此标为 SUPPORTED。
    answer: {parts: [{type: label, value: X=SUPPORTED}]}
    why_surface_similar: 材料内容、方向和数量完全相同。
    why_structurally_different: lure 按文件计数，目标题按最终一手来源计数。
    wrong_schema_id: surface-document-majority-01
  copy_probe:
    answer: {parts: [{type: label, value: X=SUPPORTED}]}
    derivation: 未追踪 E2 与 E3 的转引链，把三次表达误作三个证据根。
  hints:
    schema_name: 证据谱系去重、双向佐证与局部独立性修订
    oracle_mindset: {insight: 先沿引用关系追到一手根，再按根去重；文档数量不是独立证据数量。, when_to_use: 多份报告可能互相转引或共同依赖同一材料时。}
  verification:
    entrypoint: mindsetbench.verification.hss_argument_evidence:verify_hss_p7_arg_evidence_l0_01
    method: executable-provenance-closure-and-surface-count-negative-control
  provenance: original synthetic case; all records and institutions are fictional
  verified: E1、E2、E3 最终只有 O1 一个根，因此 X 未获独立佐证。

