  hints:
    schema_name: 证据谱系去重、双向佐证与局部独立性修订
    oracle_mindset: {insight: 先画报道到原始信源的有向图；攻击根来源会同时移除所有后代，剩余根再分方向计数。, when_to_use: 新闻、证词或档案含转述且有真实性挑战时。}
