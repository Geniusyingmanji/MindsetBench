    varied: [从医疗跨到天文学, 特征从二元变为多档, 入选规则从并列改为比值阈值, 子集关联方向为正]
  lure:
    problem: >-
      另一片天区做了完整巡天，星表收录全部恒星。这片天区近处是暗淡的星云区、远处是明亮的星团：距离 1 的恒星
      真实亮度全为 1，距离 2 的全为 4，距离 3 的全为 9，距离 4 的全为 16，每档 20 颗。问全部恒星中距离与真实亮度的
      关系、星表中的关系，以及能否据星表推断这片天区远处的恒星本身普遍更亮。
    solution: 星表就是全体，两者都呈正相关，远处恒星确实更亮。
    answer:
