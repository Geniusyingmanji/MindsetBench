        - {type: label, value: SEL=NEG}
        - {type: label, value: CAUSAL=NO}
    derivation: 照搬源题结论“评论中的负相关是筛选造出来的，所以全体中无关”，没有用全部学员的人数重新算方向。
  hints:
    schema_name: 按任一特征筛选出的子集会呈现全体中不存在的关联
    oracle_mindset:
      insight: 筛选不只会凭空造出关联，还能把原本的正相关翻成负相关；一定要回到全部学员的人数表算方向，而不是套用“子集有关联则全体无关”。
      when_to_use: 拿到被筛选过的评论、投诉或反馈时。
    false_mindset:
      insight: 子集里的关联是假象，所以全体里一定没有关联。
      when_to_use: 把源题结论当作普适规则时。
  verification:
    entrypoint: mindsetbench.verification.far_selection_association:verify_far_berk_l3_01
    method: finite-table-conditional-proportions
  provenance: original synthetic case; platform and figures are fictional
  verified: 全体 30/40 对 20/60 为正相关；评论者 30/40 对 20/20，负相关。

