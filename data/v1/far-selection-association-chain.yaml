- id: FAR-BERK-L3-01
  version: "1.0"
  split: calibration
  paradigm: P3
  thread: H-因果拓扑
  schema_id: far-selection-association-v1
  schema_name: 按任一特征筛选出的子集会呈现全体中不存在的关联
  chain: far-selection-association-v1
  level: 3
  source: *far_berk_source
  target:
    domain: 在线课程平台的评论分析
    problem: >-
      平台复盘会材料：某门课 100 名学员中，对视频满意且对作业满意 30 人，只对视频满意 10 人，只对作业满意 20 人，
      两项都不满意 40 人。平台的经验是，只有对任一项满意的学员才会留下评论，两项都不满意的人直接流失不留言。
      运营同学读完评论后总结：评论里夸视频的学员对作业的满意率明显低于不夸视频的学员，建议“视频做得越精致，
      作业就要越简单，否则学员会不满”。
      问：全部学员中视频满意与作业满意的关系是正相关、无关还是负相关？留下评论的学员中呢？
      能否据评论认为提高视频质量会降低学员对作业的满意度？
    answer_format: "POP=<POS|NONE|NEG>;SEL=<POS|NONE|NEG>;CAUSAL=<YES|NO>"
    answer:
      parts:
        - {type: label, value: POP=POS}
        - {type: label, value: SEL=NEG}
        - {type: label, value: CAUSAL=NO}
  mapping:
    objects: {糖尿病: 视频满意, 胆囊炎: 作业满意, 住院规则: 任一项满意才留评论, 全镇居民: 全部学员, 院内医生: 运营同学}
    shared_relations: [按任一特征筛选去掉了两者皆无的人, 子集中出现负关联, 子集关联不能推因果, 基于子集关联的干预建议是错的]
    removed_relations: [全体中两特征无关]
    added_relations: [全体中两特征本来正相关, 筛选不仅制造关联还能把真实关联的方向翻转]
    adaptation_required: [不能照搬“全体中无关”的结论，必须用全部学员的人数表重新计算方向, 认识到筛选能翻转而非只是制造关联]
    varied: [从医疗跨到在线教育运营, 文体从病历改为复盘材料, 全体关系由无关改为正相关]
  lure:
    problem: >-
      另一门课 100 名学员：两项都满意 24 人，只对视频满意 16 人，只对作业满意 36 人，两项都不满意 24 人，
      同样只有任一项满意的学员才会留下评论。问全部学员中两项满意的关系、评论者中的关系，以及能否据评论认为
      提高视频质量会降低作业满意度。
    solution: 全体中视频满意者 40 人有 24 人作业满意、不满意者 60 人有 36 人，均为 60%，无关；评论者中 24/40 对 36/36，负相关；不能推因果。
    answer:
      parts:
        - {type: label, value: POP=NONE}
        - {type: label, value: SEL=NEG}
        - {type: label, value: CAUSAL=NO}
    why_surface_similar: 同一平台、同样的评论规则与问法。
    why_structurally_different: lure 的全体中两项无关，目标的全体中两项正相关而评论中被翻成负相关。
    wrong_schema_id: subset-artifact-means-no-association-01
  copy_probe:
