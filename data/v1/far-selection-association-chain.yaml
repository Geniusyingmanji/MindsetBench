# Far-transfer family: a subset selected on either of two traits shows an association
# the whole population does not have. Domains: hospital admission, health screening,
# hiring, online-course reviews, a flux-limited star catalogue.
# Decoy: read the observed subset's association as a fact about everyone.
- id: FAR-BERK-L0-01
  version: "1.0"
  split: calibration
  paradigm: P3
  thread: H-因果拓扑
  schema_id: far-selection-association-v1
  schema_name: 按任一特征筛选出的子集会呈现全体中不存在的关联
  chain: far-selection-association-v1
  level: 0
  source: &far_berk_source
    domain: 镇医院的住院病例
    problem: >-
      某镇 100 名居民中：同时患糖尿病与胆囊炎的有 20 人，只患糖尿病的 20 人，只患胆囊炎的 30 人，
      两种病都没有的 30 人。镇医院的收治规则是：只要患有其中任何一种病就住院。院内医生翻阅病历发现，
      住院患者里，糖尿病患者中患胆囊炎的比例明显低于非糖尿病患者。
      问：全镇居民中糖尿病与胆囊炎是正相关、无关还是负相关？住院患者中呢？能否据此认为糖尿病会降低胆囊炎的风险？
    solution: >-
      全镇：糖尿病患者 40 人中 20 人有胆囊炎，占一半；非糖尿病者 60 人中 30 人有胆囊炎，也占一半，两病无关。
      住院者去掉了“两病都没有”的 30 人：糖尿病住院者 40 人中仍是 20 人有胆囊炎，占一半；非糖尿病住院者只剩
      30 名胆囊炎患者，比例是百分之百。于是院内出现负相关，它完全来自“患任一种病就住院”这条筛选规则，
      与糖尿病是否保护胆囊无关。凡是只能看到按两个特征之一筛选出来的子集，就会看到这种凭空出现的关联。
    answer: POP=NONE;SEL=NEG;CAUSAL=NO
  target:
    domain: 镇医院的住院病例
    problem: >-
      另一个镇 100 名居民：同时患高血压与痛风 12 人，只患高血压 28 人，只患痛风 18 人，两者都没有 42 人。
      镇医院只要出现其中任何一种病就收治住院。院内统计显示住院患者里高血压患者中患痛风的比例低于非高血压患者。
      问：全镇居民中两病的关系是正相关、无关还是负相关？住院患者中呢？能否认为高血压降低痛风风险？
    answer_format: "POP=<POS|NONE|NEG>;SEL=<POS|NONE|NEG>;CAUSAL=<YES|NO>"
    answer:
      parts:
        - {type: label, value: POP=NONE}
        - {type: label, value: SEL=NEG}
        - {type: label, value: CAUSAL=NO}
  mapping:
    objects: {糖尿病: 高血压, 胆囊炎: 痛风, 住院规则: 住院规则, 全镇居民: 全镇居民}
    shared_relations: [全体中两特征无关, 按任一特征筛选去掉了两者皆无的人, 子集中出现负关联, 子集关联不能推因果]
    varied: [仅更换疾病与人数]
  lure:
    problem: >-
      一项随机分配的试验：100 名受试者随机一半服用新药 A，结果同时服药且发生 B 症状的 5 人，服药未发生 B 的 35 人，
      未服药发生 B 的 25 人，未服药也未发生 B 的 35 人。医院收治所有出现服药或 B 症状中任一情况的人。
      问：全体受试者中服药与 B 症状的关系？住院者中呢？能否认为服药降低 B 症状？
    solution: 服药者 40 人中 5 人发生 B，未服药者 60 人中 25 人发生 B，全体中负相关；住院者中同样负相关；随机分配下这是因果效应。
    answer:
      parts:
        - {type: label, value: POP=NEG}
        - {type: label, value: SEL=NEG}
        - {type: label, value: CAUSAL=YES}
    why_surface_similar: 同样的 2 乘 2 人数表、同样的住院规则与问法。
    why_structurally_different: lure 的全体中确有负相关且由随机分配保证因果；目标的全体中无关，负相关只在住院子集中。
    wrong_schema_id: subset-association-is-population-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: POP=NEG}
        - {type: label, value: SEL=NEG}
        - {type: label, value: CAUSAL=YES}
    derivation: 把住院患者中看到的负相关当成全镇的事实并解释为保护作用。
  hints:
    schema_name: 按任一特征筛选出的子集会呈现全体中不存在的关联
    oracle_mindset:
      insight: 先问“我看到的这些人是怎么被选进来的”；按任一特征入选会删掉两者皆无的人，凭空造出负关联。
      when_to_use: 只能看到被筛选过的子集时。
    false_mindset:
      insight: 病历里看到的比例差就是两种病之间的真实关系。
      when_to_use: 忽略入选规则时。
  verification:
    entrypoint: mindsetbench.verification.far_selection_association:verify_far_berk_l0_01
    method: finite-table-conditional-proportions
  provenance: original synthetic case
  verified: 全镇 12/40 与 18/60 均为 30%；住院 12/40 对 18/18，负相关。

