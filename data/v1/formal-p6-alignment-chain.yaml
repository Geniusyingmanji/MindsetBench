- id: FORMAL-P6-ALIGN-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：目标题与 source 共用同一两图边表记法，L3/L4 为重命名与一删一增；GPT-5.5 单样本 6/6，mb audit --surface 判定 surface-lexical-overlap。保留为图对齐执行力 sanity。
  paradigm: P6
  thread: K-角色映射
  schema_id: joint-typed-alignment-edit-sensitivity-v1
  schema_name: 锚定带类型关系图的联合对齐与单边编辑敏感性迁移
  chain: p6-alignment-sensitivity-v1
  level: 0
  source: &p6_alignment_source
    domain: 七角色匿名协议对齐基准
    problem: >-
      档案甲的节点 A1—A7、关系码 nex/vul/sor，有向记录为：
      A1-nex-A2；A1-vul-A5；A3-sor-A1；A4-nex-A1；A4-nex-A5；
      A4-sor-A7；A5-sor-A7；A5-vul-A1；A6-sor-A1；A6-vul-A5；
      A7-nex-A1；A7-nex-A6；A7-sor-A3；A7-sor-A6。
      档案乙的节点 B1—B7、关系码 %/@/#，有向记录为：
      B4-%-B7；B1-#-B2；B3-@-B4；B1-#-B4；B2-#-B1；B2-#-B3；
      B2-#-B5；B2-%-B4；B2-%-B5；B3-#-B2；B3-#-B4；B4-@-B1；
      B4-@-B3；B5-#-B4；B5-@-B1；B5-@-B3；B6-#-B2；B6-%-B1；
      B6-%-B3；B6-%-B4；另有噪声 B2-@-B7、B3-#-B1、B7-@-B4。
      已知 A1↔B4、A7↔B2。选择其余节点的一一映射和三种关系码的双射；
      每条甲记录映成乙中的同码直接记录得 1 分，乙的其余记录可为噪声。求唯一最高分映射，
      依次输出 A2—A6 对应节点及 nex/vul/sor 对应码。另保留局部编辑证书：
      若乙中 B6-%-B3 被 B1-@-B4 替换，新的唯一最高分映射是什么？
    solution: >-
      联合枚举 5! 个节点排列与 3! 个关系词典。baseline 唯一满分 14 的映射为
      A2↔B7、A3↔B1、A4↔B6、A5↔B3、A6↔B5，
      nex↔%、vul↔@、sor↔#；唯一 runner-up 得 13 分，它只交换 A3/A5 的像。
      指定替换删去 baseline 独占的一条支持边并补上 runner-up 缺失的一条边，故新唯一满分映射为
      A2↔B7、A3↔B3、A4↔B6、A5↔B1、A6↔B5，关系词典仍为 nex↔%、vul↔@、sor↔#。
    answer: B7;B1;B6;B3;B5;%;@;#
  target:
    domain: 三节点消息链
    problem: >-
      图甲记录 X1-a-X2、X2-b-X3。图乙记录 Y1-○-Y3、Y2-◇-Y1。
      已知 X1↔Y2、X3↔Y3。要求节点一一对应且关系码一一对应，最大化保留的同码有向记录。
      输出 X2 对应节点，以及 a、b 依次对应的乙关系码。
    answer:
      parts:
        - {type: label, value: Y1}
        - {type: string, value: ◇}
        - {type: string, value: ○}
  mapping:
    objects: {甲档案节点: 图甲节点, 乙档案节点: 图乙节点, 匿名关系码: 匿名关系码, 锚点: 两端锚点}
    shared_relations: [节点置换与关系码置换必须联合保持带类型有向三元组, 锚点固定整体方向]
    varied: [缩为唯一三节点链]
  lure:
    problem: >-
      使用同一对图和锚点，但关系码必须按两份记录中首次出现顺序固定：a↔○、b↔◇；
      输出同样三段结果。
    solution: 锚点使中间节点只能是 Y1；按规定的首次出现词典输出 Y1;○;◇。
    answer:
      parts:
        - {type: label, value: Y1}
        - {type: string, value: ○}
        - {type: string, value: ◇}
    why_surface_similar: 节点、记录、锚点和输出格式完全相同。
    why_structurally_different: lure 外生固定关系词典，目标需由有向三元组联合恢复词典。
    wrong_schema_id: first-occurrence-fixed-codebook-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: Y1}
        - {type: string, value: ○}
        - {type: string, value: ◇}
    derivation: 按记录出现顺序而非结构对应关系锁定关系码。
  hints:
    schema_name: 锚定带类型关系图的联合对齐与单边编辑敏感性迁移
    oracle_mindset: {insight: 锚点固定两端后，同时检查节点像与关系码像，使两条有向记录都被保留。, when_to_use: 实体名和关系名都匿名化时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p6_chain:verify_formal_p6_align_l0_01
    method: exhaustive-joint-node-predicate-alignment
  provenance: original; formal AR-hard chain using optimal-alignment margin and edit certificates
  verified: 唯一满分联合映射为 Y1;◇;○；首次出现词典给 Y1;○;◇。

