- id: FORMAL-P3-CAUSAL-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：目标题与 source 共用同一线性结构方程记法与系数表模板，L3/L4 只做节点重命名与单系数扰动；mb audit --surface 判定 surface-shared-template / surface-lexical-overlap。保留为 SCM 传播执行力 sanity。
  paradigm: P3
  thread: H-因果拓扑
  schema_id: linear-scm-path-sensitivity-v1
  schema_name: 线性结构因果模型的总效应路径和与局部系数灵敏度迁移
  chain: p3-causal-sensitivity-v1
  level: 0
  source: &p3_causal_source
    domain: 十模块干预基准
    problem: >-
      一个线性结构因果模型按 X,A,B,C,D,E,F,G,H,Y 的顺序无环生成。省略的项均为外生项；
      外生项之间即使相关，也不改变下面所问的 do-总效应。结构边及系数为：
      X→A:2，X→B:-1，X→C:3；A→B:2，A→D:4，A→E:-2；
      B→D:5，B→E:1，B→F:3；C→D:-2，C→E:2，C→F:-4；
      D→G:3，D→H:-1，D→Y:2；E→G:5，E→H:2，E→Y:-1；
      F→G:-2，F→H:4，F→Y:5；G→H:1，G→Y:6；H→Y:-3。
      求 τ=∂E[Y|do(X=x)]/∂x，并保留按拓扑顺序计算的各节点响应导数，
      以及边 E→G 的系数每增加 1 时 τ 的单位增量 q。
    solution: >-
      在干预图中令 d_X=1，再按拓扑序使用 d_v=Σ_{u→v}β_{uv}d_u；相关外生项和进入 X 的边
      不属于 do-总效应。得到
      (d_X,d_A,d_B,d_C,d_D,d_E,d_F,d_G,d_H,d_Y)
      =(1,2,3,3,17,5,-3,82,63,317)，故 τ=317。
      E→G 的局部灵敏度是“X 对 E 的效应”乘“G 对 Y 的下游效应”：5×(6+1×(-3))=15。
      若重命名模型仅把该系数从 5 改成 5+Δ，可直接用 τ'=317+15Δ。
    answer: "317"
  target:
    domain: 三变量剂量干预
    problem: >-
      系统关系为 M=2T+ε_M，Y=3T+4M+ε_Y。现在由外部强制把 T 设为 t，
      切断原来所有进入 T 的生成机制。求 ∂E[Y]/∂t。
    answer: {parts: [{type: number, value: "11"}]}
  mapping:
    objects: {处理 X: 剂量 T, 中介节点: 中介 M, 结局 Y: 结局 Y, 结构系数: 结构系数}
    shared_relations: [do-总效应等于所有从处理到结局的有向路径系数乘积之和, 也可按拓扑序传播响应导数]
    varied: [缩为一条直接路径和一条单中介路径]
  lure:
    problem: >-
      使用同一张 T→M、T→Y、M→Y 的有向图，但忽略边上的数值系数；求 T 到 Y 的有向路径条数。
    solution: 一条直接路径 T→Y 和一条中介路径 T→M→Y，共 2 条。
    answer: {parts: [{type: number, value: "2"}]}
    why_surface_similar: 节点和全部有向边完全相同。
    why_structurally_different: lure 只数路径，目标必须把每条路径的结构系数相乘后求和。
    wrong_schema_id: unweighted-causal-path-count-01
  copy_probe:
    answer: {parts: [{type: number, value: "2"}]}
    derivation: 把非零结构系数全部折叠为 1，只计算路径条数。
  hints:
    schema_name: 线性结构因果模型的总效应路径和与局部系数灵敏度迁移
    oracle_mindset: {insight: 在干预图上令处理响应为 1，按拓扑序传播导数；等价于对每条有向因果路径的系数乘积求和。, when_to_use: 线性无环 SCM 询问 do-总效应而非观测回归时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p3_chain:verify_formal_p3_causal_l0_01
    method: dynamic-total-effect-and-explicit-path-enumeration
  provenance: original; formal AR-hard chain using a reusable path-response certificate
  verified: 拓扑动态规划与显式路径枚举均得 3+2×4=11；无权路径数为 2。

