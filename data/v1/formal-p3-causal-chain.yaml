  target:
    domain: 重命名的十站信号干预网
    problem: &p3_full_target >-
      信号站按 J,R,K,N,S,V,L,Q,P,W 的顺序无环生成。省略项均为外生扰动，且可能相关。
      结构边及系数按采集顺序记录为：
      N→S:-2，V→Q:5，Q→W:6，J→N:3，V→W:-1，S→Q:3；
      R→K:2，S→W:2，N→V:2，K→V:1，L→Q:-2，L→P:4；
      J→R:2，P→W:-3，R→V:-2，Q→P:1，K→S:5，L→W:5；
      K→L:3，R→S:4，N→L:-4，V→P:2，J→K:-1，S→P:-1。
      J 还受一个未列名背景量影响，该背景量也直接影响 W。现在外部强制把 J 设为 j，
      切断原来所有进入 J 的生成机制。求 ∂E[W]/∂j。
