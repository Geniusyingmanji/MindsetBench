- id: FORMAL-P5-LATENT-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：L0–L2 为同域或重命名的码本恢复，L3 只隐藏一张卡的改动，难度来自日志枚举计算量而非框架识别；mb audit --surface 判定 surface-shared-template。L4 保留为跨表征 challenge。
  paradigm: P5
  thread: J-潜在操作
  schema_id: latent-affine-codebook-planning-v1
  schema_name: 从局部观测联合恢复匿名仿射操作并在关系编辑后重规划
  chain: p5-latent-affine-transfer-v1
  level: 0
  source: &latent_source
    domain: 八位基因开关校准
    problem: >-
      状态是 b1…b8 的八位串。P(i1,…,i8) 输出原串第 i1,…,i8 位，再与掩码逐位异或；
      因而 F=P(...)⊕m 是 GF(2) 上的仿射变换。八个匿名程序 S1—S8 分别实现 F1—F8 中不同的一项。
      候选变换：F1=P(2,3,4,5,6,7,8,1)⊕00000000；F2=P(8,1,2,3,4,5,6,7)⊕00000000；
      F3=P(8,7,6,5,4,3,2,1)⊕00000000；F4=P(2,1,4,3,6,5,8,7)⊕00000000；
      F5=P(1,2,3,4,5,6,7,8)⊕10110110；F6=P(1,2,3,4,5,6,7,8)⊕01101001；
      F7=P(2,4,1,3,6,8,5,7)⊕00000000；F8=P(4,1,6,2,8,3,7,5)⊕11001010。
      单条日志可能兼容多项候选，但代码本是一一对应。校准日志：
      S1:00100011→11000100；S2:01111100→00111110；S3:10001000→00010001；
      S4:00000000→10110110；S5:01000001→10000010；S6:10010000→01100000；
      S7:01101010→11011101；S8:01001110→00100111。卡成本：
      S1[2]；S2[1]；S3[2]；S4[2]；S5[2]；S6[4]；S7[5]；S8[6]。
      Q1:初态=00000001;目标=11100001。每张卡至多使用一次，按输出顺序复合变换。
      求唯一最低成本序列；最后一行须严格写成 ANSWER: 成本;程序码>程序码>...。
    solution: >-
      对每条日志保留全部兼容候选，再施加八个程序与八个变换的一一对应约束；唯一代码本为
      S1=F3、S2=F2、S3=F1、S4=F5、S5=F4、S6=F7、S7=F8、S8=F6。
      在“八位状态×已用卡集合”上做一致代价搜索，唯一最优为 S3,S7,S2,S4,S5，
      代价 12；runner-up 代价 13。迁移时先按日志恢复目标代码本，不应仅按程序重命名复制该序列；
      若一项隐藏变换变化，需用新代码本重算最短路。
    answer: 12;S3>S7>S2>S4>S5
  target:
    domain: 四程序基因开关校准
    problem: >-
      状态仍是 b1…b8 的八位串，P(i1,…,i8) 输出原串第 i1,…,i8 位，再与掩码逐位异或。
      四个程序 A1—A4 分别实现四项候选中的不同一项。候选变换：
      F1=P(2,3,4,5,6,7,8,1)⊕00000000；F2=P(8,1,2,3,4,5,6,7)⊕00000000；
      F3=P(8,7,6,5,4,3,2,1)⊕00000000；F5=P(1,2,3,4,5,6,7,8)⊕10110110。
      校准日志：A1:00000001→00000010；A2:00000010→00000001；
      A3:00000000→10110110；A4:00000010→01000000。卡成本：
      A1[1]；A2[2]；A3[3]；A4[4]。Q1:初态=00000000;目标=11011010。
      每张卡至多使用一次，按输出顺序复合变换。求唯一最低成本序列；
      最后一行必须使用“ANSWER: 成本;程序码>程序码>...”格式，成本后只能用分号。
    answer:
      parts:
        - {type: number, value: "8"}
        - {type: string, value: A3>A4>A1}
  mapping:
    objects: {八位基因状态: 八位基因状态, 匿名程序: A1/A2/A3/A4, 候选仿射变换: F1/F2/F3/F5, 路径成本: 卡成本之和}
    shared_relations: [日志确定程序所实现的候选变换, 变换按输出次序复合, 每张卡至多一次, 在精确到达目标的序列中最小化成本]
    varied: [缩为四项候选且每条日志可局部唯一识别]
  lure:
    problem: 使用相同四项变换、日志、成本、初态和目标，但约定输出 A>B>C 表示实际先执行 C、再 B、最后 A；求该约定下的最低成本输出串。
    solution: 反向复合约定下，正确执行顺序 A3,A4,A1 应写成 A1>A4>A3，成本仍为 8。
    answer: {parts: [{type: number, value: "8"}, {type: string, value: A1>A4>A3}]}
    why_surface_similar: 候选、日志、成本、初态和目标完全相同。
    why_structurally_different: lure 只翻转输出串与实际复合顺序的关系；在真实题中该串落到 10110110。
    wrong_schema_id: reverse-affine-composition-order-01
  copy_probe:
    answer: {parts: [{type: number, value: "8"}, {type: string, value: A1>A4>A3}]}
    derivation: 把输出程序码当成从右向左执行，机械反转真实最优序列。
  hints:
    schema_name: 从局部观测联合恢复匿名仿射操作并在关系编辑后重规划
    oracle_mindset: {insight: 先由每条日志直接确定程序语义，再在状态与已用卡的乘积空间比较完整序列。, when_to_use: 操作语义可由局部输入输出唯一识别时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p5_latent:verify_formal_p5_latent_l0_01
    method: injective-codebook-enumeration-and-uniform-cost-affine-planning
  provenance: original synthetic latent-operation transfer chain
  verified: 四条日志均局部唯一；唯一最优 A3>A4>A1 成本 8，runner-up 成本 9。

