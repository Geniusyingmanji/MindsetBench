  source: *latent_source
  target:
    domain: 八站信号编织机的路由卡改版
    problem: >-
      状态是站位 a—h 中当前点亮者的集合。路由 G=取(x1,…,x8)△M 的含义是：
      新站位 a—h 依次复制旧站位 x1—x8 是否点亮，再把集合 M 中站位逐个翻转；△表示对称差。
      八张匿名路由卡 T1—T8 实现九项候选中的八项且互不重复，未使用项须由全部观测联合确定。
      候选路由：G1=取(b,c,d,e,f,g,h,a)△∅；G2=取(h,a,b,c,d,e,f,g)△∅；
      G3=取(h,g,f,e,d,c,b,a)△∅；G4=取(b,a,d,c,f,e,h,g)△∅；
      G5=取(a,b,c,d,e,f,g,h)△{a,c,d,f,g}；G6=取(a,b,c,d,e,f,g,h)△{b,c,e,h}；
      G7=取(b,d,a,c,f,h,e,g)△∅；G8=取(d,a,f,b,h,c,g,e)△{a,b,e,g}；
      G9=取(b,a,d,c,f,e,h,g)△{c,d,f,h}。单条观测可能兼容多项候选。观测记录：
      T7:{c,g,h}→{a,b,f}；T3:{a,d,f,g,h}→{b,d,e,f,g}；T2:{b,c,e,f}→{c,d,f,g}；
      T1:{c,d,f}→{b,d,e,f,h}；T6:{a,b,e,h}→{a,d,g,h}；T4:{a,b,c,d,e,f,g}→{b,e}；
      T5:{d,f,g,h}→{a,b,c,e}；T8:{a,b,f,h}→{a,c,e,f}。卡成本：
      T5[2]；T2[1]；T6[2]；T4[2]；T3[2]；T8[4]；T7[5]；T1[6]。
      对同一码本独立回答三问，每问从空的已用卡集合开始，每张卡至多一次，按输出顺序作用：
      Q1:初集={h};目标集={a,b,c,h}；Q2:初集={b,c,g,h};目标集={a,c,d,f,g,h}；
      Q3:初集={b,c,f,h};目标集={b,c,e,g}。求各问唯一最低成本序列；最后一行严格输出
      Q1成本;Q1卡码>...;Q2成本;Q2卡码>...;Q3成本;Q3卡码>...。
      无需展开全部码本排列或 256 个状态，只需简述各卡候选集合、唯一代码本和三问最优性结论；
      最后一行必须严格写成 ANSWER: <Q1成本>;<Q1卡串>;<Q2成本>;<Q2卡串>;<Q3成本>;<Q3卡串>，六段之间都用分号。
    answer:
      parts:
        - {type: number, value: "7"}
        - {type: string, value: T5>T3>T4>T2}
        - {type: number, value: "11"}
        - {type: string, value: T5>T3>T2>T8>T6}
        - {type: number, value: "11"}
        - {type: string, value: T8>T3>T2>T5>T6}
  mapping:
    objects: {源八位向量: 目标点亮站位集合, 位位置 b1…b8: 站位 a…h, 位排列 P: 新站位从旧站位取值, 异或掩码: 翻转集合的对称差, S1…S8: T5/T2/T6/T4/T3/T8/T7/T1}
    shared_relations: [位值 1 等价于相应站位属于集合, 输出位排列等价于新站位从指定旧站位复制成员关系, 逐位异或等价于与翻转集合取对称差, 单条观测只给候选集合而全部卡联合一一匹配, 每问独立限制每张卡至多一次并最小化成本]
    removed_relations: [T3 对应旧码本的无翻转邻站成对交换 G4]
