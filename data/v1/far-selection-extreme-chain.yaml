# Far-transfer family: the most extreme of many similar noisy units looks alarming even
# when every unit is ordinary; the number of units ranked decides whether the extreme is
# evidence, and a value picked because it was the maximum overstates the unit's level.
# Decoy: judge the worst unit as if it had been singled out in advance.
- id: FAR-EXTREME-L0-01
  version: "1.0"
  split: calibration
  paradigm: P1
  thread: E-信噪判别
  schema_id: far-selection-extreme-v1
  schema_name: 许多相似单位中的极值本身不是证据
  chain: far-selection-extreme-v1
  level: 0
  source: &far_extreme_source
    domain: 连锁餐饮的门店差评问责
    problem: >-
      某连锁餐饮有 25 家门店，上月每家各完成约 200 单。按历史经验，门店正常运营时每一单被差评的概率为 15%。
      月度差评榜首门店有 43 单差评。总部规则：只有当“所有门店都正常运营时，仍然至少有一家门店差评数达到该值”
      的概率低于 5%，才对榜首门店启动整改。问：是否启动整改？差评数至少达到多少单才应启动？
    solution: >-
      单看这家店，200 单里出 43 单差评在正常时的概率约 0.9%，看起来很罕见。但榜首是从 25 家里挑出来的：
      25 家都正常时，至少有一家达到 43 单的概率是 1 减去 0.991 的 25 次方，约 20%，一点也不罕见。
      因此不启动整改；要让“25 家都正常却至少一家达到该数”的概率低于 5%，差评数至少要 46 单。
      被挑出来的极值需要用“从多少个里挑”来折算，不能当成事先指定的一家去看。
    answer: ACT=NO;MIN_COUNT=46
  target:
    domain: 连锁餐饮的门店差评问责
    problem: >-
      另一家连锁有 30 家门店，上月每家各完成约 150 单，正常运营时每单差评概率为 12%。差评榜首门店有 29 单差评。
      总部规则相同：只有当所有门店都正常时至少一家达到该差评数的概率低于 5%，才启动整改。
      问：是否启动？差评数至少多少单才应启动？
    answer_format: "ACT=<YES|NO>;MIN_COUNT=<整数>"
    answer:
      parts:
        - {type: label, value: ACT=NO}
        - {type: label, value: MIN_COUNT=32}
  mapping:
    objects: {25 家门店: 30 家门店, 200 单: 150 单, 15% 差评率: 12% 差评率, 榜首门店: 榜首门店}
    shared_relations: [榜首是从多个单位中挑出的极值, 判断标准是全部正常时至少一个单位达到该值的概率, 单个单位的罕见概率要按单位数折算]
    varied: [仅更换门店数、单量与差评率]
  lure:
    problem: >-
      同一连锁的另一次检查：总部事先只指定抽查一家门店（不看排行榜），该店 150 单里有 29 单差评，
      正常差评率 12%。规则：该店正常时差评数达到该值的概率低于 5% 即启动整改。问是否启动，以及至少多少单才启动。
    solution: 事先指定的一家店不涉及挑选，直接看单店概率：29 单的概率约 0.6% 低于 5%，启动；至少 26 单即启动。
    answer:
      parts:
        - {type: label, value: ACT=YES}
        - {type: label, value: MIN_COUNT=26}
    why_surface_similar: 同一连锁、同样单量、差评率与规则措辞。
    why_structurally_different: lure 的门店是事先指定的，目标的门店是从 30 家中挑出的榜首。
    wrong_schema_id: single-unit-tail-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: ACT=YES}
        - {type: label, value: MIN_COUNT=26}
    derivation: 只算榜首这一家在正常时达到 29 单的概率约 0.6%，低于 5% 就启动，没有折算“从 30 家里挑最差”。
  hints:
    schema_name: 许多相似单位中的极值本身不是证据
    oracle_mindset:
      insight: 先问榜首是从多少个单位里挑出来的，再算“全部正常时至少一个达到该值”的概率。
      when_to_use: 对排行榜首位、最差或最好的那个单位做判断时。
    false_mindset:
      insight: 这家店的差评数在正常时极不可能出现，所以它有问题。
      when_to_use: 把榜首当作事先指定的一家看时。
  verification:
    entrypoint: mindsetbench.verification.far_selection_extreme:verify_far_extreme_l0_01
    method: exact-binomial-family-wise-tail
  provenance: original synthetic case
  verified: 单店概率 0.64%，30 家中至少一家概率 17.6%；折算后至少 32 单。

