  source: *far_extreme_source
  target:
    domain: 区教育局的统考质量通报
    problem: >-
      区教育局本学期统考质量通报摘要。全区 32 所学校参加，每校约 120 名学生。依据往年数据，学生个体未达标的
      概率为 10%，各校之间不存在系统性差异。本次统考中，未达标人数最多的一所学校有 21 名未达标。
      《质量通报办法》第 9 条写明约谈的触发条件：假定全区各校都处于往年水平，如果“至少有一所学校的未达标人数
      不低于本次最高值”这件事发生的概率不到 5%，教育局才约谈该校校长。
      请判断教育局应否约谈，并给出按该办法计算的约谈线，即未达标人数至少多少名才会触发约谈。
    answer_format: "ACT=<YES|NO>;MIN_COUNT=<整数>"
    answer:
      parts:
        - {type: label, value: ACT=NO}
        - {type: label, value: MIN_COUNT=24}
  mapping:
    objects: {门店: 学校, 订单: 学生, 差评: 未达标, 差评榜首: 未达标人数最多的学校, 总部整改: 教育局约谈}
    shared_relations: [榜首是从多个单位中挑出的极值, 判断标准是全部正常时至少一个单位达到该值的概率, 单个单位的罕见概率要按单位数折算, 门槛按单位数重新计算]
    varied: [从餐饮运营跨到教育评估, 文体从题面改为质量通报, 单位数与基准率更换]
  lure:
    problem: >-
      同一区教育局对事先确定的一所重点督导校单独复核：该校 120 名学生中 21 名未达标，往年个体未达标概率 10%。
      规则：该校处于往年水平时未达标人数达到该值的概率低于 5% 即约谈。问是否约谈，以及至少多少名才约谈。
    solution: 事先确定的一校不涉及挑选，单校概率约 0.8% 低于 5%，约谈；至少 19 名即约谈。
    answer:
      parts:
        - {type: label, value: ACT=YES}
        - {type: label, value: MIN_COUNT=19}
    why_surface_similar: 同一教育局、同样人数、比例与规则措辞。
    why_structurally_different: lure 的学校事先确定，目标的学校是 32 校中的极值。
    wrong_schema_id: single-unit-tail-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: ACT=YES}
        - {type: label, value: MIN_COUNT=19}
    derivation: 只算这所学校在往年水平下出现 21 名未达标的概率约 0.8%，没有折算从 32 校中挑最差。
