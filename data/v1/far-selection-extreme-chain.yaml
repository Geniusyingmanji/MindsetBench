- id: FAR-EXTREME-L3-01
  version: "1.0"
  split: sanity
  paradigm: P1
  thread: E-信噪判别
  schema_id: far-selection-extreme-v1
  schema_name: 许多相似单位中的极值本身不是证据
  chain: far-selection-extreme-v1
  level: 3
  source: *far_extreme_source
  target:
    domain: 规模不等学校的未达标率排名
    problem: >-
      另一区有 20 所学校参加统考：5 所 40 人的村小、10 所 120 人的镇中心校、5 所 300 人的城区校。
      按往年水平，学生个体未达标概率为 10%，各校无系统差异。教育局按“未达标率”排名，榜首是一所 40 人的村小，
      有 10 名未达标。约谈规则：只有当全区各校都处于往年水平时，仍至少有一校的未达标率不低于该比例的概率低于 5%，
      才约谈榜首学校。问：是否约谈？若榜首换成另一所 40 人的学校，它至少要有多少名未达标才应被约谈？
    answer_format: "ACT=<YES|NO>;MIN40=<整数>"
    answer:
      parts:
        - {type: label, value: ACT=YES}
        - {type: label, value: MIN40=10}
  mapping:
    objects: {门店: 学校, 订单: 学生, 差评: 未达标, 差评榜首: 未达标率最高的学校, 单位数: 三种规模共 20 校}
    shared_relations: [榜首是从多个单位中挑出的极值, 判断标准是全部正常时至少一个单位达到该值的概率, 单个单位的罕见概率要按单位数折算, 门槛按单位数重新计算]
    removed_relations: [各单位规模相同因而同一比例对应同一概率]
    added_relations: [单位规模不同：同一比例在大校几乎不可能而在小校较易出现, 每所学校要按自己的人数算达到该比例的概率再合并]
    adaptation_required: [不能把 20 所学校都按榜首的 40 人计算, 对三种规模分别求达到该比例所需人数与概率再合并, 大校对合并概率几乎没有贡献这一点决定了结论方向]
    varied: [从等规模单位改为三种规模, 排名指标从人数改为比例, 门槛问题限定为 40 人学校]
  lure:
    problem: >-
      同一区的另一次统考中，参加的 20 所学校规模都是 40 人，往年未达标概率 10%。未达标率榜首学校有 10 名未达标。
      规则相同。问是否约谈，以及一所 40 人的学校至少多少名未达标才应被约谈。
    solution: 各校规模相同，20 校都正常时至少一校达到 10 名的概率约 8%，不约谈；至少 11 名才约谈。
    answer:
      parts:
        - {type: label, value: ACT=NO}
        - {type: label, value: MIN40=11}
    why_surface_similar: 同样 20 所学校、同一比例与规则措辞。
    why_structurally_different: lure 各校规模相同，目标中 15 所大校几乎不可能达到 25%，合并概率反而更小。
    wrong_schema_id: equal-size-family-tail-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: ACT=NO}
        - {type: label, value: MIN40=11}
    derivation: 照搬源题的等规模公式，把 20 所学校都按榜首的 40 人计算，得到约 8% 不约谈、至少 11 名。
  hints:
    schema_name: 许多相似单位中的极值本身不是证据
    oracle_mindset:
      insight: 折算“从多少个里挑”时，每个单位要按自己的规模算达到该比例的概率；大校几乎贡献不了这个比例，合并概率主要来自 5 所小校。
      when_to_use: 用比例排名且单位规模差异很大时。
    false_mindset:
      insight: 有 20 所学校就按 20 个同样的单位折算。
      when_to_use: 忽略规模差异时。
  verification:
    entrypoint: mindsetbench.verification.far_selection_extreme:verify_far_extreme_l3_01
    method: heterogeneous-size-family-wise-tail
  provenance: original synthetic case; district and schools are fictional
  verified: 按各校规模合并的概率 2.5% 低于 5%；全按 40 人计算为 9.7%；40 人学校门槛分别为 10 与 11 名。

