- id: FORMAL-P5-CERT-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：L3 为十六操作卡的完全重命名同构，L4 仅把一张卡的登记效果从 v 改为 p；GPT-5.6-sol 单样本 L0–L3 全对。保留为最优性证书格式与路径计数 sanity，不作为迁移距离证据。
  paradigm: P5
  thread: J-操作证书
  schema_id: stateful-planning-optimality-certificate-edit-v1
  schema_name: 有状态操作规划的最优层与次优层证书迁移
  chain: p5-stateful-planning-certificate-v1
  level: 0
  source: &p5_certificate_source
    domain: 十标记工艺的完整搜索证书
    problem: >-
      一个状态是当前为真的标记集合。每项操作至多执行一次；仅当“需”中的标记全为真且“禁”中的标记全为假时才可执行。
      执行时先删除“清”中的标记，再加入“置”中的标记，各效果同时生效。“-”表示空集。
      初态=A,B,C;终态必须含=B,I,J;不得含=A,D,E。操作表：
      S1[2]:需=B;禁=-;置=D;清=C；S2[2]:需=A;禁=-;置=E;清=B；
      S3[3]:需=D,E;禁=-;置=F;清=A；S4[2]:需=F;禁=-;置=G;清=D；
      S5[2]:需=G;禁=D;置=H;清=E；S6[2]:需=H;禁=-;置=I;清=G；
      S7[1]:需=I;禁=-;置=J;清=-；S8[1]:需=J;禁=-;置=B;清=-；
      S9[7]:需=A;禁=-;置=D,E;清=C；S10[7]:需=F;禁=-;置=G,I;清=B,D,E；
      S11[6]:需=G;禁=D;置=I,J;清=B,E；S12[4]:需=I;禁=-;置=B;清=J；
      S13[4]:需=J;禁=-;置=B,I;清=-；S14[5]:需=F;禁=-;置=H;清=A,B,D,E；
      S15[8]:需=A;禁=-;置=F,D;清=B,C；S16[5]:需=H;禁=-;置=B,J;清=G,I。
      计划首次满足完整终态即停止。输出六段：最优成本;唯一最优操作串;更低成本目标路径数;最优层目标路径数;次优成本;次优层目标路径数。操作串内部只能用 >，不能用逗号。
    solution: >-
      在状态、已用操作集合与完整有序路径上做正成本一致代价枚举。不能只按状态去重；即使状态和已用集合相同，
      等成本的不同有序路径必须分别保留并计数。路径首次满足正负终态即停止。完整处理成本 15 及 16 两层：
      成本 15 前没有目标路径，成本 15 唯一，成本 16 有三条。
      证书：C*=15；P*=S1>S2>S3>S4>S5>S6>S7>S8；N<C*=0；N=C*=1；Cnext=16；Nnext=3。
    answer: 15;S1>S2>S3>S4>S5>S6>S7>S8;0;1;16;3
  target:
    domain: 三标记封装流程证书
    problem: >-
      状态规则与源题相同，每项操作至多一次，“-”为空集。初态=x;终态必须含=z;不得含=-。操作表：
      A1[1]:需=x;禁=-;置=y;清=-；A2[1]:需=y;禁=-;置=z;清=-；A3[3]:需=x;禁=-;置=z;清=-。
      计划首次满足完整终态即停止。输出六段：最优成本;唯一最优操作串;更低成本目标路径数;最优层目标路径数;次优成本;次优层目标路径数。操作串内部只能用 >，不能用逗号。
    answer:
      parts:
        - {type: number, value: "2"}
        - {type: string, value: A1>A2}
        - {type: number, value: "0"}
        - {type: number, value: "1"}
        - {type: number, value: "3"}
        - {type: number, value: "1"}
  mapping:
    objects: {状态标记: x/y/z, 操作: A1/A2/A3, 搜索节点: 状态×已用操作×完整路径, 成本层证书: 最优层与首个次优层的路径数}
    shared_relations: [正负前置条件决定操作是否可执行, 清除与置位共同改变状态, 每项至多一次, 首次满足完整终态即停止, 正成本一致代价枚举按成本层证明最优性, 等成本不同路径分别计数]
    varied: [目标缩为三操作两步依赖链, 最优层和次优层各只有一条路径]
  lure:
    problem: 使用相同初态、目标、操作与成本，但把操作当作无前置、无清除的独立置位集合；同样输出六段集合覆盖证书。
    solution: 在独立置位模型中，A2 可单独置 z，成本 1 唯一；成本 2 的首个次优集合为 A1,A2。
    answer: {parts: [{type: number, value: "1"}, {type: string, value: A2}, {type: number, value: "0"}, {type: number, value: "1"}, {type: number, value: "2"}, {type: number, value: "1"}]}
    why_surface_similar: 初态、目标、三项操作、成本和六段证书格式完全相同。
    why_structurally_different: lure 删除 A2 对 y 的前置条件，把有序状态计划降为独立集合覆盖。
    wrong_schema_id: monotone-cover
  copy_probe:
    answer: {parts: [{type: number, value: "1"}, {type: string, value: A2}, {type: number, value: "0"}, {type: number, value: "1"}, {type: number, value: "2"}, {type: number, value: "1"}]}
    derivation: 忽略执行条件后直接选择 A2，并在错误模型内计算成本层。
  hints:
    schema_name: 有状态操作规划的最优层与次优层证书迁移
    oracle_mindset: {insight: 按成本层枚举可执行有序路径，首次到达目标即停止，并继续到首个次优目标层。, when_to_use: 需要同时证明最优值、唯一性和 runner-up 间隔时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p5_certificate:verify_formal_p5_cert_l0_01
    method: exhaustive-stateful-and-monotone-certificate-enumeration
  provenance: certificate reformulation of FORMAL-P5-PLAN-L0-01
  verified: 真实证书 2;A1>A2;0;1;3;1；独立覆盖错误证书 1;A2;0;1;2;1。

