- id: FORMAL-P5-CERT-L4-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：L3 为十六操作卡的完全重命名同构，L4 仅把一张卡的登记效果从 v 改为 p；GPT-5.6-sol 单样本 L0–L3 全对。保留为最优性证书格式与路径计数 sanity，不作为迁移距离证据。
  paradigm: P5
  thread: J-操作证书
  schema_id: stateful-planning-optimality-certificate-edit-v1
  schema_name: 有状态操作规划的最优层与次优层证书迁移
  chain: p5-stateful-planning-certificate-v1
  level: 4
  source: *p5_certificate_source
  target:
    domain: 单效果改版操作网证书
    problem: >-
      当前登记项构成系统状态，每张操作卡最多使用一次。要求项必须已登记、阻断项必须未登记；使用时先注销再登记，“无”为空集。
      初始登记=q,v,p;验收须有=v,x,y;须无=q,t,w。操作卡：
      K13（费用4）只有 y 都已登记且 无 均未登记时可用；用后登记 v,x，并注销 无。
      K5（费用7）只有 r 都已登记且 无 均未登记时可用；用后登记 u,x，并注销 v,t,w。
      K2（费用2）只有 q 都已登记且 无 均未登记时可用；用后登记 w，并注销 v。
      K16（费用5）只有 s 都已登记且 无 均未登记时可用；用后登记 v,y，并注销 u,x。
      K9（费用2）只有 u 都已登记且 t 均未登记时可用；用后登记 s，并注销 w。
      K7（费用2）只有 v 都已登记且 无 均未登记时可用；用后登记 t，并注销 p。
      K12（费用4）只有 x 都已登记且 无 均未登记时可用；用后登记 v，并注销 y。
      K3（费用1）只有 y 都已登记且 无 均未登记时可用；用后登记 p，并注销 无。
      K11（费用6）只有 u 都已登记且 t 均未登记时可用；用后登记 x,y，并注销 v,w。
      K1（费用2）只有 s 都已登记且 无 均未登记时可用；用后登记 x，并注销 u。
      K15（费用8）只有 q 都已登记且 无 均未登记时可用；用后登记 r,t，并注销 v,p。
      K6（费用1）只有 x 都已登记且 无 均未登记时可用；用后登记 y，并注销 无。
      K8（费用7）只有 q 都已登记且 无 均未登记时可用；用后登记 t,w，并注销 p。
      K4（费用2）只有 r 都已登记且 无 均未登记时可用；用后登记 u，并注销 t。
      K14（费用5）只有 r 都已登记且 无 均未登记时可用；用后登记 s，并注销 q,v,t,w。
      K10（费用3）只有 t,w 都已登记且 无 均未登记时可用；用后登记 r，并注销 q。
      计划首次满足完整验收即停止。输出六段：最优成本;唯一最优卡串;更低成本目标路径数;最优层目标路径数;次优成本;次优层目标路径数。卡串内部只能用 >，不能用逗号。
    answer:
      parts:
        - {type: number, value: "17"}
        - {type: string, value: K8>K10>K4>K9>K1>K6}
        - {type: number, value: "0"}
        - {type: number, value: "1"}
        - {type: number, value: "18"}
        - {type: number, value: "3"}
  mapping:
    objects: {A/B/C/D/E: q/v/p/t/w, F/G/H/I/J: r/u/s/x/y, S1…S8: K7/K2/K10/K4/K9/K1/K6/K3, S9…S16: K8/K5/K11/K12/K13/K14/K15/K16, 旧证书: 编辑前成本 15/16 的目标路径层, 新证书: 编辑后成本 17/18 的目标路径层}
    shared_relations: [十个状态标记和十六项操作重命名保持, K3 以外的成本、前置和效果保持, 初态与正负终态保持, 路径首次满足验收即停止, 等成本不同路径分别计数]
    removed_relations: [K3 在 y 成立后恢复终态所需的 v]
    added_relations: [K3 在 y 成立后重复登记 p]
    adaptation_required: [重放旧成本 15 计划发现最终缺 v, 放弃旧 15/16 成本层证书, 完整枚举新版成本 17 与 18 目标层]
    varied: [完整重命名后只编辑一个操作效果, 最优路径与 runner-up 三重性同时切换]
  lure:
    problem: 使用相同重编号和费用，但冻结编辑前 K3 登记 v 的关系，并沿用编辑前完整成本层证书。
    solution: 在 K3 登记 v 的版本中，唯一成本 15 路径以 K3 恢复 v；成本 16 有三条。
    answer: {parts: [{type: number, value: "15"}, {type: string, value: K7>K2>K10>K4>K9>K1>K6>K3}, {type: number, value: "0"}, {type: number, value: "1"}, {type: number, value: "16"}, {type: number, value: "3"}]}
    why_surface_similar: 状态名、卡号、费用、初态、目标和十五张未编辑卡完全相同。
    why_structurally_different: lure 冻结 K3 登记 v；真实 K3 登记 p，使整个旧证书不再是目标路径证书。
    wrong_schema_id: stale-pre-edit-certificate
  copy_probe:
    answer: {parts: [{type: number, value: "15"}, {type: string, value: K7>K2>K10>K4>K9>K1>K6>K3}, {type: number, value: "0"}, {type: number, value: "1"}, {type: number, value: "16"}, {type: number, value: "3"}]}
    derivation: 直接复制 source 经重命名后的编辑前最优层和次优层。
  hints:
    schema_name: 有状态操作规划的最优层与次优层证书迁移
    oracle_mindset: {insight: 先重放旧证书识别 K3 单效果变化，再在新版状态空间重新枚举最优与首个次优目标层。, when_to_use: 已解规划结构发生一个局部关系编辑且可能改变整层最优路径时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p5_certificate:verify_formal_p5_cert_l4_01
    method: exhaustive-certificate-single-effect-diff-and-stale-replay
