- id: HSS-ACTIVE-P8-RITUAL-L4-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：题面给出完整的候选×查询回复矩阵和整理好的规则层级，只剩查询优化计算；GPT-5.6-sol target-only 12/12。
  paradigm: P8
  thread: J-主动机制判别
  schema_id: mechanism-ritual-active-query-v1
  schema_name: 从制度机制迁移到铭文实验设计
  level: 4
  source:
    domain: 平台治理承诺与信号审查
    problem: >-
      判断四项安排的机制。行动发生在观察者回应之前，承诺型能承担而机会主义类型无法承受，
      且成本由行动者承担时为 SEPARATING_SIGNAL；行动在回应前永久删除日后背离选项时为 CREDIBLE_COMMITMENT；
      两种类型都能同样承担的可见行动为 POOLING_SIGNAL；行动太晚、不可行或未改变激励时为 NONCREDIBLE。
      S1 是回应前由本人承担且机会主义类型无法承受的押金；S2 在回应前销毁唯一背离密钥；
      S3 两类都能承担；S4 在回应后才发生。另规定第三方全额补偿会消除由自付成本产生的分离。
      输出 S1—S4 的标签。
    solution: >-
      S1 以类型差异形成分离；S2 删除背离选择而形成承诺；S3 两类均可采取而混同；S4 太晚而不可信。
    answer: S1=SEPARATING_SIGNAL;S2=CREDIBLE_COMMITMENT;S3=POOLING_SIGNAL;S4=NONCREDIBLE
  target:
    domain: 虚构海港誓约铭文的实验考古
    problem: >-
      六种铭文复原描述了商队首领在港城回应之前或之后举行的仪式：
      第一种是在回应前自付献祭，守约者能承担而逐利背约者无法承担；
      第二种是在回应前熔毁唯一可用于改换盟约的印模，且无法恢复；
      第三种是在回应前自付献祭，但守约者和背约者都能同样承担；
      第四种献祭虽昂贵，却在港城已经回应后才举行；
      第五种表面同第一种，但商会第三方全额补偿全部献祭成本；
      第六种表面同第二种，但首领保留可单方面恢复印模的母模。
      标签为 SEPARATING_SIGNAL、CREDIBLE_COMMITMENT、POOLING_SIGNAL、NONCREDIBLE。

      六种铭文复原只有一种为真，且只能选一种颜料实验。回复表为：
      第一种 Q1红/Q2红/Q3红/Q4红；第二种 Q1红/Q2蓝/Q3蓝/Q4蓝；
      第三种 Q1红/Q2绿/Q3绿/Q4绿；第四种 Q1蓝/Q2金/Q3金/Q4绿；
      第五种 Q1蓝/Q2红/Q3绿/Q4蓝；第六种 Q1蓝/Q2蓝/Q3金/Q4红。
      在 Q1、Q2、Q3、Q4 中选择使最坏情况下同一颜色分支内仍可能的最终机制标签种类最少的实验；
      若每种颜色都唯一确定标签则优先。报告实验以及红、蓝、绿、金各对应的标签。
    answer_format: QUERY=<Q1|Q2|Q3|Q4>;IF_RED=<LABEL>;IF_BLUE=<LABEL>;IF_GREEN=<LABEL>;IF_GOLD=<LABEL>
    answer: QUERY=Q3;IF_RED=SEPARATING_SIGNAL;IF_BLUE=CREDIBLE_COMMITMENT;IF_GREEN=POOLING_SIGNAL;IF_GOLD=NONCREDIBLE
  mapping:
    objects:
      行动者: 商队首领
      观察者: 港城议事者
      昂贵行动: 自付献祭
      背离选项: 改换盟约的印模
      第三方补偿者: 商会
      可见制度安排: 铭文记载的仪式
    shared_relations:
      - 行动必须发生在观察者回应之前
      - 类型间承受能力差异使成本信号产生分离
      - 两类都能承担的行动形成混同
      - 不可逆删除背离选项形成可信承诺
      - 补偿或可逆性会改变表面相同仪式的机制
      - 主动实验应最大化对机制标签而非铭文编号的信息
    added_relations:
      - 第三方全额补偿使原本分离的献祭变为混同
      - 保留母模使表面销毁不再真正删除背离选项
      - 颜料实验预算限制为一次
    removed_relations:
      - 不再直接要求逐项分类六种仪式
    adaptation_required:
      - 先依据时序成本承担类型差异和可逆性判定六种机制，再选择能区分机制的实验
      - 不把可见形式相同误当成激励后果相同
    varied:
      - 从数字平台治理跨到古代港口仪式与实验考古
      - 从静态机制分类改为一次实验设计和分支决策
  lure:
    problem: >-
      保留六种铭文复原和实验回复表，但只按可见仪式形式分类：
      第五种仍按第一种视为分离信号，第六种仍按第二种视为可信承诺，不考虑补偿或恢复母模。
      仍选择最坏情况下机制歧义最小的实验。
    solution: >-
      该表面分类使第一与第五种同为分离、第二与第六种同为承诺；Q2 的四色恰好对应四种表面机制。
    answer: QUERY=Q2;IF_RED=SEPARATING_SIGNAL;IF_BLUE=CREDIBLE_COMMITMENT;IF_GREEN=POOLING_SIGNAL;IF_GOLD=NONCREDIBLE
    why_surface_similar: 仪式动作、六种复原和颜料结果完全相同。
    why_structurally_different: 只按可见形式分类，忽略成本由谁承担以及背离选项是否真正不可恢复。
    wrong_schema_id: visible-ritual-form-active-query-01
  copy_probe:
    answer:
      parts:
        - {type: string, value: QUERY=Q2}
        - {type: string, value: IF_RED=SEPARATING_SIGNAL}
        - {type: string, value: IF_BLUE=CREDIBLE_COMMITMENT}
        - {type: string, value: IF_GREEN=POOLING_SIGNAL}
        - {type: string, value: IF_GOLD=NONCREDIBLE}
    derivation: 将献祭和销毁的名称直接映射到机制标签后选择查询。
  hints:
    schema_name: 从制度机制迁移到铭文实验设计
    oracle_mindset:
      insight: 机制由行动如何改变不同类型的成本或未来选项决定，不由仪式外观决定；查询价值也应相对于机制计算。
      when_to_use: 同一种可见动作可能因补偿、时序或可逆性而具有不同战略含义时。
    false_mindset:
      insight: 献祭必是分离信号，销毁必是承诺；先按名词分类再优化实验。
      when_to_use: 忽略隐藏的成本承担者和恢复路径时容易误用。
  verification:
    entrypoint: mindsetbench.verification.hss_active_query:verify_hss_active_p8_ritual_l4_01
    method: executable-mechanism-sensitive-active-experiment-selection
  provenance: original synthetic case; all inscriptions, rituals, and institutions are fictional
  verified: Q3 的四色分别唯一对应四种真实机制；只看仪式外观会错误选择 Q2。
