- id: FORMAL-P4-CLOSURE-L0-01
  version: "1.0"
  split: calibration
  paradigm: P4
  thread: I-规范规则
  schema_id: least-fixed-point-norm-sensitivity-v1
  schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
  chain: p4-closure-sensitivity-v1
  level: 0
  source: &p4_closure_source
    domain: 十二货舱闭包章程基准
    problem: >-
      对每条记录，从初始标签出发反复应用规则直到最小不动点：
      R1 kiln∧sealed→stable；R2 stable→cleared；R3 silver→cleared；
      R4 cleared∧beacon→priority；R5 priority→authorized；R6 stable∧antidote→neutralized。
      一般条款：带 route 而没有 authorized 的记录违规，但 mercy∧sponsor 构成例外。
      最高条款：volatile 而没有 neutralized 的记录一律违规，例外不能覆盖。
      初始标签为：S1 route,kiln,sealed,beacon；S2 route,silver,beacon；
      S3 route,kiln,sealed；S4 route,mercy,sponsor；S5 route,mercy；
      S6 volatile,kiln,sealed,antidote；S7 volatile,kiln,sealed；
      S8 route,volatile,kiln,sealed,beacon,antidote；
      S9 route,volatile,silver,beacon；S10 volatile,kiln,sealed,antidote；
      S11 route,kiln,sealed,beacon,mercy；S12 route,kiln,sealed,beacon,silver。
      输出违规编号；并保留当且仅当 R2 失效时新增的违规记录。
    solution: >-
      先求完整闭包。S3、S5 缺授权且无完整例外；S7、S9 命中最高禁止，baseline 违规为
      S3;S5;S7;S9。R2 失效时，仍可由 R3 的 silver 获得 cleared；R1 与 R6 仍可产生
      stable 和 neutralized。新增违规恰为 S1、S8、S11，所以失效后的全集为
      S1;S3;S5;S7;S8;S9;S11。跨域重命名时应按初始事实剖面而非记录序号对齐。
    answer: S3;S5;S7;S9
  target:
    domain: 双件许可记录
    problem: >-
      从初始事实反复应用 hot∧sealed→stable、stable→authorized，直到不再产生新事实。
      带 route 而最终没有 authorized 的记录违规。A 初始为 route,hot,sealed；
      B 初始为 route,hot。输出全部违规编号。
    answer: {parts: [{type: label, value: B}]}
  mapping:
    objects: {派生标签 stable: stable, 最终许可 authorized: authorized, route 一般义务: route 一般义务}
    shared_relations: [派生规则必须迭代到最小不动点, 规范判断使用闭包后的事实而非初始事实]
    varied: [缩为两条记录和两级派生链]
  lure:
    problem: >-
      使用相同事实与规则，但所有规则只同时检查一次初始事实，新派生事实不能再触发另一规则。
      输出违规编号。
    solution: A 在这一轮只能派生 stable，不能由新 stable 再派生 authorized；A、B 都违规。
    answer: {parts: [{type: label, value: A}, {type: label, value: B}]}
    why_surface_similar: 初始事实、规则和违规条件相同。
    why_structurally_different: lure 使用非递归的一轮语义，目标使用最小不动点语义。
    wrong_schema_id: initial-facts-single-pass-rules-01
  copy_probe:
    answer: {parts: [{type: label, value: A}, {type: label, value: B}]}
    derivation: 只检查一次初始事实，没有让 stable 继续触发 authorized。
  hints:
    schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
    oracle_mindset: {insight: 把新事实加入集合后继续扫描规则，直到整轮没有变化，再执行规范判断。, when_to_use: 规则结论可以成为另一规则前件时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p4_chain:verify_formal_p4_closure_l0_01
    method: monotone-fixed-point-and-initial-fact-one-pass
  provenance: original; formal AR-hard chain using reusable closure and rule-ablation certificates
  verified: 最小不动点下仅 B 违规；单轮语义下 A、B 均违规。

- id: FORMAL-P4-CLOSURE-L1-01
  version: "1.0"
  split: calibration
  paradigm: P4
  thread: I-规范规则
  schema_id: least-fixed-point-norm-sensitivity-v1
  schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
  chain: p4-closure-sensitivity-v1
  level: 1
  source: *p4_closure_source
  target:
    domain: 四份通行申请
    problem: >-
      对每份申请反复应用：seed∧sealed→stable；stable→cleared；silver→cleared；
      cleared∧beacon→authorized；只要还能产生新事实就继续应用。带 route 而最终没有 authorized 的申请违规。
      P1:route,seed,sealed,beacon；P2:route,seed,sealed；
      P3:route,silver,beacon；P4:seed,sealed,beacon。输出全部违规编号。
    answer: {parts: [{type: label, value: P2}]}
  mapping:
    objects: {kiln: seed, stable: stable, cleared: cleared, beacon: beacon, authorized: authorized}
    shared_relations: [两条以上派生规则可串联, 另一路初始标签可在中间层汇合, route 义务只在闭包后检查]
    varied: [四记录、三层链与一个中层旁路]
  lure:
    problem: 使用同样事实和规则，但所有规则只同时检查一次初始事实；输出违规编号。
    solution: P1 的 seed,sealed 只能产生 stable；P3 的 silver 只能产生 cleared，两者都不能在同一轮继续获得 authorized。P1、P2、P3 违规，P4 无 route。
    answer: {parts: [{type: label, value: P1}, {type: label, value: P2}, {type: label, value: P3}]}
    why_surface_similar: 规则文字和记录完全一致。
    why_structurally_different: 新结论在 lure 中不能继续触发规则。
    wrong_schema_id: initial-facts-single-pass-rules-01
  copy_probe:
    answer: {parts: [{type: label, value: P1}, {type: label, value: P2}, {type: label, value: P3}]}
    derivation: 将派生系统误当成无递归的一轮分类器。
  hints:
    schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
    oracle_mindset: {insight: 用事实集合的单调增长实现闭包，silver 旁路和 stable 主链最终都可汇入 cleared。, when_to_use: 多条规则在中间谓词处汇合时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p4_chain:verify_formal_p4_closure_l1_01
    method: monotone-fixed-point-and-initial-fact-one-pass
  provenance: original; formal AR-hard chain using reusable closure and rule-ablation certificates
  verified: 闭包语义仅 P2 违规；一轮初始事实语义为 P1、P2、P3。

- id: FORMAL-P4-CLOSURE-L2-01
  version: "1.0"
  split: calibration
  paradigm: P4
  thread: I-规范规则
  schema_id: least-fixed-point-norm-sensitivity-v1
