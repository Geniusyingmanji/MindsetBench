    problem: >-
      对每舱初始标签反复应用，只要还能产生新标签就继续：kiln∧sealed→stable；stable→cleared；
      silver→cleared；cleared∧beacon→priority；priority→authorized；
      stable∧antidote→neutralized。一般条款：route 且无 authorized 违规，
      mercy∧sponsor 可豁免；最高条款：volatile 且无 neutralized 一律违规。
      C1 route,kiln,sealed,beacon；C2 route,silver,beacon；C3 route,kiln,sealed；
      C4 route,mercy,sponsor；C5 route,mercy；C6 volatile,kiln,sealed,antidote；
      C7 volatile,kiln,sealed。输出全部违规编号。
    answer: {parts: [{type: label, value: C3}, {type: label, value: C5}, {type: label, value: C7}]}
  mapping:
    objects: {货舱 S: 货舱 C, 派生许可链: 派生许可链, 一般 route 条款: 一般 route 条款, volatile 最高条款: volatile 最高条款}
    shared_relations: [先完成所有单调派生, 完整双条件例外只覆盖一般义务, 最高禁止独立于一般许可]
    varied: [七条记录覆盖主链、旁路、例外和最高禁止边界]
  lure:
    problem: 使用完全相同的七条记录、派生规则和规范，但派生规则只同时检查一次初始事实；输出违规编号。
    solution: 一轮中没有记录能产生 authorized 或 neutralized；除完整例外 C4 外，C1、C2、C3、C5 的 route 义务失败，C6、C7 又命中最高禁止。
    answer: {parts: [{type: label, value: C1}, {type: label, value: C2}, {type: label, value: C3}, {type: label, value: C5}, {type: label, value: C6}, {type: label, value: C7}]}
    why_surface_similar: 所有事实、规则、例外与优先级完全相同。
    why_structurally_different: lure 禁止派生事实继续触发规则，破坏授权和中和链。
    wrong_schema_id: initial-facts-single-pass-rules-01
  copy_probe:
    answer: {parts: [{type: label, value: C1}, {type: label, value: C2}, {type: label, value: C3}, {type: label, value: C5}, {type: label, value: C6}, {type: label, value: C7}]}
    derivation: 仅以初始标签评估所有派生规则。
  hints:
    schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
    oracle_mindset: {insight: 将“事实闭包”和“规范求值”分成两阶段；最高禁止与一般义务最后取并集。, when_to_use: 派生类别、例外和不可覆盖规则共存时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p4_chain:verify_formal_p4_closure_l2_01
    method: monotone-fixed-point-priority-norm-and-initial-fact-one-pass
  provenance: original; formal AR-hard chain using reusable closure and rule-ablation certificates
  verified: 闭包违规 C3,C5,C7；只看初始事实的一轮语义额外误报 C1,C2,C6。

- id: FORMAL-P4-CLOSURE-L3-01
  version: "1.0"
  split: calibration
  paradigm: P4
  thread: I-规范规则
  schema_id: least-fixed-point-norm-sensitivity-v1
  schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
  chain: p4-closure-sensitivity-v1
  level: 3
  source: *p4_closure_source
  target:
    domain: 重命名的十二份轨道请愿
    problem: &p4_full_target >-
      对每份请愿，从初始印记反复应用规则，只要还能产生新印记就继续：
      ore∧latched→balanced；balanced→screened；opal→screened；
      screened∧signal→urgent；urgent→licensed；balanced∧remedy→quenched。
      一般条款：有 dispatch 而最终没有 licensed 的请愿违规，但 aid∧seal 构成例外。
      最高条款：reactive 而最终没有 quenched 的请愿一律违规。
      每条记录还带校验权重：
      Q1(131):dispatch,aid；Q2(73):dispatch,opal,signal；
      Q3(233):reactive,ore,latched,remedy；Q4(173):reactive,ore,latched；
      Q5(107):dispatch,aid,seal；Q6(211):dispatch,reactive,opal,signal；
      Q7(41):dispatch,ore,latched,signal；Q8(281):dispatch,ore,latched,signal,opal；
      Q9(151):reactive,ore,latched,remedy；Q10(257):dispatch,ore,latched,signal,aid；
      Q11(89):dispatch,ore,latched；
      Q12(197):dispatch,reactive,ore,latched,signal,remedy。
      求所有违规记录的校验权重之和对 1000 的余数。
    answer: {parts: [{type: number, value: "604"}]}
  mapping:
    objects: {kiln: ore, sealed: latched, stable: balanced, silver: opal, cleared: screened, beacon: signal, priority: urgent, authorized: licensed, antidote: remedy, neutralized: quenched, route: dispatch, mercy: aid, sponsor: seal, volatile: reactive}
    shared_relations: [全部初始事实剖面在打乱记录顺序后逐一保持, 六条派生规则与两层规范优先级同构, 完整双条件例外只覆盖一般义务而最高禁止不可覆盖, 违规集合应按事实剖面迁移再换算目标权重]
    varied: [谓词全重命名、记录顺序置换并把输出改为带权校验和]
  lure:
    problem: 使用目标完全相同的十二条记录、规则和规范，但所有派生规则只同时检查一次初始印记，新事实不能触发另一规则。求违规权重和模 1000。
    solution: 一轮语义下没有记录得到 licensed 或 quenched；除 Q5 的完整例外外其余记录均至少违反一般或最高条款。权重和为 1837，模 1000 得 837。
    answer: {parts: [{type: number, value: "837"}]}
    why_surface_similar: 记录、权重、规则和规范逐字相同。
    why_structurally_different: lure 把递归闭包替换成只读初始事实的一轮变换。
    wrong_schema_id: initial-facts-single-pass-rules-01
  copy_probe:
    answer: {parts: [{type: number, value: "837"}]}
    derivation: 不允许 balanced、screened、urgent 等新事实继续触发规则。
  hints:
    schema_name: 派生事实最小不动点、规范优先级与单规则失效迁移
    oracle_mindset: {insight: 按初始事实剖面恢复 source 记录对应，不依赖编号；复用其闭包违规证书，再将对应目标权重求和。, when_to_use: 规则系统完全重命名且记录被置换时。}
  verification:
    entrypoint: mindsetbench.verification.formal_p4_chain:verify_formal_p4_closure_l3_01
    method: fixed-point-rule-engine-profile-isomorphism-and-negative-control
  provenance: original; formal AR-hard chain using reusable closure and rule-ablation certificates
  verified: 违规剖面对应 Q11,Q1,Q4,Q6，权重和 89+131+173+211=604；一轮语义为 837。

- id: FORMAL-P4-CLOSURE-L4-01
  version: "1.0"
  split: calibration
  paradigm: P4
  thread: I-规范规则
  schema_id: least-fixed-point-norm-sensitivity-v1
