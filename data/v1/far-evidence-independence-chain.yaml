- id: FAR-INDEP-L4-01
  version: "1.0"
  split: sanity
  paradigm: P7
  thread: E-证据独立性
  schema_id: far-evidence-independence-v1
  schema_name: 共享同一上游的一致信号只构成一份证据
  chain: far-evidence-independence-v1
  level: 4
  source: *far_indep_source
  target:
    domain: 储罐高液位联锁的可靠性评估
    problem: >-
      某储罐进料联锁由三只液位开关 S1、S2、S3 组成，任意两只及以上报高液位即关闭进料阀。
      评估用“需求时失效概率”表示联锁在真正出现高液位时未能关阀的概率。每只开关各自的随机漏报概率
      为 0.1，且互不影响。

      计量室校准记录：9 月 2 日，S1 与 S2 由同一台便携校准器 PC-7 在现场校准；8 月 30 日，S3 在计量室
      按固定基准校准。9 月 5 日复检发现 PC-7 可能存在量程偏移故障，评估为 5% 的概率；若该故障存在，
      凡经 PC-7 校准的开关在高液位时都会读低而漏报，这一漏报与其随机漏报无关。

      问：(1) 联锁当前的需求时失效概率是多少（保留四位小数）？(2) 以下改造单独实施时，哪一项使该概率最低：
      A 再加一只同样用 PC-7 校准的开关 S4，改为任意两只报高即关阀；
      B 将 S2 送计量室按固定基准重新校准；
      C 把 S3 更换为随机漏报概率 0.05 的高等级开关。
    answer_format: "<四位小数>;<A|B|C>"
    answer:
      parts:
        - {type: number, value: "0.0766", abs_tolerance: "0.0002"}
        - {type: label, value: B}
  mapping:
    objects: {乾隆县志: 便携校准器 PC-7, 采录方志: 经 PC-7 校准的 S1 与 S2, 独立碑刻: 按固定基准校准的 S3, 三个见证的门槛: 二取三表决, 定级: 需求时失效概率}
    shared_relations: [多个一致信号共享同一上游时其一致性不提供额外保证, 独立性取决于上游根而非信号数量, 增加同源信号不提升可靠性, 只有新增独立根才真正提升可靠性]
    removed_relations: [来源链的显式引用关系, 离散的见证计数与定级]
    added_relations: [上游以给定概率故障并使全部下游同时失效, 表决门限把单个漏报组合成整体失效, 结果为连续概率而非计数]
    adaptation_required: [把“同源合并计数”改写为对共同上游状态的条件化：先按校准器是否故障分情形，再在每种情形内按独立性计算, 对三种改造分别重算条件概率并比较]
    varied: [从史料考订跨到过程安全工程, 从叙述记载改为校准记录与表决逻辑, 模型从来源计数变为条件概率, 方法从追根变为分情形求和]
  lure:
    problem: >-
      同一储罐、同样三只开关与二取三关阀逻辑，各开关随机漏报概率 0.1 且三只均在计量室按固定基准校准。
      问当前需求时失效概率（四位小数），以及改造 A（加一只同样校准的开关并改为任意两只报高即关阀）、
      B（把 S2 重新校准一次）、C（S3 换为漏报概率 0.05 的开关）中哪一项使其最低。
    solution: >-
      三只独立开关至少两只漏报的概率为 3×0.01×0.9+0.001=0.0280。A 改为四取二后至少三只漏报的概率
      为 4×0.001×0.9+0.0001=0.0037，最低；B 重新校准不改变任何概率；C 得 0.0190。
    answer:
      parts:
        - {type: number, value: "0.0280", abs_tolerance: "0.0002"}
        - {type: label, value: A}
    why_surface_similar: 同一设备、同一表决逻辑、同样的三项改造与数值。
    why_structurally_different: lure 中三只开关来源独立，目标中两只共享一台可能故障的校准器。
    wrong_schema_id: independent-redundancy-product-01
  copy_probe:
    answer:
      parts:
        - {type: number, value: "0.0280", abs_tolerance: "0.0002"}
        - {type: label, value: A}
    derivation: 把三只开关当成相互独立的冗余，用二项组合直接相乘，并认为增加同样校准的开关最能降低失效概率。
  hints:
    schema_name: 共享同一上游的一致信号只构成一份证据
    oracle_mindset:
      insight: 先找出多只开关共享的上游（同一台校准器），按它是否故障分情形；上游故障时同源开关一起失效，冗余不再存在。
      when_to_use: 冗余通道由同一份文件、同一次生成或同一台仪器派生时。
    false_mindset:
      insight: 冗余度等于通道数，通道越多失效概率越低。
      when_to_use: 看到多只并联传感器时直接用独立概率相乘。
  verification:
    entrypoint: mindsetbench.verification.far_evidence_independence:verify_far_indep_l4_01
    method: common-cause-conditional-probability
  provenance: original synthetic case; plant, instruments, and records are fictional
  verified: 0.05+0.95×0.028=0.0766；改造 A/B/C 分别为 0.0535、0.0361、0.0681，B 最低。
