# Far-transfer family: a cascade spreads through the gaps of the threshold (or margin)
# distribution, not through its average; near-identical averages stop at very different
# sizes, and the same seeds placed differently take everything or nothing.
# Decoy: compare averages or totals and predict "about the same".
- id: FAR-CASCADE-L0-01
  version: "1.0"
  split: calibration
  paradigm: P3
  thread: H-阈值级联
  schema_id: far-threshold-cascade-v1
  schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
  chain: far-threshold-cascade-v1
  level: 0
  source: &far_cascade_source
    domain: 两个镇的抗议集会
    problem: >-
      两个镇各有 100 人，每人只在“已经参加的人数达到自己的门槛”时才加入集会，加入后不再退出。
      镇 A：5 人门槛为 0，一开始就到场；10 人要看到 5 人已经参加；15 人要看到 12 人；20 人要看到 30 人；
      50 人要看到 40 人。镇 B 与镇 A 唯一的差别是那 15 人要看到 16 人。
      问：两镇的集会最终各有多少人参加？
    solution: >-
      镇 A：5 人到场后，门槛 5 的 10 人加入，达到 15；门槛 12 的 15 人加入，达到 30；门槛 30 的 20 人加入，
      达到 50；门槛 40 的 50 人加入，全部 100 人到场。镇 B：5 人到场，10 人加入达到 15；但下一组要看到 16 人，
      15 人凑不到 16，集会停在 15 人，后面 70 人永远等不到自己的门槛。两镇平均门槛只差 0.6，结局却是 100 对 15：
      扩散能走多远取决于每一步“已到人数”能否跨过下一组人的门槛，中间有一处缺口就全部停住，与平均门槛无关。
    answer: A=100;B=15
  target:
    domain: 两个镇的抗议集会
    problem: >-
      另外两个镇各 100 人，规则相同。镇 C：4 人门槛为 0；6 人要看到 4 人已经参加；10 人要看到 10 人；
      30 人要看到 20 人；50 人要看到 45 人。镇 D 与镇 C 唯一的差别是那 50 人要看到 51 人。
      问：两镇最终各有多少人参加？
    answer_format: "C=<人数>;D=<人数>"
    answer:
      parts:
        - {type: label, value: C=100}
        - {type: label, value: D=50}
  mapping:
    objects: {镇 A: 镇 C, 镇 B: 镇 D, 各组门槛: 各组门槛, 已参加人数: 已参加人数}
    shared_relations: [已参加人数逐轮与下一组门槛比较, 一处跨不过的缺口使扩散停住, 平均门槛不决定终点]
    varied: [仅更换分组与门槛]
  lure:
    problem: >-
      同样两镇、同样分组与门槛，但两镇的组织者事先都公布“据调查预计会有 30 人到场”，居民只把这个预计数
      与自己的门槛比较，一次性决定是否参加，之后不再观察。问两镇最终各有多少人参加。
    solution: 只与预计数 30 比较时，门槛不超过 30 的人参加：两镇都是 4 加 6 加 10 加 30，各 50 人。
    answer:
      parts:
        - {type: label, value: C=50}
        - {type: label, value: D=50}
    why_surface_similar: 同样两镇、同样分组、门槛与人数。
    why_structurally_different: lure 中人人只与一个公布的数字比较一次，目标中已参加人数逐轮累积并跨越门槛。
    wrong_schema_id: compare-with-average-once-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: C=50}
        - {type: label, value: D=50}
    derivation: 用平均门槛约 30 一次性筛人，门槛不超过 30 的人都算参加，两镇各 50。
  hints:
    schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
    oracle_mindset:
      insight: 逐轮把已参加人数与下一组门槛比较，哪一步跨不过就停在哪里；不要用平均数一次性筛。
      when_to_use: 个体的加入取决于已经加入者的数量时。
    false_mindset:
      insight: 门槛低于平均水平的人会参加，其余不会。
      when_to_use: 只看门槛的平均值时。
  verification:
    entrypoint: mindsetbench.verification.far_threshold_cascade:verify_far_cascade_l0_01
    method: threshold-fixed-point-iteration
  provenance: original synthetic case
  verified: 镇 C 逐轮 4、10、20、50、100；镇 D 在 50 人处停住，最后一组要看到 51 人。

- id: FAR-CASCADE-L1-01
