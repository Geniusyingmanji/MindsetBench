        - {type: label, value: A=20}
        - {type: label, value: B=60}
  mapping:
    objects: {镇: 楼, 居民: 业主, 参加集会: 签名, 已参加人数: 已签名户数}
    shared_relations: [已签名户数逐轮与下一组门槛比较, 一处跨不过的缺口使扩散停住, 平均门槛不决定终点]
    varied: [从集会换成联名，人数与门槛更换，两楼在两组上略有差别]
  lure:
    problem: >-
      同样两栋楼、同样分组与门槛，但发起人事先在两楼公告“预计会有 22 户签名”，业主只把这个预计数与自己的门槛
      比较一次决定是否签名。问两栋楼最终各有多少户签名。
    solution: 只与 22 比较时，门槛不超过 22 的户签名：两楼都是 3 加 7 加 10 加 20，各 40 户。
    answer:
      parts:
        - {type: label, value: A=40}
        - {type: label, value: B=40}
    why_surface_similar: 同样两楼、同样分组与门槛。
    why_structurally_different: lure 中只与一个公告数字比较一次，目标中已签名数逐轮累积。
    wrong_schema_id: compare-with-average-once-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: A=40}
        - {type: label, value: B=40}
    derivation: 用平均门槛约 22 一次性筛人，两楼各 40 户。
  hints:
    schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
    oracle_mindset:
      insight: 楼 A 走到 20 户时下一组要看到 21 户，差一户就全停；楼 B 同一处刚好跨过，走到底。
      when_to_use: 个体的加入取决于已加入者数量时。
    false_mindset:
      insight: 两楼门槛平均值几乎一样，结果也差不多。
      when_to_use: 只比较平均值时。
  verification:
    entrypoint: mindsetbench.verification.far_threshold_cascade:verify_far_cascade_l1_01
    method: threshold-fixed-point-iteration
  provenance: original synthetic case
  verified: 楼 A 逐轮 3、10、20 后停住；楼 B 逐轮 3、10、20、40、60。

- id: FAR-CASCADE-L2-01
  version: "1.0"
  split: sanity
  paradigm: P3
  thread: H-阈值级联
  schema_id: far-threshold-cascade-v1
  schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
  chain: far-threshold-cascade-v1
  level: 2
  source: *far_cascade_source
  target:
    domain: 两家小银行的储户取款
    problem: >-
      监管简报摘录。两家小银行各有 200 名储户。传言出现后，每名储户心里都有一条线：其他储户中已经取走存款的
      人数一旦达到这条线，他就去取款，取走后不再存回。
      X 银行的储户构成：10 人不等任何消息立即取款；20 人的心理线是 10 人；30 人的心理线是 30 人；60 人的心理线是 60 人；
      80 人的心理线是 110 人。Y 银行：10 人立即取款；20 人的心理线是 10 人；30 人的心理线是 30 人；60 人的心理线是 61 人；
      80 人的心理线是 121 人。
      请估算两家银行最终各有多少名储户取款。
    answer_format: "X=<人数>;Y=<人数>"
    answer:
      parts:
        - {type: label, value: X=200}
        - {type: label, value: Y=60}
  mapping:
    objects: {镇: 银行, 居民: 储户, 参加集会: 取款, 已参加人数: 已取款人数, 门槛: 心里的数字}
    shared_relations: [已取款人数逐轮与下一组门槛比较, 一处跨不过的缺口使扩散停住, 平均门槛不决定终点, 两组几乎相同的分布可以有完全不同的终点]
    varied: [从社会集会跨到银行挤兑, 文体从题面改为监管简报, 门槛以心里的数字表述]
  lure:
    problem: >-
      同样两家银行与同样的储户分组，但监管部门在传言出现当天公开通报“预计约 70 名储户会取款”，储户只把这个
      通报数与自己心里的数字比较一次决定是否取款。问两家银行最终各有多少名储户取款。
    solution: 只与 70 比较时，心里数字不超过 70 的储户取款：两家都是 10 加 20 加 30 加 60，各 120 人。
    answer:
      parts:
        - {type: label, value: X=120}
        - {type: label, value: Y=120}
    why_surface_similar: 同样两家银行、同样分组与数字。
    why_structurally_different: lure 中只与一个通报数字比较一次，目标中已取款人数逐轮累积并跨越门槛。
    wrong_schema_id: compare-with-average-once-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: X=120}
        - {type: label, value: Y=120}
    derivation: 用平均心理数字约 70 一次性筛人，两家各 120 人。
  hints:
    schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
    oracle_mindset:
      insight: 逐轮把已取款人数与下一组的数字比较；Y 银行在 60 人处差一人跨不过，X 银行同一处刚好跨过并走到全部取空。
      when_to_use: 个体的行动取决于已行动者数量时。
    false_mindset:
      insight: 两家储户心理数字的平均值差不多，取款人数也差不多。
      when_to_use: 只比较平均值时。
  verification:
    entrypoint: mindsetbench.verification.far_threshold_cascade:verify_far_cascade_l2_01
    method: threshold-fixed-point-iteration
  provenance: original synthetic case; both banks are fictional
  verified: X 逐轮 10、30、60、120、200；Y 在 60 人处停住。

- id: FAR-CASCADE-L3-01
  version: "1.0"
  split: sanity
  paradigm: P3
  thread: H-阈值级联
  schema_id: far-threshold-cascade-v1
  schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
  chain: far-threshold-cascade-v1
  level: 3
  source: *far_cascade_source
  target:
    domain: 村庄滴灌技术的推广试点
    problem: >-
      推广站工作记录：某村 12 户农户的田块围成一圈，编号 1 到 12 依次相邻，12 号与 1 号相邻。农户只看得到
      自己两侧各两户的田块，当这四户中至少两户已经改用滴灌时，该户才跟着改用，改用后不再放弃。
      推广站只能免费为两户安装。方案一：给 1 号和 2 号安装；方案二：给 1 号和 7 号安装。
      问：两种方案最终各有多少户改用滴灌？
    answer_format: "ADJ=<方案一户数>;OPP=<方案二户数>"
    answer:
      parts:
        - {type: label, value: ADJ=12}
        - {type: label, value: OPP=2}
  mapping:
    objects: {镇: 村, 居民: 农户, 参加集会: 改用滴灌, 已参加人数: 邻近已改用户数, 门槛: 四户中至少两户}
    shared_relations: [个体加入取决于已加入者的数量, 逐轮比较直到没有新加入者, 一处跨不过的缺口使扩散停住, 平均门槛不决定终点]
    removed_relations: [人人看到全村的已加入人数]
    added_relations: [每户只看到两侧各两户, 同样两户种子的位置决定能否形成跨过门槛的连续带]
    adaptation_required: [把全村计数改为每户各自的邻域计数, 逐轮更新每户邻域内的已改用数, 比较两种种子位置而不是两个门槛分布]
    varied: [从社会集会跨到农业技术推广, 门槛从全局人数改为局部邻域, 差异从门槛分布改为种子位置]
  lure:
    problem: >-
      同一个村的另一项技术推广：农户看的是全村已改用的户数，只要全村至少两户已改用就跟着改用。
      推广站同样只能免费安装两户，方案一给 1 号和 2 号，方案二给 1 号和 7 号。问两种方案最终各有多少户改用。
    solution: 看全村计数时，两户种子一到位其余 10 户立即满足条件，两种方案都是 12 户。
    answer:
      parts:
        - {type: label, value: ADJ=12}
        - {type: label, value: OPP=12}
    why_surface_similar: 同一个村、同样 12 户、同样两种安装方案。
    why_structurally_different: lure 中农户看全村计数，目标中农户只看两侧各两户。
    wrong_schema_id: global-count-threshold-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: ADJ=12}
        - {type: label, value: OPP=12}
    derivation: 照搬源题的全村计数：两户已改用就满足“至少两户”，认为两种方案都会扩散到全村。
  hints:
    schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
    oracle_mindset:
      insight: 门槛是按每户自己的四个邻居算的；相邻两户能让 3 号和 12 号同时看到两户，沿圈一路推进；相对的两户各自只给邻居贡献一户，谁也跨不过门槛。
      when_to_use: 个体只观察局部邻居而不是全体时。
    false_mindset:
      insight: 只要全村有两户改用，条件就满足了。
      when_to_use: 把局部门槛当作全局门槛时。
  verification:
    entrypoint: mindsetbench.verification.far_threshold_cascade:verify_far_cascade_l3_01
    method: ring-neighbourhood-threshold-simulation
  provenance: original synthetic case; village is fictional
  verified: 相邻种子沿圈逐户推进到 12 户；相对种子的每个邻居只看到一户改用，停在 2 户。

- id: FAR-CASCADE-L4-01
  version: "1.0"
  split: sanity
  paradigm: P3
  thread: H-阈值级联
  schema_id: far-threshold-cascade-v1
  schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
  chain: far-threshold-cascade-v1
  level: 4
  source: *far_cascade_source
  target:
    domain: 桥式长梁的支柱失效评估
    problem: >-
      一根长梁由排成一列的 8 根柱支撑，每根柱承担 10 单位荷载。有两种设计方案。设计 P：8 根柱承载力都是 14。
      设计 Q：8 根柱承载力依次为 10、25、10、25、10、10、10、12，总承载力与 P 相同。
      若第 3 根柱被车辆撞毁，其荷载会均分给左右两侧最近的仍完好的柱；一侧已没有完好的柱时，荷载全部转给另一侧。
      荷载超过承载力的柱随即失效，其全部荷载按同样规则继续转移。问：两种设计最终各失去多少根柱（含被撞毁的那根）？
    answer_format: "P=<柱数>;Q=<柱数>"
    answer:
      parts:
        - {type: label, value: P=8}
        - {type: label, value: Q=1}
  mapping:
    objects: {居民: 支柱, 门槛: 承载力余量, 已参加人数: 转移过来的荷载, 参加集会: 失效, 门槛分布: 各柱余量的分布}
    shared_relations: [一个单元的变化推动邻近单元跨过各自门槛, 扩散逐轮进行直到没有新单元跨过门槛, 终点由门槛的分布与位置决定, 总量或平均值相同不意味着终点相同]
    removed_relations: [离散的人数计数与全局或邻域的已加入人数]
    added_relations: [传递的是连续的荷载且随失效累积增大, 荷载只流向最近的完好单元, 大余量的单元能吸收荷载并阻断传递]
    adaptation_required: [把“已加入人数与门槛比较”改为“累积荷载与承载力比较”, 按最近完好柱的规则逐轮重新分配荷载, 比较两种余量分布而不是两个门槛分布]
    varied: [从社会扩散跨到结构工程, 计数模型变为荷载再分配模型, 判据从人数变为承载力]
  lure:
    problem: >-
      同一根长梁、同样的荷载与转移规则，但设计 P 的 8 根柱承载力都是 16，设计 Q 仍为 10、25、10、25、10、10、10、12。
      第 3 根柱被撞毁。问两种设计最终各失去多少根柱（含被撞毁的那根）。
    solution: P 的相邻两柱各接 5 后为 15，不超过 16，停住；Q 的两侧 25 承载力柱接 5 后为 15，停住；两种设计都只失去 1 根。
    answer:
      parts:
        - {type: label, value: P=1}
        - {type: label, value: Q=1}
    why_surface_similar: 同样的梁、荷载、撞击位置与转移规则。
    why_structurally_different: lure 中 P 的余量 6 大于转移来的 5；目标中 P 的余量只有 4，相邻柱接 5 即失效并逐根传下去。
    wrong_schema_id: total-capacity-exceeds-total-load-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: P=1}
        - {type: label, value: Q=1}
    derivation: 两种设计总承载力 112 都大于总荷载 80，认为都只失去被撞的那根。
  hints:
    schema_name: 扩散的终点由门槛分布的缺口决定而非平均门槛
    oracle_mindset:
      insight: 关键不是总承载力而是撞毁点两侧邻柱的余量：P 每根只多 4，接 5 就失效并把更大荷载传给下一根；Q 把大余量放在两侧邻柱，一次吸收就停住。
      when_to_use: 荷载、压力或损失会转移给邻近单元时。
    false_mindset:
      insight: 总承载力大于总荷载就不会连续失效。
      when_to_use: 只比较总量时。
  verification:
    entrypoint: mindsetbench.verification.far_threshold_cascade:verify_far_cascade_l4_01
    method: nearest-standing-load-redistribution-simulation
  provenance: original synthetic case
