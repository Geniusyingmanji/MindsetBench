      两栋楼各 60 户，业主只在“已签名的户数达到自己的门槛”时才签名，签后不撤回。
      楼 A：3 户门槛为 0，率先签名；7 户要看到 3 户已签名；10 户要看到 10 户；20 户要看到 21 户；20 户要看到 41 户。
      楼 B 与楼 A 的差别是后两组分别为 20 户要看到 20 户、20 户要看到 40 户。
      问：两栋楼最终各有多少户签名？
    answer_format: "A=<户数>;B=<户数>"
    answer:
