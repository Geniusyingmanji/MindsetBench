      parts:
        - {type: number, value: "12"}
        - {type: string, value: K8>K2>K3>K1>K7}
        - {type: number, value: "14"}
        - {type: string, value: K7>K4>K2>K6>K3}
        - {type: number, value: "10"}
        - {type: string, value: K3>K7>K2>K6}
    derivation: 把 source 的三个最优卡序列逐码重命名，未由目标日志重校准 K7 的隐藏变换。
