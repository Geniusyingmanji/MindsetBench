- id: HSS-ADAPTIVE-P8-DIPLOMACY-L4-01
  version: "1.0"
  split: calibration
  paradigm: P8
  thread: J-自适应机制判别
  schema_id: mechanism-adaptive-policy-v1
  schema_name: 从激励机制迁移到外交礼物的条件鉴定策略
  level: 4
  source:
    domain: 平台承诺与信号审查
    problem: >-
      回应前由行动者自付、承诺型能承担而机会主义类型不能承担的行动为 SEPARATING_SIGNAL；
      回应前不可逆删除背离选项为 CREDIBLE_COMMITMENT；两类都能采取为 POOLING_SIGNAL；
      行动太晚、由第三方全额补偿或仍可单方恢复而未改变激励时为 NONCREDIBLE 或相应混同机制。
      判断四项制度安排。
    solution: 机制取决于时序、实际成本承担者、类型差异和未来选项，而不是动作名称。
    answer: S1=SEPARATING_SIGNAL;S2=CREDIBLE_COMMITMENT;S3=POOLING_SIGNAL;S4=NONCREDIBLE
  target:
    domain: 虚构海岛外交礼物的修复鉴定与条件取样
    problem: >-
      八种使节记录分别描述盟约回应前后的礼物：甲为回应前由使节自付，忠诚型能承担而背约型不能；
      乙为回应前销毁唯一改约印模且无法恢复；丙为回应前自付但两类都能承担；
      丁为昂贵礼物在对方回应后才交付；戊表面同甲但由商会全额补偿；
      己表面同乙但使节保留可单方恢复的母模；庚是另一种由使节自付且只有忠诚型能承担的前置礼物；
      辛是另一种回应前不可恢复地删除改约路径。
      标签使用 SEPARATING_SIGNAL、CREDIBLE_COMMITMENT、POOLING_SIGNAL、NONCREDIBLE。

      最多两次微量取样，第二次可依第一次回复选择。Q1成本2、Q2成本3、Q3成本4、
      Q4成本5、Q5成本6、Q6成本7。回复矩阵为：
      甲 Q1B/Q2B/Q3R/Q4B/Q5B/Q6R；乙 Q1B/Q2R/Q3B/Q4B/Q5B/Q6R；
      丙 Q1B/Q2R/Q3R/Q4B/Q5B/Q6B；丁 Q1R/Q2R/Q3B/Q4B/Q5R/Q6B；
      戊 Q1R/Q2R/Q3R/Q4R/Q5R/Q6R；己 Q1B/Q2B/Q3B/Q4B/Q5R/Q6R；
      庚 Q1R/Q2B/Q3R/Q4R/Q5R/Q6R；辛 Q1R/Q2R/Q3B/Q4B/Q5B/Q6R。
      每条最终路径必须唯一确定一个机制标签；可行后依次最小化最坏总成本、八种记录等可能时的平均总成本、
      最坏叶节点候选数、平均叶节点候选数。输出首查、R/B 后的第二查以及每条最终回复路径的标签。
    answer_format: ROOT=<Q>;ON_R=<Q>;ON_R_R=<LABEL>;ON_R_B=<LABEL>;ON_B=<Q>;ON_B_R=<LABEL>;ON_B_B=<LABEL>
    answer: ROOT=Q3;ON_R=Q2;ON_R_R=POOLING_SIGNAL;ON_R_B=SEPARATING_SIGNAL;ON_B=Q5;ON_B_R=NONCREDIBLE;ON_B_B=CREDIBLE_COMMITMENT
  mapping:
    objects:
      平台行动者: 外交使节
      观察者回应: 盟约方回应
      昂贵行动: 外交礼物
      背离选项: 改约印模和路径
      第三方补偿: 商会全额补偿
      制度机制: 礼物的战略机制
    shared_relations:
      - 前置时序是信号或承诺生效的必要条件
      - 类型间成本差异形成分离
      - 两类都能承担形成混同
      - 不可逆删除未来选项形成承诺
      - 补偿和恢复路径改变表面相同动作的机制
      - 取样策略只需区分机制而非具体记录
    added_relations:
      - 两组表面重复动作检验机制等价而非文本身份
      - 取样有成本且必须预先给出条件分支
    removed_relations:
      - 不直接逐项提交八种记录的机制表
    adaptation_required:
      - 先根据真实激励后果形成机制等价类，再规划两阶段取样
      - 不按礼物或销毁的可见名称复制机制标签
    varied: [跨到外交史和文物修复, 从机制分类改为条件实验设计]
  lure:
    problem: >-
      保留八种记录、取样回复和成本，但只看可见动作：戊仍按甲归为 SEPARATING_SIGNAL，
      己仍按乙归为 CREDIBLE_COMMITMENT，不考虑补偿和恢复母模。按同一目标求策略。
    solution: 表面机制分组下首查 Q6；R 分支查 Q3，B 分支查 Q1。
    answer: ROOT=Q6;ON_R=Q3;ON_R_R=SEPARATING_SIGNAL;ON_R_B=CREDIBLE_COMMITMENT;ON_B=Q1;ON_B_R=NONCREDIBLE;ON_B_B=POOLING_SIGNAL
    why_surface_similar: 八种礼物记录、取样矩阵和成本完全相同。
    why_structurally_different: 只按动作外观贴标签，忽略谁实际承担成本以及背离路径是否仍可恢复。
    wrong_schema_id: visible-gift-form-adaptive-policy-01
  copy_probe:
    answer:
      parts:
        - {type: string, value: ROOT=Q6}
        - {type: string, value: ON_R=Q3}
        - {type: string, value: ON_R_R=SEPARATING_SIGNAL}
        - {type: string, value: ON_R_B=CREDIBLE_COMMITMENT}
        - {type: string, value: ON_B=Q1}
        - {type: string, value: ON_B_R=NONCREDIBLE}
        - {type: string, value: ON_B_B=POOLING_SIGNAL}
    derivation: 先按礼物或销毁名称套用表面机制，再优化这一错误分组的取样树。
  hints:
    schema_name: 从激励机制迁移到外交礼物的条件鉴定策略
    oracle_mindset: {insight: 可见动作只有通过成本承担、类型差异、时序或不可逆性改变激励时才决定机制。, when_to_use: 相同礼仪形式可能因补偿或恢复权而产生不同战略后果时。}
    false_mindset: {insight: 昂贵礼物天然是分离信号，销毁物品天然是可信承诺。, when_to_use: 只识别仪式名词而不检查实际可行集合时容易误用。}
  verification:
    entrypoint: mindsetbench.verification.hss_adaptive_policy:verify_hss_adaptive_p8_diplomacy_l4_01
    method: executable-costed-policy-over-incentive-mechanisms
