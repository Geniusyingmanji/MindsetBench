- id: V1-P2-L2-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P2
  thread: B-符号约束
  schema_id: exact-one-csp-01
  schema_name: 精确约束下的唯一一致赋值
  level: 2
  chain: v1-p2-csp-01
  source: *p2_source
  target:
    domain: 分子实验工序
    problem: >-
      样本依次经过 W、X、Y、Z 四道工序，每道恰好一次。W 必须早于 Y；
      X 必须紧接在 Z 后；Y 不能排在第 4。请输出四个字母组成的唯一工序顺序。
    answer:
      parts: [{type: string, value: WYZX}]
  mapping:
    objects: {维护任务 A: 工序 W, 维护任务 C: 工序 Y, 维护任务 D: 工序 Z, 维护任务 B: 工序 X}
    shared_relations:
      - 四对象到四位置的一一映射
      - W 早于 Y 对应 A 早于 C
      - ZX 紧邻块对应 DB 紧邻块
      - Y 的末位排除对应 C 的末位排除
    varied: [从计算机排程跨到湿实验流程，形式约束图与求解算子完全保持]
  lure:
    problem: >-
      同一实验室另有 W、X、Y、Z 四道工序，各做一次。W 早于 Y；X 必须紧接在 Z 前；
      Y 不能排在第 4。输出唯一顺序。
    solution: >-
      把 XZ 当作相邻块尝试三个位置，前两个都会迫使 Y 在第 4；只有 XZ 位于 3—4，
      W、Y 位于 1—2，得到 WYXZ。
    answer:
      parts: [{type: string, value: WYXZ}]
    why_surface_similar: 对象、实验场景、前序约束和末位排除完全相同，仅邻接句只差“前/后”一字。
    why_structurally_different: 目标题需要 Z 紧接 X 之前，lure 则需要 X 紧接 Z 之前；邻接有方向，两个约束图不相同。
    wrong_schema_id: reversed-adjacency-csp-01
  copy_probe: null
  hints: *p2_hints
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p2_l2_01
    method: permutation-enumeration
  provenance: original
  verified: 独立穷举确认目标唯一解 WYZX，lure 唯一解 WYXZ。

- id: V1-P2-L3-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P2
  thread: B-符号约束
  schema_id: exact-one-csp-01
  schema_name: 精确约束下的唯一一致赋值
  level: 3
  chain: v1-p2-csp-01
  source: *p2_source
  target:
    domain: 生物信息分析流水线
    problem: >-
      五个阶段 E、F、G、H、X 各执行一次。E 早于 G；F 紧接在 H 后；G 不在第 4；
      X 紧接在 E 前；H 是第一阶段。请输出五个字母组成的唯一执行顺序。
    answer:
      parts: [{type: string, value: HFXEG}]
  mapping:
    objects: {A: E, C: G, D: H, B: F, 源题无对应对象: X}
    shared_relations:
      - 核心四对象仍满足前序、紧邻和位置排除约束
      - 所有阶段仍须形成满足全部硬约束的唯一全异排列
    added_relations:
      - 新增阶段 X 且 X 紧接在 E 前
      - H 被锚定为第一阶段
    adaptation_required:
      - 不能先求四对象顺序再把 X 塞入空位，必须在五对象状态空间联合传播约束
    varied:
      - 对象数从 4 增到 5，新增邻接块与端点锚定
      - 源题的 DB 位置枚举要改成同时处理 HF 与 XE 两个块
  lure:
    problem: >-
      五阶段流水线 E、F、G、H、X 各执行一次。H 为第一阶段，F 紧接在 H 后；
      E 早于 G；G 不在第 5；X 为最后阶段。输出唯一顺序。
    solution: H、F 固定在 1—2，X 固定在 5；E 必须早于 G，故 E、G 依次位于 3—4，答案 HFEGX。
    answer:
      parts: [{type: string, value: HFEGX}]
    why_surface_similar: 同为五阶段生信流水线，四个核心关系和首阶段 H 完全相同。
    why_structurally_different: lure 把 X 固定在末位，目标题却把 X 与 E 绑定成有向邻接块，候选空间不同。
    wrong_schema_id: fixed-endpoint-csp-01
  copy_probe:
    answer:
      parts: [{type: string, value: EGHFX}]
    derivation: 先照搬源题得到核心四阶段 EGHF，再未经联合约束传播就把新增阶段 X 附到末尾。
  hints: *p2_hints
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p2_l3_01
    method: permutation-enumeration
  provenance: original
  verified: 穷举 5! 个排列确认目标唯一解 HFXEG；copy probe EGHFX 违反 H 首位与 XE 紧邻。

- id: V1-P2-L4-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P2
  thread: B-符号约束
  schema_id: exact-one-csp-01
  schema_name: 精确约束下的唯一一致赋值
  level: 4
  chain: v1-p2-csp-01
  source: *p2_source
  target:
    domain: 事故取证
    problem: >-
      A、B、C、D 四名嫌疑人中恰有一人破坏了设备。四条陈述分别是：
      A 说“是 B”；B 说“不是 B”；C 说“是 D”；D 说“不是 A”。
      已知四条陈述中恰好一条为真。请输出破坏者字母。
    answer:
      parts: [{type: label, value: A}]
  mapping:
    objects: {完整任务排列: 候选破坏者世界, 排程硬约束: 每个世界诱导的四条陈述真值, 唯一可行排列: 唯一满足精确真值数的世界}
    shared_relations:
      - 枚举有限候选世界
      - 每个世界必须满足精确的全局约束而非尽量多满足
      - 排除不一致世界后答案唯一
    varied:
      - 排列 CSP 改为命题真值世界枚举
      - 顺序与邻接算子全部消失，只保留一致性筛选图式
    adaptation_required:
      - 对每个嫌疑人假设计算四条陈述的真值数，并严格筛选真值数等于一的世界
  lure:
    problem: >-
      仍使用 A、B、C、D 四名嫌疑人与同样四条陈述，但已知四条陈述中恰好一条为假。
      请输出破坏者字母。
    solution: >-
      分别假设四人为破坏者，真话数依次为 1、2、2、3。恰好一条为假等价于三条为真，故破坏者为 D。
    answer:
      parts: [{type: label, value: D}]
    why_surface_similar: 嫌疑人、陈述文本和“恰好一条”措辞完全相同。
    why_structurally_different: 目标题限定恰好一条为真，lure 限定恰好一条为假，即真值计数约束从 1 变成 3。
    wrong_schema_id: exact-one-false-01
  copy_probe:
    answer:
      parts: [{type: label, value: D}]
    derivation: 把精确满足误成选择“满足陈述最多”的候选，D 使三条陈述为真但不满足目标题恰好一真。
  hints: *p2_hints
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p2_l4_01
    method: finite-world-truth-enumeration
  provenance: original
  verified: 四个嫌疑人对应真话数为 A:1、B:2、C:2、D:3，目标与 lure 均唯一。

- id: V1-P3-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P3
  thread: H-因果拓扑
  schema_id: noncausal-path-control-01
  schema_name: 先识别非因果路径，再决定阻断或保留
  level: 0
  chain: v1-p3-causal-01
  source: &p3_source
    domain: 临床因果研究
    problem: >-
      已知因果图 U→T、U→Y、T→Y，其中 T 是治疗，Y 是结局，U 是治疗前严重度。
      为识别 T 对 Y 的总因果效应，应采用哪个最小调整集？输出 NONE、U 或 Y。
    solution: >-
      U 同时影响治疗与结局，形成后门路径 T←U→Y；调整 U 可阻断该非因果路径。
      Y 是结局，不能作为治疗前调整变量。因此最小调整集是 U。
    answer: U
  target:
    domain: 临床因果研究
    problem: >-
      已知因果图 S→M、S→R、M→R，其中 M 是用药，R 是康复结局，S 是用药前严重度。
      为识别 M 对 R 的总因果效应，应采用哪个最小调整集？输出 NONE、S 或 R。
    answer:
      parts: [{type: label, value: S}]
  mapping:
    objects: {U: S, T: M, Y: R}
    shared_relations:
      - 处理前共同原因指向处理与结局
      - 处理到结局存在目标因果边
      - 阻断唯一后门路径所需的最小调整集是共同原因
    varied: [仅替换变量符号与临床名词]
  lure: null
  copy_probe: null
  hints: &p3_hints
    schema_name: 先识别非因果路径，再决定阻断或保留
    oracle_mindset:
      insight: 先在因果图中区分目标因果路径与后门、对撞等非因果路径；只阻断非因果路径，并保留总效应经过的中介路径。
      when_to_use: 需要从观测关联识别因果效应，且题面给出共同原因、中介或选择机制时。
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p3_l0_01
    method: backdoor-graph-check
  provenance: original
  verified: 删除 M 的出边后，S 是阻断 M←S→R 的唯一最小单变量调整集。

