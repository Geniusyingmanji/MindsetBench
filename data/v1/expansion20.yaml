        - {type: label, value: E2}
        - {type: label, value: E4}
  mapping:
    objects: {进入受控区: 发起出口, 持证义务: 主管批准义务, 源题无对应规则: 医疗许可例外与隔离绝对禁止}
    shared_relations:
      - 事实触发一般规范后检查义务是否满足
      - 规则是否有效取决于更具体或更高优先级规范
      - 合规判定必须对每条记录应用全部相关规则
    varied:
      - 单层义务升级为义务、许可例外、绝对禁止三层优先规则
      - 输出既包含未获一般批准的违规，也包含违反高优先级禁止的违规
    adaptation_required:
      - E3 用 R2 合法覆盖 R1；E4 虽满足 R2 条件，仍被优先级更高的 R3 禁止
  lure:
    problem: >-
      另一基地只保留一条封闭规则：“所有出口都须主管批准”，不存在医疗例外或隔离规则。
      仍使用 E1—E4 的事实记录。请按编号排序输出全部违规记录。
    solution: E2、E3、E4 都发起出口且无主管批准，故三条违规；E1 合规。
    answer:
      parts:
        - {type: label, value: E2}
        - {type: label, value: E3}
        - {type: label, value: E4}
    why_surface_similar: 出口记录、批准状态和编号完全相同。
    why_structurally_different: lure 是单层义务；目标包含可覆盖义务的例外和再次覆盖例外的最高优先禁止。
    wrong_schema_id: flat-export-obligation-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: E2}
        - {type: label, value: E3}
        - {type: label, value: E4}
    derivation: 只执行最先看到的一般批准义务，忽略 R2 对 E3 的许可与 R3 对 E4 的绝对禁止层级。
  hints: *p4_hints
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p4_l4_01
    method: prioritized-defeasible-rule-evaluation
  provenance: original
  verified: 按 R3>R2>R1 决策，E1 与 E3 合规，E2 与 E4 违规；扁平规则探针多报 E3。

- id: V1-P6-L0-01
