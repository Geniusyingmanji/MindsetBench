  lure:
    problem: >-
      在另一培训项目中，公司先随机决定是否培训 X；培训会提升技能 C，技能再影响工资 Y，
      同时培训也可能直接影响工资。图为 X→C→Y 且 X→Y。识别培训对工资的总效应时，
      最小调整集是什么？输出 NONE、C 或 Y。
    solution: X 已随机化，没有后门路径；C 是处理中介，估计总效应时不应调整，故最小调整集为 NONE。
