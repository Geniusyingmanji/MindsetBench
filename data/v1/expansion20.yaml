  schema_id: noncausal-path-control-01
  schema_name: 先识别非因果路径，再决定阻断或保留
  level: 2
  chain: v1-p3-causal-01
  source: *p3_source
  target:
    domain: 劳动力经济学
    problem: >-
      地区景气 C 会影响劳动者是否参加培训 X，也会直接影响次年工资 Y；培训 X 还可能影响工资 Y。
      图为 C→X、C→Y、X→Y。要识别培训 X 对工资 Y 的总效应，最小调整集是什么？
      输出 NONE、C 或 Y。
    answer:
      parts: [{type: label, value: C}]
