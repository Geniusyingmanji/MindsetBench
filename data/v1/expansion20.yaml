  paradigm: P6
  thread: K-角色映射
  schema_id: anchored-role-mapping-01
  schema_name: 锚定后按关系职责而非位置映射角色
  level: 0
  chain: v1-p6-role-01
  source: &p6_source
    domain: 数字内容生产
    problem: >-
      印刷线中，策划员 P 向操作员 O 发送工单；O 把成品交给检验员 I；I 批准批次 B。
      数字媒体线中，编辑 E 向渲染引擎 R 发送工单；R 把视频交给审片员 V；V 批准发布物 L。
      已知 P 对应 E，按关系结构，I 对应哪个符号？
    solution: >-
      锚点 P↔E 固定两条链的方向。沿“发送工单”得 O↔R；沿“把产物交给”得 I↔V；
      二者都对末端对象执行批准关系，B↔L 再次核对。因此 I 对应 V。
    answer: V
  target:
    domain: 数字内容生产
    problem: >-
      音频线中，制作人 A 向混音师 B 发工单；B 把母带交给审核员 C；C 批准发行包 D。
      视频线中，导演 W 向渲染器 X 发工单；X 把成片交给审查员 Y；Y 批准发布包 Z。
      已知 A 对应 W，按关系结构，C 对应哪个符号？
    answer:
      parts: [{type: label, value: Y}]
  mapping:
    objects: {策划员 P: 制作人 A, 操作员 O: 混音师 B, 检验员 I: 审核员 C, 批次 B: 发行包 D}
    shared_relations:
      - 两个四角色系统都依次具有发工单、交付产物、批准末端对象三条有向关系
      - 首角色锚点固定映射方向
      - 待求角色是执行批准关系的主体
    varied: [同一内容生产域内仅替换媒体类型与角色符号]
  lure: null
  copy_probe: null
  hints: &p6_hints
    schema_name: 锚定后按关系职责而非位置映射角色
    oracle_mindset:
      insight: 先用已知锚点固定两个系统的对应方向，再比较候选角色参与的输入、输出和门控关系；职责关系优先于名称或线性位置。
      when_to_use: 两个案例共享角色关系，但名称、领域、节点数量或一对一粒度可能发生变化时。
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p6_l0_01
    method: relation-signature-matching
  provenance: original
  verified: 两条链的关系签名唯一确定 C↔Y。

