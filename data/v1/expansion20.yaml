- id: V1-P2-L0-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P2
  thread: B-符号约束
  schema_id: exact-one-csp-01
  schema_name: 精确约束下的唯一一致赋值
  level: 0
  chain: v1-p2-csp-01
  source: &p2_source
    domain: 计算机运维排程
    problem: >-
      四个维护任务 A、B、C、D 恰好各占用时段 1—4 之一，每个时段恰有一个任务。
      A 早于 C；B 紧接在 D 之后；C 不在时段 4。请按时段顺序输出四个任务组成的字符串。
    solution: >-
      枚举相邻块 DB 的位置。若 DB 在时段 1—2，则 A、C 只能在 3—4，但 C 不能在 4；
      若 DB 在 2—3，则 A、C 只能在 1—4，仍迫使 C 在 4。故 DB 只能在 3—4，
      A、C 依次占 1—2，唯一顺序为 ACDB。
    answer: ACDB
  target:
    domain: 计算机运维排程
    problem: >-
      四个维护任务 E、F、G、H 恰好各占用时段 1—4 之一，每个时段恰有一个任务。
      E 早于 G；F 紧接在 H 之后；G 不在时段 4。请按时段顺序输出四个任务组成的字符串。
    answer:
      parts: [{type: string, value: EGHF}]
  mapping:
    objects: {A: E, C: G, D: H, B: F}
    shared_relations:
      - 四个对象对四个时段的一一赋值
      - 一个先于约束、一个紧邻约束和一个末位排除约束
      - 满足全部约束的排列唯一
    varied: [仅替换任务符号]
  lure: null
  copy_probe: null
  hints: &p2_hints
    schema_name: 精确约束下的唯一一致赋值
    oracle_mindset:
      insight: 把每个完整赋值当作候选世界，传播互斥与关系约束，只保留同时满足全部硬约束的唯一世界。
      when_to_use: 对象必须一一占据有限状态，且答案由顺序、邻接、排除或真值约束共同决定时。
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p2_l0_01
    method: permutation-enumeration
  provenance: original
  verified: 穷举 4! 个排列，唯一解 EGHF。

