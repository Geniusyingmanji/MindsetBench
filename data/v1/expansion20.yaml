- id: V1-P3-L3-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P3
  thread: H-因果拓扑
  schema_id: noncausal-path-control-01
  schema_name: 先识别非因果路径，再决定阻断或保留
  level: 3
  chain: v1-p3-causal-01
  source: *p3_source
  target:
    domain: 教育政策评估
    problem: >-
      家庭资源 C 影响是否参加辅导 X，也直接影响期末成绩 Y；辅导 X 会先提高练习量 M，
      M 再提高 Y，且 X 还可能直接影响 Y。图为 C→X、C→Y、X→M→Y、X→Y。
      要识别 X 对 Y 的总效应，以下哪个是最小有效调整集？输出 NONE、C、M 或 C+M。
    answer:
      parts: [{type: string, value: C}]
  mapping:
    objects: {共同原因 U: 家庭资源 C, 治疗 T: 辅导 X, 结局 Y: 成绩 Y, 源题无对应对象: 中介 M}
    shared_relations:
      - C 打开 X←C→Y 后门，必须阻断
      - X 到 Y 的全部有向路径构成目标总效应
    added_relations: [新增处理后中介路径 X→M→Y]
    adaptation_required:
      - 保留“控制共同原因”，但拒绝把所有能预测 Y 的变量一并控制
      - 识别总效应时不能控制 X 的后代 M
    varied: [从三节点混杂图扩为含直接效应与中介效应的四节点图]
  lure:
    problem: >-
      沿用同一教育因果图 C→X、C→Y、X→M→Y、X→Y，但研究问题改为识别
      辅导 X 不经过练习量 M 的直接效应。输出 NONE、C、M 或 C+M。
    solution: C 用于阻断后门；M 需被控制以切断中介路径，故直接效应分析采用 C+M。
    answer:
      parts: [{type: string, value: C+M}]
    why_surface_similar: 变量、教育故事与整张因果图完全相同，只把“总效应”换成“直接效应”。
    why_structurally_different: 总效应必须保留中介路径，直接效应则要阻断它；因此 M 的调整角色相反。
    wrong_schema_id: direct-effect-adjustment-01
  copy_probe:
    answer:
      parts: [{type: string, value: C+M}]
    derivation: 机械控制所有同时能预测成绩的可观测变量，把处理后的中介 M 错当成额外混杂因素。
  hints: *p3_hints
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p3_l3_01
    method: backdoor-graph-and-descendant-check
  provenance: original
  verified: 后门图中 C 阻断唯一后门；M 是 X 的后代，C+M 不满足总效应后门准则。

- id: V1-P3-L4-01
  version: "1.0"
  split: sanity
  history_note: >-
    2026-09-03 降级为 sanity：首批 20 题把 DAG、规则优先级和门控职责直接写进题面，target-only 无净空（见 docs/AR_HARD_CONSTRUCTION.md“为什么首批 20 题不合格”）。仅保留为 runner/grader/verifier 冒烟数据。
  paradigm: P3
  thread: H-因果拓扑
  schema_id: noncausal-path-control-01
  schema_name: 先识别非因果路径，再决定阻断或保留
  level: 4
  chain: v1-p3-causal-01
  source: *p3_source
  target:
    domain: 科研项目档案分析
    problem: >-
      在总体中，研究团队能力 A 与获得的额外预算 B 相互独立；A 高或 B 高都会提高项目进入
      “成果档案”S 的概率，结构为 A→S←B。分析员只拿到了 S=1 的入档项目，并在其中观察到
      A 与 B 明显负相关。仅依据这些信息，应输出哪一结论：
      A-CAUSES-B、B-CAUSES-A 或 NONCAUSAL。
    answer:
      parts: [{type: string, value: NONCAUSAL}]
  mapping:
    objects: {非因果后门路径: 条件化选择对撞点后打开的非因果路径, 调整决策: 判断入档筛选能否制造关联, 因果结论: 相关是否可被解释为因果}
    shared_relations:
      - 观测关联可能由因果拓扑中的非目标路径产生
      - 必须先分析路径的开闭状态，再解释相关性
      - 图结构足以否定由相关方向直接推出因果方向
    varied:
      - 共同原因后门改为共同结果对撞点
      - 从选择调整集改为解释经选择后的关联
      - 不再计算一个控制变量，只保留“拓扑先于相关”的高层图式
    adaptation_required:
      - 识别条件 S=1 会打开 A→S←B 路径，使原本独立的 A、B 在样本内相关
  lure:
    problem: >-
      另一批项目中，额外预算 B 由随机抽签分配；能力评分 A 在分配后按预注册量表测量，
      所有项目无选择地进入数据。若 B 高组的 A 明显更低且实验执行无偏差，
      输出 A-CAUSES-B、B-CAUSES-A 或 NONCAUSAL。
    solution: B 是随机干预且先于 A，完整样本排除了题设中的选择机制；负组间差支持 B-CAUSES-A。
    answer:
      parts: [{type: string, value: B-CAUSES-A}]
    why_surface_similar: 同为项目预算 B、能力评分 A 与负相关结果。
    why_structurally_different: lure 中 B 被随机干预且没有按共同结果选择，相关具有明确干预方向；目标只是对撞选择偏差。
    wrong_schema_id: randomized-treatment-effect-01
  copy_probe:
    answer:
      parts: [{type: string, value: B-CAUSES-A}]
    derivation: 忽略只观察 S=1 的选择条件，把样本内负相关按时间或资源直觉直接解释为预算降低能力。
  hints: *p3_hints
  verification:
    entrypoint: mindsetbench.verification.expansion_cases:verify_v1_p3_l4_01
    method: collider-selection-probability-enumeration
  provenance: original
  verified: 令 A、B 独立等概率二元且 S=A∨B；条件 S=1 后二者负相关，但任一方向因果边均不存在。

