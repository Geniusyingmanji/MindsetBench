    objects: {严重度 U: 地区景气 C, 治疗 T: 培训 X, 临床结局 Y: 工资 Y}
    shared_relations:
      - C 是处理前共同原因并打开 X←C→Y 后门
      - X→Y 是待识别的目标因果路径
      - 调整 C 且不调整 Y 可识别总效应
