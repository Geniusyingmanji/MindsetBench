      同一状态但已用卡不同会有不同后继。即使状态与已用卡集合都相同，等成本的不同有序路径必须分别保留并计数，
      否则无法证明最优路径唯一。每条路径首次到达目标即终止该路径。按总代价非降序枚举，直到完整处理首个目标成本
      和下一个出现目标的成本层。成本 12 以前没有目标；成本 12 恰有一条；成本 13 有五条。
      该源查询与目标题的初态、目标态及最优卡序均不同，只迁移搜索与证书方法，不迁移答案路径。
      证书：C*=12；P*=S3>S7>S2>S4>S5；N<C*=0；N=C*=1；Cnext=13；Nnext=5。
    answer: 12;S3>S7>S2>S4>S5;0;1;13;5
