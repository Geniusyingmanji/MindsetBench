- id: HARD-P2-L3-01
  version: "1.0"
  split: dev
  paradigm: P2
  thread: B-符号约束
  schema_id: parity-toggle-with-cardinality-01
  schema_name: 从局部翻转恢复全局状态并满足集合约束
  level: 3
  source:
    domain: 数字电路自检
    problem: >-
      六个指示位 A—F 初始均为 0。按钮 B1—B6 每个至多按一次，按下会翻转所列位：
      B1:ABC，B2:BD，B3:ACE，B4:CDF，B5:BEF，B6:ADE。
      要使六位最终全为 1，输出按编号字典序最小的按钮集合；多项用分号分隔。
    solution: >-
      将每个按钮是否按下记为 GF(2) 变量，某位最终为 1 等价于覆盖该位的按钮变量异或为 1。
      对六个方程消元得到两个可行集合 {B1,B2,B5} 与 {B2,B4,B6}；按编号比较，前者更小。
    answer: B1;B2;B5
  target:
    domain: 合成细胞脉冲实验
    problem: >-
      九个荧光标记 A—I 初始均为暗。十种脉冲 J1—J10 每种至多施加一次；每次会把所列标记
      从暗变亮或从亮变暗：J1:DI，J2:CEGI，J3:BFGH，J4:AI，J5:BEFGHI，
      J6:DFG，J7:CDGI，J8:CDEGH，J9:BCEH，J10:ABCDEFGI。
      实验结束时必须恰有 A、D、G、H 为亮，其余为暗，并且必须恰好施加四种脉冲。
      按编号升序输出这四种脉冲；用分号分隔。
    answer:
      parts:
        - {type: label, value: J1}
        - {type: label, value: J5}
        - {type: label, value: J7}
        - {type: label, value: J10}
  mapping:
    objects: {电路位: 荧光标记, 按钮: 实验脉冲, 按一次: 施加一次, 目标位模式: 目标亮暗模式}
    shared_relations:
      - 每个操作对一组二元状态执行翻转
      - 同一状态被翻转偶数次保持、奇数次改变
      - 全局目标等价于一组异或约束
    added_relations: [目标另要求所选操作集合的基数恰好为四]
    adaptation_required: [先求异或方程的全部仿射解，再按集合基数筛选，而非任取一个消元解]
    varied: [六状态六操作改为九状态十操作的欠定系统，并加入基数约束]
  lure:
    problem: >-
      使用相同的九个标记和十种脉冲覆盖表，但这套标记一旦被脉冲点亮就不会熄灭；
      只要求 A、D、G、H 最终都亮，其他标记状态不作要求。求脉冲数最少的集合；
      若并列，取按编号字典序最小者。
    solution: >-
      这是单调覆盖而非翻转抵消。没有单个脉冲同时覆盖 A、D、G、H；
      J3 覆盖 G、H，J10 覆盖 A、D、G，二者合并满足目标，且是字典序最小的二脉冲解。
    answer:
      parts:
        - {type: label, value: J3}
        - {type: label, value: J10}
    why_surface_similar: 标记、脉冲及目标状态完全相同。
    why_structurally_different: lure 的点亮不可逆且允许额外标记变亮，是单调集合覆盖；目标操作会翻转抵消，并要求完整亮暗模式与四脉冲基数。
    wrong_schema_id: monotone-set-cover-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: J3}
        - {type: label, value: J10}
    derivation: 把可逆翻转误作只增不减的覆盖，选择能并集覆盖目标标记的最少脉冲 J3、J10。
  hints:
    schema_name: 从局部翻转恢复全局状态并满足集合约束
    oracle_mindset:
      insight: 先把反复翻转编码成 GF(2) 线性约束，枚举自由变量产生的全部解，再施加非线性的集合基数约束。
      when_to_use: 多个操作对重叠的二元状态执行可抵消翻转，且还有限制操作数量时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p2_l3_01
    method: exhaustive-bitmask-enumeration
  provenance: original; AR-style transfer from digital circuit syndrome solving to synthetic-cell pulse design
  verified: 穷举 2^10 个操作子集得到四个可达解，其中唯一四元素解为 J1,J5,J7,J10。

- id: HARD-P3-L3-01
  version: "1.0"
  split: dev
  paradigm: P3
  thread: H-因果拓扑
  schema_id: multi-backdoor-with-posttreatment-01
  schema_name: 从叙述恢复路径并区分混杂代理、中介和对撞
  level: 3
  source:
    domain: 公共卫生政策
    problem: >-
      基线风险 U 同时影响是否采用政策 T 和结局 Y；政策 T 会改变中间行为 M，M 再影响 Y，
      且 T 也直接影响 Y。要识别 T 对 Y 的总效应，在 U、M 中应调整哪些变量？
    solution: U 打开 T←U→Y 后门，必须调整；M 位于 T→M→Y 上，是总效应的一部分，不能调整。答案 U。
    answer: U
  target:
    domain: 软件运维政策评估
    problem: >-
      某公司想评估采用自动回滚 X 对事故损失 Y 的总影响。长期行政传统 A 会影响是否采用 X，
      也会提高审计强度 B；B 会降低 Y，但 A 无法直接观测。工作负荷 C 同时影响 X 与 Y。
      采用 X 会改变告警数量 M，M 又影响 Y；X 也可能直接影响 Y。X 与 Y 都会增加事后复盘 D
      被启动的概率。地区补贴 Z 影响 X，但除经由 X 外不影响上述变量。
      数据中可观测 B、C、M、D、Z。为识别 X 对 Y 的总效应，输出一个变量数最少的有效调整集，
      按字母排序并用分号分隔；若无需调整输出 NONE。
    answer:
      parts:
        - {type: label, value: B}
        - {type: label, value: C}
  mapping:
    objects: {政策 T: 自动回滚 X, 结局 Y: 事故损失 Y, 基线风险 U: 工作负荷 C, 中间行为 M: 告警数量 M}
    shared_relations:
      - 处理前共同原因产生必须阻断的后门路径
      - 处理后的中介承载部分总效应
      - 总效应调整集不能包含处理中介
    added_relations:
      - 不可观测共同原因 A 通过可观测 B 位于另一条后门路径上
      - 事后复盘 D 是 X 与 Y 的共同结果
      - Z 只影响处理，不是必要调整变量
    adaptation_required: [逐路径检查并选择 B、C，排除中介 M、对撞后代 D 与非必要工具变量 Z]
    varied: [三节点显式图改为需从自然叙述恢复的九变量多路径结构]
  lure:
    problem: >-
      沿用完全相同的公司、变量和影响关系，但研究问题改为自动回滚 X 不经过告警数量 M 的直接效应。
      输出变量数最少的有效调整集，按字母排序并用分号分隔。
    solution: B、C 阻断两条后门；M 需被固定以排除 X→M→Y 的中介部分；D 是共同结果，Z 非必要。答案 B;C;M。
    answer:
      parts:
        - {type: label, value: B}
        - {type: label, value: C}
        - {type: label, value: M}
    why_surface_similar: 所有变量和事实相同，仅估计量从总效应变成直接效应。
    why_structurally_different: M 在直接效应问题中需要固定，在总效应问题中必须保留。
    wrong_schema_id: controlled-direct-effect-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: B}
        - {type: label, value: C}
        - {type: label, value: M}
    derivation: 把所有位于 X 与 Y 之间且能预测 Y 的变量都控制，错误切断了目标总效应的中介路径。
  hints:
    schema_name: 从叙述恢复路径并区分混杂代理、中介和对撞
    oracle_mindset:
      insight: 先从叙述画出方向图，逐条阻断进入处理的非因果路径，同时排除处理后中介和共同结果。
      when_to_use: 多个处理前与处理后变量混在自然叙述中，需要寻找总效应的最小调整集时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p3_l3_01
    method: backdoor-graph-enumeration
  provenance: original; AR-style transfer from epidemiologic adjustment to software policy evaluation
  verified: 枚举 B,C,M,D,Z 的全部子集并执行后门与后代约束，唯一最小集为 B,C。

- id: HARD-P4-L3-01
  version: "1.0"
  split: dev
  paradigm: P4
  thread: I-规范规则
  schema_id: derived-exception-priority-01
  schema_name: 事实派生后执行例外与不可覆盖禁止
  level: 3
  source:
    domain: 海底站运输章程
    problem: >-
      一般条款：离站货舱须有站长批准。例外：紧急医疗货舱同时有医官批准和定位信标时可免站长批准。
      最高条款：危险货舱一律不得离站，任何批准不得覆盖。记录 S1 普通且有站长批准；
      S2 普通且无批准；S3 紧急医疗、无站长批准但有医官批准和信标；S4 危险且有站长批准。
      输出全部违规编号。
    solution: S1 合规；S2 缺一般批准；S3 完整满足例外；S4 被最高禁止覆盖批准。答案 S2;S4。
    answer: S2;S4
  target:
    domain: 环轨样本发运章程
    problem: >-
      本题世界只有以下条款和记录。①发往环轨站的舱体须有指挥官批准。
      ②紧急医疗舱若同时有医官批准和工作信标，可不受①限制。训练演习不算紧急。
      ③危险舱不得发运，①②及任何批准都不能改变此条。
      ④Lumen 样本若外壳完整性测试失败就算危险，通过则不算危险；Nox 样本除非持有去污证，否则算危险。
      记录：Q1 环轨普通舱，有指挥官批准，惰性样本；Q2 环轨普通舱，无指挥官批准，惰性样本；
      Q3 环轨紧急医疗舱，无指挥官批准，有医官批准和工作信标，惰性样本；
      Q4 环轨紧急医疗舱，无指挥官批准，有医官批准但信标失效，惰性样本；
      Q5 环轨医疗训练舱，无指挥官批准，有医官批准和工作信标，惰性样本；
      Q6 环轨普通舱，有指挥官批准，Lumen 样本且完整性测试失败；
      Q7 环轨紧急医疗舱，无指挥官批准，有医官批准和工作信标，Nox 样本且无去污证；
      Q8 环轨普通舱，有指挥官批准，Nox 样本且有去污证；
      Q9 发往核心站的普通舱，无指挥官批准，Nox 样本且无去污证；
      Q10 发往核心站的普通舱，无指挥官批准，惰性样本。
      按编号升序输出所有违反至少一条有效条款的记录，用分号分隔。
    answer:
      parts:
        - {type: label, value: Q2}
        - {type: label, value: Q4}
        - {type: label, value: Q5}
        - {type: label, value: Q6}
        - {type: label, value: Q7}
        - {type: label, value: Q9}
  mapping:
    objects: {离站货舱: 发运舱体, 站长批准: 指挥官批准, 紧急医疗双条件: 医官批准与工作信标, 危险货舱: 派生为危险的样本舱}
    shared_relations:
      - 一般批准义务可被完整满足的紧急例外取消
      - 危险禁止高于一般批准与紧急例外
      - 每条记录必须应用全部有效条款
    added_relations:
      - 危险状态需由样本类型、测试与证书事实派生
      - 训练演习与失效信标分别构成例外边界
      - 一般批准只约束环轨目的地，而危险禁止约束所有发运
    adaptation_required: [先闭包派生危险状态，再逐记录应用例外条件与不可覆盖禁止]
    varied: [四记录三规则扩为十记录、两个派生规则和多个边界条件]
  lure:
    problem: >-
      使用相同十条记录，但该基地只有条款“发往环轨站的舱体须有指挥官批准”，不存在其他条款。
      输出全部违规编号。
    solution: 环轨且无指挥官批准的记录为 Q2、Q3、Q4、Q5、Q7。
    answer:
      parts:
        - {type: label, value: Q2}
        - {type: label, value: Q3}
        - {type: label, value: Q4}
        - {type: label, value: Q5}
        - {type: label, value: Q7}
    why_surface_similar: 十条事实记录与一般批准条款完全相同。
    why_structurally_different: lure 没有紧急例外、危险派生及最高禁止，只需一次条件匹配。
    wrong_schema_id: flat-ring-approval-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: Q2}
        - {type: label, value: Q3}
        - {type: label, value: Q4}
        - {type: label, value: Q5}
        - {type: label, value: Q7}
    derivation: 只执行第一条一般义务，没有应用紧急例外，也没有派生并执行全局危险禁止。
  hints:
    schema_name: 事实派生后执行例外与不可覆盖禁止
    oracle_mindset:
      insight: 先由底层事实求出派生类别，再判断一般义务、完整例外条件和最高优先禁止，最后合并违规。
      when_to_use: 规范前件依赖派生事实，且一般规则、例外和不可覆盖禁止同时存在时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p4_l3_01
    method: forward-chaining-priority-rule-engine
  provenance: original; AR-style transfer from access-control policy evaluation to fictional shipping rules
  verified: 独立规则引擎逐记录闭包求值，违规集合 Q2,Q4,Q5,Q6,Q7,Q9。

- id: HARD-P6-L3-01
  version: "1.0"
  split: dev
  paradigm: P6
  thread: K-角色映射
  schema_id: anchored-dense-graph-mapping-01
  schema_name: 在插入节点与近邻干扰下保持全局关系签名
  level: 3
  source:
    domain: 数据发布流程
    problem: >-
      系统一：A 向 B 发任务；B 把产物交 C；C 批准 D；B 向 E 报告；E 可阻止 C 批准。
      系统二：P 向 Q 发任务；Q 把产物交 R；R 批准 S；Q 向 T 报告；T 可阻止 R 批准。
      已知 A↔P、D↔S，输出 B、C、E 依次对应的符号。
    solution: 同时保持任务接收与双出边得 B↔Q；保持批准末端锚点得 C↔R；保持阻止批准者关系得 E↔T。答案 Q;R;T。
    answer: Q;R;T
  target:
    domain: 极地样本与机器人数据流程
    problem: >-
      流程甲有角色 A1—A8：A1 向 A2 发计划；A2 把原始载荷交 A3，并向 A6 报告；
      A3 把处理后载荷交 A4，同时把校验码发给 A6；A4 认证 A5；A6 可阻止 A4 的认证；A2 监测 A7；
      A7 可替代 A6 发出阻止；A8 只归档 A5。
      流程乙有角色 B1—B9：B1 向 B4 发计划；B4 把原始载荷交 B7，并向 B2 报告；
      B7 先把载荷交 B8，并把校验码发给 B2；B8 再把载荷交 B6；B6 认证 B3；B2 可阻止 B6 的认证；
      B4 监测 B5；B5 可替代 B2 发出阻止；B9 只归档 B3。
      已知 A1 对应 B1、A5 对应 B3、A8 对应 B9。要求尽量保持角色参与的全部有向关系，
      输出 A2、A3、A4、A6、A7 依次对应的 B 角色，用分号分隔。
    answer:
      parts:
        - {type: label, value: B4}
        - {type: label, value: B7}
        - {type: label, value: B6}
        - {type: label, value: B2}
        - {type: label, value: B5}
  mapping:
    objects: {任务发送者: 计划发送者, 执行与报告角色: A2/B4, 中间处理角色: A3/B7, 批准角色: A4/B6, 阻止者: A6/B2}
    shared_relations:
      - 首端、末端与归档角色提供三个锚点
      - 执行角色同时接收计划、传递载荷、报告并监测替代者
      - 认证者指向末端锚点并被报告接收者阻止
      - 替代者可替代主要阻止者
    added_relations: [流程乙在中间处理角色与认证角色之间插入 B8]
    adaptation_required: [忽略路径长度变化，按全局入边、出边和关系类型联合匹配，而非按线性位置对齐]
    varied: [五节点链扩成带报告、阻止、监测、替代和归档关系的稠密图]
  lure:
    problem: >-
      沿用两套流程与三个锚点，但流程乙改为 B7 认证 B3，B8 仅把载荷交给 B6，B6 只归档副本；
      其余关系不变。按关系职责输出 A4 对应的 B 角色。
    solution: A4 对末端 A5 执行认证；修改后的流程乙中对 B3 执行认证的是 B7，所以答案 B7。
    answer:
      parts: [{type: label, value: B7}]
    why_surface_similar: 角色、锚点与除认证边外的全部叙述相同。
    why_structurally_different: 唯一决定批准角色的认证边从 B6 改接到 B7。
    wrong_schema_id: local-position-role-map-01
  copy_probe:
    answer:
      parts:
        - {type: label, value: B4}
        - {type: label, value: B7}
        - {type: label, value: B8}
        - {type: label, value: B2}
        - {type: label, value: B5}
    derivation: 前两项映射后按线性位置把 A4 对到插入节点 B8，没有检查谁真正对末端锚点执行认证。
  hints:
    schema_name: 在插入节点与近邻干扰下保持全局关系签名
    oracle_mindset:
      insight: 用锚点固定方向，为每个角色建立带关系类型的入出边签名；节点插入时优先保持高阶职责而非路径位置。
      when_to_use: 两个案例的角色图大体相似，但一侧新增中间节点且存在局部签名相近的干扰角色时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p6_l3_01
    method: labeled-relation-graph-matching
  provenance: original; AR-style transfer from workflow alignment to cross-system role mapping
  verified: 穷举锚点约束下的一一映射并最大化保留关系，唯一最优映射给出 B4,B7,B6,B2,B5。

- id: HARD-P6-L4-02
  version: "1.0"
  split: dev
  paradigm: P6
  thread: K-角色映射
  schema_id: joint-node-relation-codebook-alignment-01
  schema_name: 联合恢复节点对应与潜在关系词典
  level: 4
  source:
    domain: 异地生态传感器数据对齐
    problem: >-
      两支生态队记录了同一群功能角色，但节点代号和三种关系码均被独立重命名。
      甲队节点 P1—P5，记录为 P1-hun-P2、P2-vek-P3、P3-rom-P5、
      P2-rom-P4、P4-hun-P5、P3-hun-P4。乙队节点 Q1—Q6，记录为
      Q4-@-Q2、Q2-#-Q5、Q5-%-Q1、Q2-%-Q3、Q3-@-Q1、Q5-@-Q6、Q6-@-Q3、
      Q2-@-Q1。已知 P1↔Q4、P5↔Q1；乙队最多有一个额外中继节点，会把一条记录拆成
      关系码相同的两跳。求 P2、P3、P4 对应节点，以及 hun、vek、rom 依次对应的乙队关系码。
    solution: >-
      不能先按名称、频率或局部度数固定关系码；要同时枚举节点单射与关系码双射，
      对每组联合假设计算被保留的有向关系数。直接边 Q5-@-Q3 缺失，但
      Q5-@-Q6-@-Q3 恰好是允许的一次中继拆分。唯一保留全部六条关系的联合映射为
      P2↔Q2、P3↔Q5、P4↔Q3，hun↔@、vek↔#、rom↔%。
    answer: Q2;Q5;Q3;@;#;%
  target:
    domain: 无语义符号档案的协议同一化
    problem: >-
      档案甲含节点 A1—A7 与四种无定义记号 nex、vul、sor、tal。其有向记录为：
      A1-nex-A2；A2-vul-A3；A3-sor-A4；A4-tal-A7；A2-sor-A5；A5-nex-A6；
      A6-vul-A4；A3-tal-A6；A5-vul-A7；A1-tal-A5；A6-sor-A7；A4-nex-A2。

      档案乙含节点 B1—B8 与四种同样无定义的记号 ○、◇、△、□。其有向记录为：
      B3-○-B7；B6-◇-B5；B6-△-B3；B7-□-B8；B8-□-B1；B1-◇-B2；
      B1-△-B3；B3-○-B5；B3-□-B5；B4-○-B1；B4-□-B2；B4-□-B3；
      B5-○-B2；B5-◇-B1；B5-△-B4；B7-◇-B4；B7-△-B4。

      已知 A1↔B6、A7↔B2。需要同时选择：①将七个 A 节点一对一地嵌入八个 B 节点；
      ②将四种甲记号与四种乙记号建立双射。一条甲记录若在联合映射后对应于
      乙档案的同记号直接边，记1分；若对应于经一个额外 B 中继节点的同记号两跳，
      也记1分。其他乙记录可为噪声。求总分最高的联合映射。
      依次输出 A2、A3、A4、A5、A6 对应的 B 节点，再输出 nex、vul、sor、tal
      依次对应的乙记号；全部用分号分隔。
    answer:
      parts:
        - {type: label, value: B3}
        - {type: label, value: B7}
        - {type: label, value: B1}
        - {type: label, value: B5}
        - {type: label, value: B4}
        - {type: string, value: △}
        - {type: string, value: ○}
        - {type: string, value: □}
        - {type: string, value: ◇}
  mapping:
    objects: {生态功能节点: 档案协议节点, 传感器关系码: 无语义档案记号, 额外采集器: 额外 B 中继节点, 已知生物锚点: 已知档案锚点}
    shared_relations:
      - 节点标识与关系标识同时发生了未知置换
      - 有向三元关系是评分而非表面名称的基本单位
      - 单个额外中继可将一跳关系伸长为同类型两跳
      - 真正对应应在全局上最大化保留的带类型有向关系
    added_relations: [四种关系词典需与五个未知节点同时恢复, 乙档案加入四条会欺骗局部签名的噪声边]
    adaptation_required: [在节点排列与关系码排列的直积空间中联合优化, 允许一条关系经中继保持而不要求完全同构]
    varied: [三关系六条记录扩为四关系十二条信号加五条中继或噪声记录]
  lure:
