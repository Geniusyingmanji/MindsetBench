      关系记号不得根据全局关系重排，而必须按两份记录中首次出现的顺序对齐。
      因此 nex、vul、sor、tal 被固定对应为 ○、◇、△、□。在此固定词典下，
      仍按直接边或同记号两跳计分，求分数最高的节点映射，并以目标要求的九段格式输出。
    solution: >-
