- id: HARD-P2-L4-02
  version: "1.0"
  split: dev
  paradigm: P2
  thread: B-符号约束
  schema_id: poset-cumulative-inversion-01
  schema_name: 识别偏序上的累积算子并反演局部量
  level: 4
  source:
    domain: 周期信号的除数谐波分解
    problem: >-
      某设备只使用 42 的正除数作为周期标签。标签 n 的观测量 H(n) 等于所有周期 d
      整除 n 的本征量 h(d) 之和，全部数值按模 97 计算。已知
      H(1)=11、H(2)=48、H(3)=20、H(6)=12、H(7)=35、H(14)=56、H(21)=89、H(42)=31。
      求 h(42)。
    solution: >-
      观测是除数偏序上的向下累积，应作 Möbius 反演，不能把 H(42) 当本征量。
      由 42=2·3·7 无平方因子，
      h(42)=H(42)-H(21)-H(14)-H(6)+H(7)+H(3)+H(2)-H(1)
      =31-89-56-12+35+20+48-11≡63 (mod 97)。
    answer: "63"
  target:
    domain: 可删印记黑箱档案
    problem: >-
      一块板的代号是 a—f 中若干个不重复印记按字母顺序连写，空板记为 ∅。
      每块板 S 有一个未知本征残量 r(S)。仪器对 S 显示的 R(S) 等于从 S 删去任意多个印记
      能得到的每块板（包括 S 自身和 ∅）的本征残量之和；全部加减都按模 97 计算。
      仪器完整记录如下，每项为“板:R”：

      ∅:65
      a:52，b:24，c:32，d:90，e:50，f:22
      ab:48，ac:17，ad:75，ae:43，af:89，bc:93，bd:88，be:66，bf:45，cd:19，ce:43，cf:88，de:44，df:65，ef:23
      abc:86，abd:47，abe:11，abf:82，acd:34，ace:12，acf:42，ade:24，adf:25，aef:89，bcd:43，bce:3，bcf:14，bde:34，bdf:31，bef:53，cde:31，cdf:80，cef:67，def:38
      abcd:51，abce:47，abcf:75，abde:36，abdf:66，abef:40，acde:8，acdf:96，acef:14，adef:4，bcde:93，bcdf:88，bcef:15，bdef:11，cdef:37
      abcde:72，abcdf:56，abcef:83，abdef:29，acdef:95，bcdef:76
      abcdef:56

      依次求 r(abcf)、r(acdef)、r(bcdef)、r(abcdef)，用分号分隔。
    answer:
      parts:
        - {type: number, value: "69"}
        - {type: number, value: "53"}
        - {type: number, value: "96"}
        - {type: number, value: "24"}
  mapping:
    objects: {周期除数标签: 印记子集板, 本征谐波量: 本征残量, 除数累积观测: 删印记累积读数, 42 的除数格: 六印记布尔格}
    shared_relations:
      - 观测量是所有不大于当前元素的局部量之和
      - 偏序的向下累积可用 Möbius 函数唯一反演
      - 原素添加对应覆盖关系中的一层上升
      - 在无平方的布尔区间上反演系数按差集大小交替取正负
    added_relations: [目标同时询问四个不同大小的子集, 数据扩展到六元布尔格的全部 64 个元素]
    adaptation_required: [将整除关系改写为印记包含关系, 对每个查询的全部子集按奇偶层作交替求和再取模]
    varied: [八元除数区间改为六维布尔偏序，并从单查询改为四查询]
  lure:
    problem: >-
      另一台仪器使用同样的 64 块板和完全相同的读数表，但其 R(S) 累加的是能通过
      向 S 添加印记得到的所有板的本征残量，而不是通过删除印记得到的板。
      对这台反向累积仪器，依次求四个相同查询的本征残量。
    solution: >-
      这是超集方向的累积，应从包含查询板的超集向下反演。对给定表作反向布尔 Möbius 反演得
      r(abcf)=89、r(acdef)=39、r(bcdef)=20、r(abcdef)=56。
    answer:
      parts:
        - {type: number, value: "89"}
        - {type: number, value: "39"}
        - {type: number, value: "20"}
        - {type: number, value: "56"}
    why_surface_similar: 64 块板、数值表、模数和四个查询完全相同。
    why_structurally_different: lure 累加超集而目标累加子集，偏序反演的方向相反。
    wrong_schema_id: reverse-poset-cumulative-inversion-01
  copy_probe:
    answer:
      parts:
        - {type: number, value: "89"}
        - {type: number, value: "39"}
        - {type: number, value: "20"}
        - {type: number, value: "56"}
    derivation: 误把“从 S 删除印记”的向下累积当成“向 S 添加印记”的向上累积，从超集而非子集方向反演。
  hints:
    schema_name: 识别偏序上的累积算子并反演局部量
    oracle_mindset:
      insight: 先确定读数是沿包含偏序向下累积；在布尔格上，本征量等于全部子集读数按差集大小交替求和。
      when_to_use: 每个观测值累加了其所有前驱、子集或除数状态，需恢复单个状态的局部贡献时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p2_l4_02
    method: recursive-and-closed-form-boolean-mobius-inversion
  provenance: original; AR-style transfer from divisor-lattice harmonic decomposition to Boolean-lattice black-box residue recovery
  verified: 递归下集消元与交替和闭式反演对 64 个状态逐项一致；反向超集反演独立产生 copy-probe。

- id: HARD-P2-L4-03
  version: "1.0"
  split: dev
  paradigm: P2
  thread: B-符号约束
  schema_id: weighted-rooted-functional-digraph-count-01
  schema_name: 将局部唯一后继约束迁移为有向生成树计数
  level: 4
  source:
    domain: 微生物避难迁徙路径组合
    problem: >-
      三个菌落 U、V、W 都要固定一个后继去向，避难所 R 不选后继。可用有向通道及
      并行形态数为 U→V:2、U→R:1、V→W:3、V→R:2、W→U:1、W→R:4。
      有效方案要求从任一菌落反复跟随所选后继都最终到达 R。一个后继结构若每条边分别有
      w 种并行形态，记为形态数乘积份不同方案。求有效方案总数。
    solution: >-
      局部“每点一个后继”加全局“全部汇入 R”恰好计数指向根 R 的带权有向生成树。
      建立出边拉普拉斯矩阵 L：L_ii 为 i 的出边权和，L_ij=-w(i→j)。删除 R 行列后得
      [[3,-2,0],[0,5,-3],[-1,0,5]]，其行列式为 69，即所求总数。
    answer: "69"
  target:
    domain: 抽象后继场的全局收敛认证
    problem: >-
      有七个代号 A—G。除 G 外，每个代号必须选且只选一个从自身指向其他代号的
      “后继对”；G 不选。对每个非 G 代号反复跟随被选的指向，必须有限步后到达 G，
      不允许落入其他环。可用的指向及其后继对变体数 w 如下：

      A→C:5，A→D:2，A→B:4；
      B→C:5，B→D:5，B→E:5；
      C→G:1，C→F:3，C→A:2；
      D→E:3，D→G:2，D→F:4；
      E→D:2，E→B:2，E→G:4；
      F→G:4，F→A:4，F→E:2；
      G→D:3，G→F:2，G→B:4。

      固定六个非 G 代号的指向结构后，每条已选指向还可独立选择其 w 个变体之一；
      所以该结构贡献的认证数是六条已选指向的 w 之积。求所有满足全局收敛条件的认证总数，
      最后只输出该总数对 1009 取余的结果。
    answer:
      parts: [{type: number, value: "64"}]
  mapping:
    objects: {菌落: 抽象代号, 避难所 R: 收敛点 G, 迁徙后继: 后继对, 通道并行形态: 后继对变体}
    shared_relations:
      - 每个非根节点恰有一条被选出边
      - 所有被选边从任一节点出发都最终汇入根
      - 全局无非根有向环与指向根的有向生成树等价
      - 边变体独立使每棵树的贡献为边权乘积
    added_relations: [节点从四个扩为七个并加入密集环路, 最终总数按素数 1009 取余]
    adaptation_required: [从自然语言的后继场识别指向根的带权树计数, 使用出边拉普拉斯而非入边拉普拉斯并删除 G 行列]
    varied: [三个非根节点的小型示例改为六个非根节点的带权密集实例]
  lure:
    problem: >-
      使用完全相同的七个代号、有向边和变体数。但另一种认证要求每个非 G 代号
      选且只选一条指向自身的入边，并且从 G 沿被选指向的正方向能到达每个代号。
      同样按已选边的 w 乘积计数，求总数对 1009 的余数。
    solution: >-
      这一版计数从 G 向外展开的带权有向树，因此使用入边权和构造的相反方向拉普拉斯余子式。
      精确行列式为 232700，对 1009 取余得 630。
    answer:
      parts: [{type: number, value: "630"}]
    why_surface_similar: 节点、全部边、权重、根 G 与取模规则完全相同。
    why_structurally_different: lure 选入边并从根向外可达；目标选出边并向根收敛，所需拉普拉斯方向相反。
    wrong_schema_id: weighted-out-arborescence-count-01
  copy_probe:
    answer:
      parts: [{type: number, value: "630"}]
    derivation: 将“每点选一条出边并汇入 G”误作“每点选一条入边并从 G 展开”，使用了相反的拉普拉斯余子式。
  hints:
    schema_name: 将局部唯一后继约束迁移为有向生成树计数
    oracle_mindset:
      insight: 每个非根点选一条出边且所有路径汇入根，等价于指向根的带权树；其总权是出边拉普拉斯的根余子式。
      when_to_use: 需计数带权后继函数，并额外要求无非根环、全局汇入指定吸收点时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p2_l4_03
    method: bareiss-directed-matrix-tree-and-exhaustive-source-check
  provenance: original; AR-style transfer from weighted migration convergence to anonymous successor-field certification
  verified: 小型 source 用直接枚举与行列式双重复算；target 使用 Bareiss 整数消元得 326980≡64 (mod 1009)，反向 lure 得 232700≡630。

- id: HARD-P2-L4-04
  version: "1.0"
  split: dev
  paradigm: P2
  thread: B-符号约束
  schema_id: coefficient-filtered-arborescence-count-01
  schema_name: 用形式变量将全局基数约束编译为生成树系数提取
  level: 4
  source:
    domain: 受谱线配额约束的菌落迁徙
    problem: >-
      菌落 U、V、W 各选一个后继，所有路径必须最终到避难所 R。通道的并行形态数与谱类为：
      U→V:2,蓝；U→R:1,灰；V→W:3,灰；V→R:2,蓝；W→U:1,蓝；W→R:4,灰。
      按已选边的形态数乘积计数，求恰好使用一条蓝色通道的有效方案数。
    solution: >-
      先把每条蓝边的权改为 wx，灰边仍为 w。指向 R 的带权树总权就变成生成函数，
      x 的次数精确记录蓝边数。删去 R 的出边拉普拉斯余子式为
      det([[1+2x,-2x,0],[0,3+2x,-3],[-x,0,4+x]])
      =12+35x+18x^2+4x^3。因此恰好一条蓝边的系数是 35。
    answer: "35"
  target:
    domain: 带潜在谱类的抽象后继场
    problem: >-
      有七个代号 A—G。除 G 外，每个代号必须选且只选一个从自身指向其他代号的
      后继对；从任一非 G 代号反复跟随被选指向，必须有限步后到达 G。
      每个可用指向还有变体数 w 与谱类 V 或 P：

      A→C:5,V，A→D:2,P，A→B:4,V；
      B→C:5,P，B→D:5,V，B→E:5,P；
      C→G:1,V，C→F:3,P，C→A:2,V；
      D→E:3,P，D→G:2,V，D→F:4,V；
      E→D:2,V，E→B:2,P，E→G:4,P；
      F→G:4,P，F→A:4,V，F→E:2,V。

      一个后继结构的认证数为六条已选指向的 w 之积。只计入恰好选了三条 V 类指向
      的有效结构；选了 0、1、2、4、5 或 6 条 V 类指向的结构全部排除。
      求符合条件的认证总数，只输出其对 1009 取余的结果。
    answer:
      parts: [{type: number, value: "17"}]
  mapping:
    objects: {菌落: 抽象代号, 避难所 R: 收敛点 G, 蓝色通道: V 类指向, 通道形态数: 指向变体数}
    shared_relations:
      - 局部唯一后继与全局汇入根等价于指向根的有向树
      - 边权乘积使树的权总和可由拉普拉斯余子式计算
      - 给特殊类型边权附加形式变量可记录每棵树使用该类型的次数
      - 生成多项式中 x^k 的系数恰好筛选使用 k 条特殊边的树
    added_relations: [特殊边基数从恰好一条改为恰好三条, 生成多项式次数从三次扩到六次]
    adaptation_required: [在构造拉普拉斯矩阵前将 V 边权替换为 wx, 计算多项式行列式后只提取三次项而非令 x=1]
    varied: [三个非根节点的一阶系数改为六个非根节点的三阶系数]
  lure:
    problem: >-
      使用相同的 A—G、有向边和变体数，但不限制所选边的谱类：任意 V 边数都可以。
      仍要求每个非 G 点选一条出边且全部最终汇入 G，按边的 w 乘积计数。
      求全部认证数对 1009 的余数。
    solution: >-
      没有谱类基数筛选时，等价于在谱类生成多项式中令 x=1，即求所有次数系数之和。
      普通带权有向树余子式为 326980，对 1009 取余得 64。
    answer:
      parts: [{type: number, value: "64"}]
    why_surface_similar: 节点、根、指向、变体数、收敛规则和取模均与目标相同。
    why_structurally_different: lure 对 V 边数不作筛选，求全部系数之和；目标只求三次系数。
    wrong_schema_id: unfiltered-weighted-arborescence-count-01
  copy_probe:
    answer:
      parts: [{type: number, value: "64"}]
    derivation: 识别了普通有向树计数，却忽略“恰好三条 V 边”，直接令谱类生成函数 x=1 求了全部树的权和。
  hints:
    schema_name: 用形式变量将全局基数约束编译为生成树系数提取
    oracle_mindset:
      insight: 先将 V 类边的权写成 wx，用指向根的出边拉普拉斯余子式得到生成多项式；只取 x^3 系数。
      when_to_use: 树、路径或组合结构按局部权乘积计数，同时要求恰好使用 k 个某类局部元件时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p2_l4_04
    method: exhaustive-successor-enumeration-and-polynomial-determinant
  provenance: original; AR-style transfer from spectrum-constrained migration trees to coefficient-filtered anonymous successor fields
  verified: 枚举 3^6 个后继结构并按 V 边数分层，与六阶形式拉普拉斯行列式逐系数一致；x^3 系数 107980≡17 (mod 1009)。

- id: HARD-P2-L4-05
  version: "1.3"
  split: dev
  paradigm: P2
  thread: B-符号约束
  schema_id: analogical-polynomial-sensitivity-update-01
  schema_name: 识别重命名组合系统并迁移局部参数灵敏度
  level: 4
  source:
    domain: 八菌落谱类迁徙基准
    problem: >-
      菌落 U1—U8 各选一条出通道，反复跟随所选通道必须最终到避难所 R。
      通道记为“去向:形态数,谱类”：
      U1→U2:2,蓝，U1→U4:5,灰，U1→R:3,灰；
      U2→U3:4,灰，U2→U5:2,蓝，U2→R:6,灰；
      U3→U4:3,蓝，U3→U6:4,灰，U3→R:2,蓝；
      U4→U5:5,灰，U4→U7:3,蓝，U4→R:4,灰；
      U5→U6:2,蓝，U5→U8:6,灰，U5→R:5,蓝；
      U6→U7:7,灰，U6→U1:2,蓝，U6→R:3,灰；
      U7→U8:4,蓝，U7→U2:5,灰，U7→R:2,灰；
      U8→U1:3,灰，U8→U3:7,蓝，U8→R:4,蓝。
      按已选边形态数乘积计数。求恰好四条蓝边的总数对 1000 的余数；
      并在推理中保留完整谱类生成多项式 P(x)，以及灰边 U3→U6 每增加一个形态时
      对 P(x) 的单位增量 Q(x)。
    solution: >-
      给蓝边权乘 x，用指向 R 的出边拉普拉斯余子式。按 x^0 到 x^8 列出系数，
      P=[1895040,20986920,57806304,78520864,56237600,22042736,4732816,493176,16320]。
      对边 U3→U6 的权做线性展开，每增加一个灰色形态的单位增量为
      Q=[473760,4506480,8599776,7211176,3180720,735296,89304,5280,0]。
      恰好四条蓝边的基准数为 P_4=56237600，对 1000 取余得 600。
      后续若遇到重命名系统，先用每行的三个去向、权重与谱类作全局签名对齐八个角色；
      若只有一条边的权重从 w 改为 w+Δ，直接用 P+ΔQ 更新，不要重算整个行列式。
    answer: "600"
  target:
    domain: 重命名后继场的局部重标定
    problem: >-
      代号 A—H 各选一条出指向，反复跟随所选指向必须最终到吸收点 Z。
      指向记为“去向:变体数,谱类”：
      F→B:2,V，F→D:5,P，F→Z:3,P；
      B→H:4,P，B→A:2,V，B→Z:6,P；
      H→D:3,V，H→G:9,P，H→Z:2,V；
      D→A:5,P，D→C:3,V，D→Z:4,P；
      A→G:2,V，A→E:6,P，A→Z:5,V；
      G→C:7,P，G→F:2,V，G→Z:3,P；
      C→E:4,V，C→B:5,P，C→Z:2,P；
      E→F:3,P，E→H:7,V，E→Z:4,V。
      按八条已选边的变体数乘积计数，只计恰好选了四条 V 类边的有效结构。
      求认证总数对 1000 的余数。
    answer:
      parts: [{type: number, value: "200"}]
  mapping:
    objects: {U1: F, U2: B, U3: H, U4: D, U5: A, U6: G, U7: C, U8: E, 避难所 R: 吸收点 Z, 蓝色: V 类, 灰色: P 类}
    shared_relations:
      - 八个非根节点的三选一出边结构在重命名下保持
      - 所有后继必须汇入根的全局约束保持
      - 特殊谱类边数由生成多项式的次数记录
      - 固定有向边的树总权对该边权是线性的
    added_relations: [对应 U3→U6 的边 H→G 形态数从 4 增加为 9]
    adaptation_required: [先从全局出边签名恢复节点重命名, 识别唯一参数变化并用 P_4+5Q_4 局部更新]
    varied: [生态菌落标识改为无语义后继场代号，且一条灰色边的局部权重发生改变]
  lure:
    problem: >-
      使用与目标完全相同的 A—H、Z、全部有向边、谱类和变体数，
      但另一种协议忽略“变体数”：每条被选边无论原有几个变体都只计一种。
      仍要求 A—H 各选一条出边、所有指向链最终到 Z，并且恰好四条为 V 类。
      求这种无权结构的数量对 1000 的余数。
    solution: >-
      将所有边权置为 1，仍用谱变量标记 V 边，对指向 Z 的无权树谱取四次系数。
      系数为 1545，对 1000 取余得 545。
    answer:
      parts: [{type: number, value: "545"}]
    why_surface_similar: 节点、全部边、谱类、收敛条件和四次系数查询完全相同。
    why_structurally_different: lure 将每条边的变体数折叠为 1，计数无权结构；目标按八条边的原变体数乘积加权。
    wrong_schema_id: unweighted-arborescence-spectrum-01
  copy_probe:
    answer:
      parts: [{type: number, value: "545"}]
    derivation: 保留树结构和 V 边基数，却误将每条边的变体数都当成 1。
  hints:
    schema_name: 识别重命名组合系统并迁移局部参数灵敏度
    oracle_mindset:
      insight: 先用带权、谱类和去向的全局签名对齐节点；确认只有一条 P 边从 4 变 9 后，用该边的单位灵敏度 Q 更新 P。
      when_to_use: 已有一个大型组合系统的完整计数与局部灵敏度，新问题是其重命名并只改动一个局部参数时。
  verification:
    entrypoint: mindsetbench.verification.hard_seeds:verify_hard_p2_l4_05
    method: exhaustive-and-polynomial-local-sensitivity-update
  provenance: original; AR-style transfer from calibrated microbial migration spectra to a renamed abstract successor field with one local perturbation
  verified: 基准与重标定系统各用 3^8 枚举与八阶多项式行列式双重验证，并逐系数确认 new=base+5Q；v1.1 改为模 1000；v1.3 将 lure 改为忽略变体乘积的无权树谱。
