- schema_id: stateful-planning-optimality-certificate-edit-v1
  paradigm: P5
  thread: J-操作证书
  name: 有状态操作规划的最优层与次优层证书迁移
  definition: 在带正负前置、置位、清除、正负终态与成本的有状态操作系统中，枚举首次到达目标的完整有序路径；同时报告唯一最优路径、更低成本零命中、最优层多重性、首个次优成本及其多重性，并在重命名与单效果编辑后更新整份证书。
  required_relations:
    - 操作只有在全部正前置成立且全部否定前置不成立时才可执行
    - 清除与置位效果共同决定后续状态，每项操作至多使用一次
    - 路径首次满足全部正目标且不含任何负目标时立即终止
    - 等成本但顺序不同的目标路径必须分别保留并计数
    - 最优性由更低成本零命中与最优层唯一命中共同证明
    - 继续枚举到首个更高目标成本层，报告 runner-up 成本和多重性
    - 单效果编辑后必须重放旧最优路径并重新计算最优层与次优层
  invalid_variants:
    - 只找到一条可达路径便停止，未证明更低成本层为空
    - 按状态或状态与已用集合去重，丢失等成本不同有序路径的多重性
    - 忽略前置、清除或负目标，把问题降为独立加法集合覆盖
    - 把 source 的成本和路径计数直接换名复制到 target
    - 关系编辑后继续沿用编辑前最优路径及 runner-up 统计
  level_plan:
    L0: 三操作两步依赖链，最优与次优层各一条
    L1: 四操作中推进会清除终态资源，恢复链成本 4，直达 runner-up 成本 5
    L2: 九操作同时包含正负前置与正负终态，最优和次优相差 2
    L3: 十状态十六操作完整双层重命名，最优唯一且次优层含三条路径
    L4: 不标出位置地编辑一个恢复效果，旧 15/16 证书失效，新证书切换到 17/18 且次优仍为三条
  copy_probe: L0–L3 使用忽略前置、清除与负目标的独立加法覆盖证书；L4 使用编辑前完整 stale certificate。
  lure: 低级题保留相同操作和成本但删除有状态关系，高级编辑题保留旧 K3 效果及旧最优/次优层，形成可重放的确定性负迁移控制。
  verifier: 对状态、已用操作集合和完整路径做一致代价枚举，处理到首个次优目标层；独立枚举错误集合覆盖，验证 L3 完整同构、L4 唯一效果差分和旧路径失效。
