- schema_id: far-horizon-exploration-v1
  paradigm: P1
  thread: D-元认知控制
  name: 试探的价值由其后剩余的可利用时间决定
  definition: 面对一个已知的稳妥选项和一个需要付出代价才能了解的不确定选项，试探在当期是亏的，其价值全部来自之后还能用上这个信息的时间；因此是否试探由剩余期数或截止前是否来得及补救决定，而不由不确定选项的知情期望决定。剩余时间不同的决策者在同一环境下应做相反选择。
  required_relations:
    - 试探当期的期望低于稳妥选项
    - 知情后的每期期望或成功分支的价值高于稳妥选项
    - 试探的价值等于之后可利用期数乘以每期增益，或等于失败后仍来得及补救的价值
    - 剩余期数低于阈值时不应试探，高于阈值时应试探
    - 试探时长、回退代价和补救时长会改变阈值
  invalid_variants:
    - 因为不确定选项的平均或知情期望更高就总是先试
    - 因为试探当期亏损就永不试探
    - 照搬另一情境中的期数阈值而不重算试探代价与回退代价
    - 忽略失败分支的补救是否在截止前来得及完成
  level_plan:
    L0: 同域同型，换数值与两个具体剩余天数，阈值从 2 升到 3
    L1: 同域变型，休渔前的渔场选择，把握以成数表达
    L2: 跨到工程管理，剩余周数从邮件中的日期推算，两处工地做相反选择
    L3: 跨到临床决策，试探需两周且换回有一周洗脱，阈值升到 4 周
    L4: 跨到学术生涯规划，一次性结果加固定截止，价值来自被拒后是否来得及改投
  copy_probe: L0–L2 记录“知情期望更高就先试”的固定答案；L3 记录照搬一期试探、免费换回得到的 2 周阈值；L4 记录“只要来得及等结果就先投 A”的 3 个月阈值。
  lure: 保留目标领域与数值，但让不确定选项的不利情形不低于稳妥选项、让试探只需一期且免费换回、或允许并行投稿，使固定答案在 lure 中恰好正确。
  verifier: 对逐期模型按有限期数比较试探总期望与稳妥总期望并搜索最小期数；对 L4 按截止前能否完成改投比较期望；同时核对 lure 世界确实使 copy probe 成立，且题面含所需事实并不出现图式标签词。
