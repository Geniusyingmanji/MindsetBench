- schema_id: far-negative-evidence-v1
  paradigm: P2
  thread: F-逆问题
  name: 未出现的预期信号与出现的信号同样切割候选集
  definition: 隐藏原因不可直接观测时，每个观测点都在收窄候选：出现的信号要求候选能够到达该点，没有出现的信号要求候选不能到达该点；只有当该次观测本可检出信号时，未出现才构成约束。答案是同时满足全部到达与不到达约束的唯一候选。
  required_relations:
    - 候选必须到达全部出现信号的观测点
    - 候选不得到达任何本可检出却未出现信号的观测点
    - 无法检出的观测点（未抽检、未运行、故障、消息未达、体例之外）不提供约束
    - 出现的信号通常只框出候选集，真正完成区分的是未出现的信号
    - 候选可以是离散来源、年份区间或图上路径，约束形式随之改变
  invalid_variants:
    - 只用出现的信号，按覆盖或牵涉数量给候选排序
    - 把所有未出现一律当作排除，不检查该次观测是否本可检出
    - 用最短、最常见或最显著的候选代替唯一相容的候选
    - 把设备失效、未运行或消息未达当作有效的否定观测
  level_plan:
    L0: 同域同型，换一张配方表与抽检结果，阳性留两候选、阴性定一
    L1: 同域变型，病区排班与患者转科中的传染源定位
    L2: 跨到软件测试，从覆盖报告用失败测试取交集、用通过测试排除
    L3: 跨到历史文献学，用记载与未记载推断成书区间，并须判定沉默是否有效
    L4: 跨到野生动物监测，候选变为图上路径，用带时间的拍摄记录与正常工作却无记录的相机点筛出唯一路线
  copy_probe: L0–L2 记录“只看阳性/失败并选牵涉最多者”的候选；L3 记录“所有沉默一律作上界”的区间；L4 记录“经过全部拍摄点的最短路径”。
  lure: 保留目标领域与材料，但把观测改成只靠阳性即可定位、作者自述无所不记、或无记录来自设备失效，使照搬捷径在 lure 中恰好正确。
  verifier: 对 L0–L2 用到达关系枚举候选并做正负约束过滤；L3 用事件年份取下界与有效上界；L4 枚举 A 到 F 的全部简单路径并按记录时间、最短用时与静默相机筛选；同时检查题面含所需事实且不出现图式标签词。
