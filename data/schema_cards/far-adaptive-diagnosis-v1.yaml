- schema_id: far-adaptive-diagnosis-v1
  paradigm: P5
  thread: D-元认知控制
  name: 首次查询应为每种回复保留可执行的后续区分路径
  definition: 当隐藏类型必须在有限次数内唯一判定，且后续检查受时间、地点或程序限制时，首次动作不能只按当下识别力排序。应对它的每种可能回复分别检查：剩下的候选能否在剩余预算内由届时仍可用的动作唯一分开。优化对象是整棵可执行策略，而非单项最强检查。
  required_relations:
    - 多种隐藏类型可给出同一次观测回复
    - 第一步产生多个分支，第二步可随分支而变
    - 后续动作的可用性受时间、地点、预算或程序限制
    - 成功策略使每个候选产生唯一的完整回复路径
    - 单次最像定案或最容易成交的动作可能使剩余候选无法再分
  invalid_variants:
    - 只比较首次检查当下区分多少类型
    - 预先固定第二步，不随首次回复调整
    - 忽略档案城市、闭馆时间或提案程序造成的后续不可达
    - 把谈判中的类型识别目标换成当期成交率目标
  level_plan:
    L0: 同域设备故障，先粗分再按分支复核
    L1: 医疗检查中按首次快检结果选择后续检查
    L2: 对样本损耗与检查排期加入资源限制
    L3: 匿名文本归属，纸张快检决定隔夜去哪座城市查档
    L4: 联盟政治中以对手对提案的策略回应识别隐藏目标，且程序随前一回复改变可用提案
  copy_probe: 档案题记录直接做风格鉴定；谈判题记录先提最容易被多类型接受的大包。
  lure: 让单项鉴定真能一步定案，或把目标改成当期成交率并允许大包先提，使预注册捷径成为正确答案。
  verifier: 对每个隐藏类型生成完整回复签名，检查策略是否在可达后续动作下生成互不相同的签名。
