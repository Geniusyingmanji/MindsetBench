- schema_id: far-social-learning-cascade-v1
  paradigm: P7
  thread: E-证据独立性
  name: 顺序公开的行动在足以压过私人信号后不再提供新证据
  definition: 公开行动同时受私人信号与前序行动影响。当参与者在所有可能私人信号下都会采取同一行动时，该行动不再暴露他的私人信号，其似然比为一。参与者能力、决策门槛或对早期信号的聚合披露规则变化后，必须重新推导“私人信号到公开行动”的映射。
  required_relations:
    - 后来者看到前序公开行动但看不到原始私人信号
    - 公开行动是私人信号与已知历史的内生函数
    - 两种私人信号导致同一行动时该行动不更新后验
    - 行动门槛与信号准确率会改变一项行动是否含信息
    - 对多份原始信号的聚合摘要应按整个聚合事件而非单个信号更新
  invalid_variants:
    - 把所有一致公开行动当成相互独立的原始信号
    - 看到前序同向行动后永久忽略后续人能力或制度门槛的变化
    - 将“至少一份支持”的摘要当成“全部支持”
  level_plan:
    L0: 同质信号与二元顺序动作
    L1: 同域参数变化下的级联起点
    L2: 顺序审稿或陪审的公开表态
    L3: 异质专家与不同行动门槛
    L4: 历史证据经非对称摘要压缩后再进入后续专家行动
  copy_probe: 将每个公开支持都当成一份独立私人支持，或机械沿用普通过半门槛下的级联判断。
  lure: 使投票同时互不可见，将高门槛改为普通过半门槛，或将“至少一份”摘要改为“两份都支持”。
  verifier: 逐步枚举当前人的私人信号，按其准确率、可见历史与制度门槛生成公开行动似然；对聚合摘要直接计算其原始信号集合事件的似然。
