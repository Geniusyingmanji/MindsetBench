- schema_id: joint-typed-alignment-edit-sensitivity-v1
  paradigm: P6
  thread: K-角色映射
  name: 锚定带类型关系图的联合对齐与单边编辑敏感性迁移
  definition: 在锚点约束下联合搜索节点一一映射与匿名关系码双射，以保留的带类型有向三元组数评分；跨域重命名时迁移最优性边际证书，并在单次关系替换后更新最优对齐。
  required_relations:
    - 节点映射与关系码映射必须联合选择而非先后贪心固定
    - 锚点约束整体方向，乙侧额外记录只作为噪声而无需反向解释
    - 最优解须由全局带类型有向记录得分和唯一性确定
    - 一删一增可通过 baseline 与 runner-up 的独占支持边改变最优性
  invalid_variants:
    - 按节点或关系码在文件中的首次出现顺序对齐
    - 忽略关系类型，只比较无标号入度和出度
    - 找到局部签名相近节点后停止，未验证全局得分和唯一性
    - 图被编辑后仍复制旧最优映射，未利用最优边际和独占支持证书
  level_plan:
    L0: 三节点链，锚点下联合恢复一个节点与两个关系码
    L1: 四节点菱形加噪声，关系词典与两个自由节点相互约束
    L2: 五节点三关系，枚举节点排列和关系词典的直积空间
    L3: 对七节点联合对齐问题本身作左右节点与双侧关系码的元级重命名
    L4: 元级重命名后替换一条支持关系，使唯一 runner-up 成为新唯一最优解
  copy_probe: 各级均记录按两侧关系记录首次出现顺序固定词典后再优化节点所得的确定性结果。
  lure: 节点、关系、锚点和评分保持不变，只用归档首次出现顺序外生固定关系词典；高级 L4 中它甚至得到正确节点序列但关系词典错误。
  verifier: 穷举自由节点排列与关系码排列，检查最高分、唯一性和 runner-up；高级题另验证整个实例的元级同构以及单边删除/加入对两候选得分的交换。
