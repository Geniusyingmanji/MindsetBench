- schema_id: far-selection-association-v1
  paradigm: P3
  thread: H-因果拓扑
  name: 按任一特征筛选出的子集会呈现全体中不存在的关联
  definition: 当我们只能看到按两个特征之一（或两者的组合、比值超过阈值）筛选进来的单位时，子集中两特征之间会出现全体中不存在、甚至方向相反的关联；该关联既不是全体的规律，也不能推断改变一个特征会如何影响另一个。先问“这些单位是怎么被选进来的”，再用全体的人数表重算方向。
  required_relations:
    - 观察到的单位是按依赖两个特征的规则选入的
    - 筛选去掉了两特征皆无（或组合达不到门槛）的单位
    - 子集中的关联方向由筛选规则的形状决定，与全体无关
    - 全体中的关系必须用全体的人数表计算，可以为无关或正相关
    - 子集关联不能作为因果或政策建议的依据
  invalid_variants:
    - 把子集中的比例差当成全体的规律
    - 把子集中的关联解释为一个特征影响另一个特征
    - 认为子集关联是假象因此全体中一定无关
    - 忽略收录门槛把目录当成天区或人群本身
  level_plan:
    L0: 同域同型，另一个镇的两种病与住院规则
    L1: 同域变型，体检复查名单中的两项指标
    L2: 跨到人力资源，面试者中笔试与作品集的负相关及其政策建议
    L3: 跨到在线教育运营，全体学员本为正相关，评论中被翻成负相关
    L4: 跨到天文学，视亮度门槛使星表中距离与真实亮度呈正相关
  copy_probe: L0–L2 与 L4 记录“子集关联即全体关联且可推因果”的答案；L3 记录“子集关联是假象故全体无关”的答案。
  lure: 用随机分配试验使全体确有负相关且可推因果、用全体无关的另一门课、或用完整巡天且远处确实更亮的天区，使照搬答案在 lure 中恰好正确。
  verifier: 对二元特征用 2 乘 2 人数表比较条件比例的方向并按筛选规则重算子集；对多档特征按阈值枚举被收录的组合并比较协方差的符号。
