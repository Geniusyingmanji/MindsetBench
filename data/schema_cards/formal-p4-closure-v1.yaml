- schema_id: least-fixed-point-norm-sensitivity-v1
  paradigm: P4
  thread: I-规范规则
  name: 派生事实最小不动点、规范优先级与单规则失效迁移
  definition: 先以单调前向链求每条记录的最小事实闭包，再按一般义务、完整例外和不可覆盖禁止求值；跨域重命名时按事实剖面迁移闭包证书，并传播单条派生规则失效的影响。
  required_relations:
    - 新派生事实可继续触发规则，直至事实集合达到最小不动点
    - 规范求值在闭包完成后执行，不能只看初始事实
    - 完整例外只覆盖指定的一般义务，最高禁止不可被覆盖
    - 单规则失效只影响依赖该规则且没有旁路证明的闭包与记录
  invalid_variants:
    - 所有规则只同时检查一次初始事实
    - 按规则书写顺序执行一遍而不回访较早规则
    - 重命名后按记录编号或位置复制答案，未按初始事实剖面对齐
    - 删除规则后重算所有表面相似记录，未检查 silver 或其他证明旁路
  level_plan:
    L0: 两记录两级派生链，区分一轮推导和最小不动点
    L1: 四记录三层派生与中层旁路，检查汇合后的授权
    L2: 七记录完整闭包、例外和最高禁止边界
    L3: 十二记录谓词重命名与顺序置换，迁移闭包违规证书并计算权重和
    L4: 重命名系统停用一条中间派生规则，迁移规则消融的局部影响证书
  copy_probe: 各级均记录“所有派生规则只同时读取初始事实”时的确定性违规集合或权重校验和。
  lure: 保留事实、规则和规范文本，只把递归最小不动点改为初始事实的一轮语义；它在自身规则世界中正确，但破坏长程派生与单规则失效传播。
  verifier: 通用单调 Horn 闭包引擎与独立初始事实单轮求值器比对；高级题另检查事实剖面同构、违规权重和及指定规则消融的集合差分。
