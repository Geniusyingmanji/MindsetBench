- schema_id: exact-one-csp-01
  paradigm: P2
  thread: B-符号约束
  name: 精确约束下的唯一一致赋值
  definition: 将候选赋值视为可能世界，传播全异、顺序、邻接或真值约束，排除不一致世界并返回唯一剩余解。
  required_relations:
    - 候选必须满足全部硬约束，而不是满足最多约束
    - 每个对象或命题只能占据一个互斥状态
    - 答案由一致性排除而非表面语义决定
  invalid_variants:
    - 约束不足导致多个解
    - 依赖常识补全未写出的规则
    - 仅按约束数量打分而不要求全部满足
  level_plan:
    L0: 同一运维排程中只换任务符号
    L1: 同属计算系统但更换为网络变更流程
    L2: 跨到实验工序，约束图完全同构
    L3: 加入一个对象和新约束，需从固定排列改为扩展 CSP
    L4: 改成陈述真值世界枚举，只保留一致性排除图式
  copy_probe: L3 记录先解四对象再把新增对象附到末尾的答案；L4 记录把精确约束误作最大满足的答案。
  lure: 保留目标领域与对象，翻转一条邻接关系或精确真值数量。
  verifier: 全排列或有限可能世界穷举。

- schema_id: noncausal-path-control-01
  paradigm: P3
  thread: H-因果拓扑
  name: 先识别非因果路径，再决定阻断或保留
  definition: 依据有向因果拓扑区分目标因果路径与非因果关联路径，只阻断后门路径，并避免控制中介或对撞点。
  required_relations:
    - 共同原因会打开后门关联
    - 总效应估计不能控制处理变量的后代中介
    - 对撞点或选择事件可在条件化后制造关联
  invalid_variants:
    - 把所有预测结局的变量都当作控制变量
    - 仅凭观测相关方向断言因果方向
    - 题面没有给出足以唯一判断的因果图
  level_plan:
    L0: 同一临床混杂图换变量名
    L1: 医疗域内换成检测采用问题
    L2: 跨到劳动力经济学，DAG 完全同构
    L3: 新增处理中介，最小调整集不变但全控制策略失效
    L4: 改成选择对撞导致的关联，只共享拓扑优先于相关性的图式
  copy_probe: L3 记录同时控制混杂与中介的答案；L4 记录把选择样本内相关直接解释为因果的答案。
  lure: 使用同一领域和变量，但把混杂改为中介，或把观察性选择改为随机干预。
  verifier: 后门图的祖先道德化检验与有限概率枚举。

- schema_id: defeasible-obligation-01
  paradigm: P4
  thread: I-规范规则
  name: 规则触发、例外覆盖与优先级合规判定
  definition: 先判断规范前件是否触发，再检查义务是否满足；存在例外或高优先级禁止时，按明确优先关系覆盖一般规则。
  required_relations:
    - 未触发前件不构成该规则的违规
    - 触发且义务未满足才构成基础违规
    - 明示例外取消一般义务，高优先级禁止可再次覆盖许可
  invalid_variants:
    - 倒置充分条件与必要条件
    - 用现实法律常识补充虚构规则
    - 规则优先级未明示却要求读者猜测
  level_plan:
    L0: 同一空间站门禁规则换设施与记录
    L1: 空间站域内换成密钥审计义务
    L2: 跨到博物馆操作规范，条件结构同构
    L3: 加入一个明示例外，简单实质蕴含会多报违规
    L4: 一般义务、许可例外和最高优先禁止形成三层规则链
  copy_probe: L3/L4 均记录忽略例外或优先级、机械执行一般规则所得的违规集合。
  lure: 保持相同记录，改用反向条件或移除例外，使错误集合在 lure 中成为正确答案。
  verifier: 封闭世界布尔规则引擎逐记录求值。

- schema_id: anchored-role-mapping-01
  paradigm: P6
  thread: K-角色映射
  name: 锚定后按关系职责而非位置映射角色
  definition: 先用已知锚点固定两个关系系统的方向，再选择保持输入、输出和门控职责最多的对应；允许插入节点或集体角色。
  required_relations:
    - 对应由角色参与的关系决定而非名称相似
    - 锚点固定映射方向并减少对称解
    - 高阶职责关系优先于线性位置
  invalid_variants:
    - 多个候选具有完全相同关系签名
    - 只靠职业词汇就能作答
    - 未提供锚点且图具有自同构
  level_plan:
    L0: 同一数字内容工作流的四节点链
    L1: 媒体域内换成播出审批链
    L2: 跨到细胞运输链，关系图完全同构
    L3: 目标链插入预处理节点，需按批准职责而非序位映射
    L4: 单个检验员映射为两成员法定人数，模型从一对一变为一对集合
  copy_probe: L3 记录按序位选择插入节点；L4 记录选择单个跟随者而非法定人数集合。
  lure: 保留目标词汇但把批准权真正赋给 copy-probe 候选。
  verifier: 关系签名匹配；L4 枚举最小充分批准集合。
