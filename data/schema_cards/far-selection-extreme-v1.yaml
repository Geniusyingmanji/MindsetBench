- schema_id: far-selection-extreme-v1
  paradigm: P1
  thread: E-信噪判别
  name: 许多相似单位中的极值本身不是证据
  definition: 从许多相似的、各自带随机波动的单位中挑出最差或最好的那个，它的数值必然偏离常态；判断它是否异常要算“全部单位都正常时至少一个达到该值”的概率，预测它的未来要把观测值向共同基准回缩。单位数、各单位规模与基准分布决定折算结果。
  required_relations:
    - 榜首或最高分是从多个单位中挑出的极值，而不是事先指定的单位
    - 判断门槛按“全部正常时至少一个单位达到该值”的概率设定
    - 单位规模不同则同一比例对应不同概率，须按各自规模分别计算再合并
    - 被挑出的观测值高估该单位的真实水平，预测须按基准分布加权回缩
    - 单位越多，极值越偏离常态
  invalid_variants:
    - 把榜首当作事先指定的单位，只算单个单位的罕见概率
    - 单位规模不等时仍按榜首的规模统一折算
    - 把最高分直接当作真实水平预测未来表现
    - 用“看起来很罕见”代替按单位数折算的概率
  level_plan:
    L0: 同域同型，30 家门店的差评榜首，判是否整改与门槛
    L1: 同域变型，40 名坐席的投诉榜首
    L2: 跨到教育评估，教育局通报中 32 校的未达标榜首
    L3: 跨到规模不等的学校，按比例排名的榜首是小校，须按各校规模分别折算
    L4: 跨到人才评估，15 人中最高分者入职后的期望成绩须向基准回缩
  copy_probe: L0–L2 记录单单位尾概率的决策与门槛；L3 记录全按榜首规模折算的决策与门槛；L4 记录“分数即水平”的预测值。
  lure: 让榜首变成事先指定的单位、让各校规模相同、或让测量无噪声，使单单位判断或直接取值在 lure 中恰好正确。
  verifier: 精确二项分布计算单单位尾概率与“至少一个达到”的合并概率并搜索最小门槛；异质规模按各校人数取整后分别计算；L4 按五种真实水平的似然加权求期望答对题数。
