- schema_id: coefficient-filtered-arborescence-sensitivity-v1
  paradigm: P2
  thread: B-符号约束
  name: 带类型基数约束的后继收敛计数与局部灵敏度迁移
  definition: 将每个非根节点恰选一条出边且全部最终汇入根的结构视为带权有向生成树；用形式变量记录特殊边数，并在重命名系统中迁移单边灵敏度。
  required_relations:
    - 每个非根节点恰选一条出边且无非根环
    - 每个结构的贡献是已选边权重的乘积
    - 特殊边数由生成多项式次数编码
    - 单边权重扰动使总权多项式按该边灵敏度线性更新
  invalid_variants:
    - 只乘各节点的局部选择多项式而未排除内部环
    - 令形式变量等于一而忽略恰好 k 条特殊边的筛选
    - 发现重命名同构后直接复制 source 结果，未检查局部权重变化
  level_plan:
    L0: 两个非根节点，直接枚举并排除一个环
    L1: 四节点单环，从局部多项式系数扣除环贡献
    L2: 跨域六节点三出边系统，需使用多项式矩阵树定理
    L3: 八节点跨域完全重命名同构，先恢复全局角色对应
    L4: 八节点重命名后再扰动一条边权，必须识别 broken relation 并迁移灵敏度
  copy_probe: L0—L2 记录忽略全局收敛的局部乘积系数；L3—L4 记录将所有边变体数错折叠为 1 的无权树谱系数。
  lure: 低级保留边表但允许内部环；高级保留图、谱类和收敛条件，但忽略变体乘积，使无权树谱在 lure 中正确。
  verifier: 有限后继函数穷举与多项式拉普拉斯余子式逐系数比对；L4 另检查单边线性灵敏度。
