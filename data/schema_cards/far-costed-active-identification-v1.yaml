- schema_id: far-costed-active-identification-v1
  paradigm: P4
  thread: D-元认知控制
  name: 主动查询须按完整分支的可辨识性与代价选择，而非只看第一步平衡度
  definition: >-
    查询结果把潜在机制集合划分为分支。首步是否好，取决于每个分支能否在剩余预算内继续区分，
    以及整棵自适应策略树的路径代价；首步候选数最均衡并不自动使完整策略最优。
  required_relations:
    - 查询结果把潜在机制集合划分为若干分支
    - 后续查询可以依首轮回复改变
    - 每个非单例分支都必须在剩余预算内可被区分
    - 目标比较完整策略树的最坏路径代价
  invalid_variants:
    - 只最大化首步划分的平衡度
    - 忽略某个首步分支无法由剩余查询区分
    - 对已经唯一识别的分支继续付费查询
  level_plan:
    L0: 显式二值响应表与等成本查询
    L1: 显式多值响应表与不等成本查询
    L2: 目标域给出可直接整理的响应记录
    L3: 响应矩阵要从目标域规则与事实组合恢复
    L4: 源域给显式矩阵，目标域从另一文体的潜在制度机制恢复反事实响应，再优化自适应策略树
  copy_probe: 选择首轮候选数划分最均衡、但完整树最坏代价更高的查询。
  lure: 将首步平衡度设为硬约束，使表面最均衡的查询成为答案。
  verifier: 从规则函数和事实对象生成响应矩阵，穷举首查询及每个分支的最低成本区分查询。
