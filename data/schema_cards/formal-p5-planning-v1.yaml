- schema_id: stateful-operation-planning-edit-v1
  paradigm: P5
  thread: J-操作规划
  name: 带前置条件与清除副作用的操作组合及单效果编辑适配
  definition: 在布尔状态上组合带正负前置、置位、清除和成本的操作，寻找满足正负终态的最低成本可执行序列；跨域重编号时迁移完整转换结构，并在一个操作效果改变后判断旧计划失效原因及最优旁路。
  required_relations:
    - 操作只有在全部正前置成立且全部否定前置不成立时才可执行
    - 清除与置位效果改变后续操作的可执行性，不能把操作当作独立目标覆盖
    - 正目标与负目标必须在最终状态同时满足，且成本按实际执行序列累计
    - 状态名和操作编号可同时置换，结构同构由前置、效果和成本联合确定
    - 单个效果编辑后必须重放旧计划并重新比较替代路径
  invalid_variants:
    - 忽略前置条件，直接选择能置位正目标的最低成本操作集合
    - 忽略清除效果，假设初态资源在整个计划中永久保留
    - 只检查正目标而不检查终态不得含集合
    - 发现一条可执行计划后停止，没有证明其成本全局最优
    - 局部操作发生变化后仍机械复制旧序列
  level_plan:
    L0: 三操作两步依赖链，对照一个不可直接执行的廉价置位操作
    L1: 推进操作清除终态资源，必须追加恢复操作
    L2: 九操作系统同时包含正负前置、正负终态和成本不同的修复分支
    L3: 十状态十六操作改写为操作卡叙述并完整双层重编号，唯一最优与三条一分 runner-up 同时保持
    L4: 不标出编辑位置地替换一个恢复操作的登记效果，旧链失效并在多条近优分支中切换到保留初态资源的旁路
  copy_probe: 每级都用“忽略前置、清除和负目标的独立加法集合覆盖”求唯一最低成本错误答案。
  lure: 保留初态、正目标、全部操作与成本，只删除状态转换关系；高级题中单效果编辑不会改变 lure，从而稳定测量负迁移。
  verifier: 对状态与已用操作集合做一致代价穷举，检查最优成本、序列唯一性、终态和一分 runner-up；另独立枚举单调集合覆盖，并验证 L3 完整同构及 L4 唯一效果差分。
