- schema_id: latent-affine-codebook-planning-v1
  paradigm: P5
  thread: J-潜在操作
  name: 从局部观测联合恢复匿名仿射操作并在关系编辑后重规划
  definition: 从有歧义的输入输出观测与代码互异约束中恢复匿名仿射操作码本，再在状态与已用卡的乘积空间中求最低成本复合序列；跨域时识别向量异或与集合对称差的同构，并在一个隐藏操作变化后放弃机械复制旧计划。
  required_relations:
    - 每条观测只产生兼容候选集合，全部匿名代码共同满足一一对应或注入约束
    - 操作复合有方向，输出序列中的代码按从左到右顺序作用于当前状态
    - 每张卡在一个查询内至多使用一次，路径代价为实际卡成本之和
    - 位排列后异或掩码与集合成员复制后取对称差是同一 GF(2) 仿射结构的两种表示
    - 隐藏码本改变一项后必须重放旧计划，并在新码本下重新证明全局最优
  invalid_variants:
    - 对每条日志贪心选择编号最小的局部兼容候选，不检查代码互异约束
    - 把输出程序串从右向左复合，或只把卡当作无顺序的集合
    - 只证明计划可达而不搜索状态与已用卡空间中的更低成本或并列路径
    - 跨到集合表示后忽略取位方向或把对称差误当作集合并
    - 目标观测改变一项隐藏操作后仍机械复制 source 码本和最优序列
  level_plan:
    L0: 同域四操作，每条日志局部唯一；恢复显式码本后求三步唯一最低成本计划
    L1: 同域四操作中三条日志各有两个候选，必须利用全局一一对应完成消歧
    L2: 跨到继电域并完整重命名八操作码本、日志顺序与成本，所有核心关系保持
    L3: 九选八的目标码本隐藏替换一项仿射关系，旧映射计划失效并切换到新唯一最优
    L4: 位向量改写为点亮站位集合、取位和对称差，同时适配单关系编辑并独立求解三个查询
  copy_probe: L0—L2 采用反向复合关系产生确定错误序列；L3—L4 采用未重新校准的旧码本计划，且在真实目标下均可执行重放并错失目标。
  lure: 保留目标的全部对象、成本、观测和查询，只翻转一个关键组合关系；低级题翻转复合方向，高级题冻结被编辑前的码本。
  verifier: 解析位串与集合两种题面，枚举所有兼容的注入码本，并用一致代价搜索穷举状态×已用卡；检查码本唯一性、最优与 runner-up 成本、单关系差分、lure 错误终态和存储答案。
