- schema_id: causal-role-mapping-fatal-difference-v1
  paradigm: P6
  thread: K-案例区分
  name: 因果角色系统映射与致命关系反转
  definition: 以观察、约束、压力、资源和受益者在有向关系网中的功能位置建立跨域对应；先用最大共享子图恢复角色，再检查源行动建议所依赖的关键边是否缺失、反向或变号。
  required_relations:
    - 角色由完整入边和出边模式定义，而不是由职业、组织类型或历史显著性定义
    - 跨域动词可以重命名，但信息、约束、损害、支撑和保护的方向必须保持
    - 额外演员和域内关系不应进入共享五角色主链
    - 高度相似的角色映射与策略有效性必须分开判断
    - 源策略依赖的约束边一旦反向，即使其余关系保持也构成致命差异
  invalid_variants:
    - 按名称、地位或实体类型逐个配对而不联合检查关系
    - 选择最显著的历史人物代替真正接入功能链的观察者
    - 因四条边保持就默认第五条关键干预边也保持
    - 把 P 控制 G 的反向依赖误读为 G 仍能约束 P
    - 因存在噪声边而放弃寻找唯一最大共享子图
  level_plan:
    L0: 同属公共资源治理的五角色全关系映射
    L1: 使用同义动作的山火—流域系统并打乱节点
    L2: 跨到养老金组织治理，允许实体本体类型完全变化
    L3: 从含显著干扰人物的外交编年摘录恢复唯一五边子图
    L4: 从社会运动多文书恢复四条共享边，并识别压力组织反向控制治理节点的致命差异
  copy_probe: L0–L3 采用同一演员但由表面显著角色占据观察或治理位置的替代关系图；L4 则机械保留源题 G 约束 P 并输出无差异。
  lure: 保留同一领域与演员，通过交换观察/治理角色或恢复旧控制方向形成可独立求解的近邻案例。
  verifier: 穷举源角色到目标节点的单射，按可配置关系词典最大化保留边；要求最佳映射唯一，L4 另外核对唯一缺失约束边和唯一新增反向控制边。
