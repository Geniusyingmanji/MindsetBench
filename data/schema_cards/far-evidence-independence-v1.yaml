- schema_id: far-evidence-independence-v1
  paradigm: P7
  thread: E-证据独立性
  name: 共享同一上游的一致信号只构成一份证据
  definition: 多条结论一致的记载、检查、评估或传感器，只有在来源独立时才互相佐证；先找出它们共享的上游（被引用的文本、被再生成的文件、被依赖的报告、共用的校准器），把落到同一上游的信号合并为一份，再按独立根的数量或上游的状态做决策。
  required_relations:
    - 一致信号之间可能存在由引用、生成、依赖或校准形成的上游关系
    - 落到同一上游根的信号不论条数只构成一份证据
    - 决策门槛按独立根计数或按上游状态条件化，而不按信号条数
    - 增加同源信号不改变结论，只有新增独立根才改变结论
    - 上游关系可能不被声明，需要从读取关系、时间可行性或校准记录推断
  invalid_variants:
    - 按一致信号的条数或类型多样性直接计票
    - 只合并显式自述引用的信号，忽略由可行性推断出的依赖
    - 把被规程排除的角色计入独立评估
    - 把共用同一上游的冗余通道当作独立通道相乘
    - 在同一上游上再增加通道以“提高冗余”
  level_plan:
    L0: 同域同型，另一事件的方志引用链，只换记载数量与链形
    L1: 同域变型，口述、匾额、族谱与文史资料以转述和摹刻表达引用关系
    L2: 跨到软件工程，从 CI 配置与 PR 描述联合推出四个检查依赖同一批再生成快照，判合并与四项补救
    L3: 跨到临床治理，依赖关系不再声明而由影像可调阅时间推断，且规程排除主刀医师，判排期与六项措施
    L4: 跨到过程安全工程，共享校准器以概率故障并使同源开关同时漏报，用条件概率求需求时失效概率并比较三种改造
  copy_probe: L0–L3 记录“把每条一致信号各算一票”的决策；L4 记录“把三只开关当独立冗余相乘并给同一校准器再加一只开关”的数值与选项。
  lure: 保留目标领域、角色与数值，但改用不合并同源信号的旧规程、旧门禁或来源独立的校准安排，使直接计数或独立相乘在 lure 中恰好正确。
  verifier: 对 L0–L3 用声明或推断出的父节点表求独立根并重算门槛判定与逐项补救；对 L4 枚举全部开关失效组合，按校准器是否故障分情形求条件概率并比较三种改造；同时检查题面含有推断所需事实且不出现图式标签词。
