- schema_id: provenance-aware-corroboration-v1
  paradigm: P7
  thread: E-信噪判别
  name: 证据谱系去重、双向佐证与局部独立性修订
  definition: 将支持和反对材料追溯到生成它们的最终来源，按实际独立性单位去重并传播对上游真实性的攻击；当目标材料揭示共同简报、编辑或送审过程时，只对受影响的来源进行第二层聚类。
  required_relations:
    - 转引、摘录和改写继承上游来源，不能凭文件数量创造独立证据
    - 支持侧和反对侧分别在去重后应用相同门槛，两侧都达标时结论为争议而非多数决
    - 对上游真实性或适格性的攻击会使依赖该来源的全部下游材料失效
    - 独立性单位由生成过程决定；不同一手文本仍可能因共同协调来源而相关
    - 新发现的依赖关系只局部合并相应证据家族，不能扩张到没有共同上游的材料
  invalid_variants:
    - 把报道、证词或档案篇数直接当作独立来源数
    - 只删除受到攻击的一手文件，仍保留它的转引作为证据
    - 用支持减反对的简单多数取代双侧门槛
    - 一追溯到不同一手文本就停止，忽略共同简报或生产流程
    - 发现一组协调材料后把所有同类材料都判为不独立
  level_plan:
    L0: 单一日志的三级转述，区分文件数与来源数
    L1: 双假设双向证据，检查支持和反对分别去重
    L2: 跨到新闻核验，同时传播伪造上游的失效并识别共同匿名信源
    L3: 从艺术品图录、展签、税册和鉴定警报恢复多条档案谱系
    L4: 在历史文书归属中把不同底本按共同简报或送审包二次聚类，并只局部更新独立性关系
  copy_probe: L0–L3 使用逐文档计数且不传播根攻击的确定性结果；L4 使用只按一手底本编号去重、忽略共同生产过程的结果。
  lure: 保留相同材料、方向与门槛，只改变独立性单位或攻击传播范围；其输出在该替代证据模型中成立，但会系统性高估佐证。
  verifier: 有向无环证据图追踪所有最终根，支持上游失效传播和根到独立性家族的二次映射；独立的表面文档计数器生成负控制，循环、缺失父节点与冲突配置均由单测覆盖。
