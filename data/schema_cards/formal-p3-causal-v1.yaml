- schema_id: linear-scm-path-sensitivity-v1
  paradigm: P3
  thread: H-因果拓扑
  name: 线性结构因果模型的总效应路径和与局部系数灵敏度迁移
  definition: 在无环线性 SCM 的干预图中传播处理响应导数，将总因果效应表示为带权有向路径和；在重命名模型中利用上下游响应乘积迁移单边机制系数的局部灵敏度。
  required_relations:
    - do-总效应只沿处理到结局的有向后代路径传播
    - 每条路径贡献为沿途结构系数乘积，多条路径带符号相加
    - 处理前共同原因产生观测关联但不进入干预响应导数
    - 单边系数灵敏度等于处理到边尾的总效应乘边头到结局的总效应
  invalid_variants:
    - 把所有非零边系数折叠为 1 而只数路径
    - 把观测相关或进入处理的边错误加入 do-总效应
    - 看到重命名同构后直接复制 baseline，未核查局部结构系数漂移
  level_plan:
    L0: 三节点直接路径与单中介路径，可手算路径乘积和
    L1: 四节点含共享中介和正负系数，需按拓扑序合并响应
    L2: 八变量多层 DAG 加处理前共同原因干扰，区分干预与观测关联
    L3: 十节点跨域完全重命名，恢复置换后迁移完整响应证书
    L4: 十节点重命名后改变一条结构系数，用上下游灵敏度作局部更新
  copy_probe: 各级均记录把所有非零结构系数置为 1 后得到的无权有向路径条数。
  lure: 保留同一节点和有向拓扑，但明确改问无权路径数；它在自身问题上正确，却无法提供带符号系数和或局部漂移更新。
  verifier: 拓扑动态规划与所有简单有向路径的显式枚举独立比对；L3 检查重命名后的逐边等价，L4 另核验单边有限差分与上下游灵敏度乘积。
