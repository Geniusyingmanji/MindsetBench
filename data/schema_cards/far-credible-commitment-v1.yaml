- schema_id: far-credible-commitment-v1
  paradigm: P8
  thread: J-机制识别
  name: 承诺的可信度来自承诺人失去反悔的能力
  definition: 一项承诺或威胁只有在承诺人到了违约有利的那一刻已经无法反悔时才可信：反悔的选项被物理上销毁，或其控制权交给了承诺人不能撤换、利益相反的一方，并且对方在行动前能核实这一点。措辞的强度、罚金的大小、自动化的外观和由承诺人自己裁定的赔付都不改变事后的选择。
  required_relations:
    - 承诺人事后是否还能单方取消措施决定可信性
    - 交给第三方的控制权只有在第三方不受承诺人任命与供给时才算交出
    - 物理上不可恢复的自我限制不需要第三方即可信
    - 由承诺人自行裁定或自行决定时机的赔付不构成约束
    - 在带收益的两步决策中，可信性由事后节点上兑现与不兑现的收益比较决定
  invalid_variants:
    - 按措辞强度、罚金数额或自动化外观判断可信性
    - 把任何第三方托管都当作独立托管，不审查其人事与经费来源
    - 把改变对方损失的信息当作改变自己事后选择的措施
    - 把可随时取回的资金当作已交出的代价
  level_plan:
    L0: 同域同型，数据删除承诺的四项措施
    L1: 同域变型，应用商店分成承诺以协议条款表述
    L2: 跨到零售业，内部备忘录中的四种退差价方案，自动化流程里仍有确认与裁定节点
    L3: 跨到外交史叙事，第三方监督团由承诺人任命供给，炸桥则为物理自限
    L4: 跨到劳资谈判，用被拒后罢工与不罢工的收益比较判断威胁可信性
  copy_probe: L0–L2 与 L4 记录“有自动机制、罚金、资金或强硬表态即可信”的分类；L3 记录“交给任何第三方即可信”的分类。
  lure: 保留同一情境与措施编号，但改用以强制或赔付外观为准的评审标准、让监督团真正中立、或让资金与补贴真的改变事后收益，使照搬分类在 lure 中恰好正确。
  verifier: 对 L0–L3 以控制者、可核实性、第三方是否受控三项属性重算分类并与捷径分类对比；对 L4 按各措施下工会被拒后罢工与不罢工的收益比较判定；同时核对 lure 世界使 copy probe 成立，题面含所需事实且不出现图式标签词。
