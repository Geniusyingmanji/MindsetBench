- schema_id: far-bottleneck-migration-v1
  paradigm: P3
  thread: J-机制识别
  name: 改善当前最慢环节后必须重新找到新的制约环节
  definition: 串行流程的完成量由当期处理能力最小的环节决定。第一次改善会改变各环节的相对大小，因而第二次资源必须在更新后的状态上重新分配。分期到达的资源还使顺序影响累计产出：早到的改善多贡献一期。
  required_relations:
    - 每个完成对象必须依次通过全部环节
    - 当期完成量是各环节能力的最小值
    - 改善一处后当前最小值可能转移到另一处
    - 已投入的资源在后续时期保留
    - 资源分期到达时应比较完整序列的累计完成量
  invalid_variants:
    - 把各环节能力相加当成流程完成量
    - 把所有新资源都投向初始最慢环节
    - 第一次改善后不更新各环节的相对大小
    - 资源分期到达时只看最终能力而忽略顺序对早期产出的影响
  level_plan:
    L0: 同域生产线单次改善
    L1: 生产线两次连续改善
    L2: 跨到审批或出版流程，从工位转为机构人力
    L3: 加入返工与部分案件分流，不再是纯串行
    L4: 历史房产返还法援中的两季度捐赠，优化分期累计结案数
  copy_probe: 记录两次都增聘初始最慢的档案核对人员，不在首次改善后重算。
  lure: 用资助条款强制两笔捐赠都只能投向初始处理数最小的部门，使预注册的重复投入成为正确答案。
  verifier: 枚举两期资源序列，每期更新能力后取三处最小值，累加两期并检查最优序列唯一。
