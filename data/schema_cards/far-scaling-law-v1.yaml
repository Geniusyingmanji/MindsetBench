- schema_id: far-scaling-law-v1
  paradigm: P1
  thread: A-尺度约束
  name: 几何放大时面积按平方、体积按立方变化，比例外推失效
  definition: 形状相似的对象放大 k 倍时，凡按面积计的量（散热、卵壳、锅身、构件截面、围护墙面）放大 k 的平方倍，凡按体积计的量（体重、热量、汤量、自重、容积）放大 k 的立方倍；由面积供给、由体积消耗的过程因而不能按比例外推，单位体积的面积量随 k 反比下降，安全系数随 k 反比下降，单位容积的面积成本随 k 反比下降。
  required_relations:
    - 面积类的量随线性尺寸按平方变化
    - 体积类的量随线性尺寸按立方变化
    - 由面积供给、由体积消耗的比例随放大倍数反比下降
    - 体积比要先换算为线性尺寸比再推面积比
    - 面积一侧与体积一侧的角色在不同领域中可以互换（供给或消耗、承载或荷载、成本或容量）
  invalid_variants:
    - 认为形状一样比例就一样
    - 认为量多几倍时间或成本就多几倍
    - 把缩比模型的安全系数当作与尺寸无关的常数
    - 沿用小规模的单位成本估算大规模设施
  level_plan:
    L0: 同域同型，另一对近亲的食量比例
    L1: 同域变型，鸟卵离巢后的冷却时间
    L2: 跨到厨房，16 升汤的晾凉时间，体积比需先换算为尺寸比
    L3: 跨到结构工程，1 比 40 桥梁模型的安全系数与最大放大倍数
    L4: 跨到物流经济，边长翻倍的冷库每立方米围护造价
  copy_probe: L0 与 L4 记录“比例或单价不变”的答案；L1、L2 记录“按体积倍数外推时间”的答案；L3 记录“模型撑得住实物也撑得住、放大无上限”的答案。
  lure: 让需求随体积而非表面变化、把散热面积固定、让材料强度随倍数同步提高、或把大库拆成八个小库，使比例外推在 lure 中恰好正确。
  verifier: 用精确分数按平方与立方计算比例、时间、安全系数与单位造价，并与比例外推的答案对比。
