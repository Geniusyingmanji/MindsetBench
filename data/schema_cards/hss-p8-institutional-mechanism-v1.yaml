- schema_id: credible-cost-option-mechanism-v1
  paradigm: P8
  thread: D-元认知控制
  name: 可信承诺、分离信号与成本承担关系迁移
  definition: 将制度行动还原为发生时点、可核验性、未来选项删除、有效成本承担者和不同类型的可模仿性；区分可信承诺、分离信号、混同信号与不影响回应的行动，并在跨文书材料中更新隐蔽补贴关系。
  required_relations:
    - 行动必须在接收者回应前可核验，才能影响该回应
    - 不可逆删除未来背离选项构成可信承诺，不要求借助类型推断
    - 分离信号要求有效成本由行动者承担、守约类型可承担而机会主义类型不可承担
    - 两类均能采用或第三方承担有效成本时只能形成混同信号
    - 补贴、保险、返还和垫资应沿资金流追到最终承担者，并只更新受影响的机制
  invalid_variants:
    - 看到保证金、仪式或高价证书就直接判为分离信号
    - 只看名义付款者而忽略事前垫资和事后全额返还
    - 把发生在回应之后的昂贵行动当作影响先前选择的信号
    - 把公开承诺误当成已经不可逆删除背离选项
    - 因一个信号受到补贴就把同题中的独立选项删除也判为无效
  level_plan:
    L0: 平台准入中的自付保证金、撤单密钥和回应后声明
    L1: 公共采购中区分双方可购证书、不可逆托管和授标后展示
    L2: 跨到劳资联盟，恢复基金、关闭权、口头保障和徽章的机制槽位
    L3: 从公地治理会议纪要与附函追踪名义缴费和基金会实际承担
    L4: 联合城邦联盟的公开账册与秘密担保函，用第三方垫资/返还局部推翻昂贵信号的分离性
  copy_probe: 各级使用只看名义成本、忽略类型可模仿性或第三方补偿时的确定性机制标签；L4 仅将 H1 从混同误判为分离。
  lure: 保留行动名称、名义金额和时点，只改变最终成本承担或坏类型承受能力，形成可独立求解的相邻机制。
  verifier: 纯布尔机制分类器按时点、选项删除、成本可行性和补偿关系确定标签；每级分别重算 target 与 lure，单测覆盖优先级、不可行行动和第三方补偿边界。
