- schema_id: far-invariant-reachability-v1
  paradigm: P2
  thread: B-不变量守恒
  name: 所有允许的操作都保持某个类别，不同类别的目标不可达
  definition: 判断一个状态能否通过一组固定操作到达，不靠穷举走法，而是找出每一步操作都不改变的量（总和的奇偶、格子颜色的交替、排列的类别、余额的某个线性组合）；目标若在该量上与起点不同，就永远到不了，最接近的可达目标由该量的差决定。
  required_relations:
    - 每种允许的操作都保持某个可计算的量或类别
    - 起点与目标在该量上是否相同决定可达性
    - 与起点同类的目标可以再用搜索求最少步数
    - 该量可以是二元类别也可以是任意整数的线性组合
    - 差距本身对应一种未被允许的操作或需要注入的量
  invalid_variants:
    - 认为对象够多、步数够多就总能凑出目标
    - 只按距离或数量估计步数而不看步数的奇偶约束
    - 未知数与方程一样多就默认有解，不检查相容性
    - 把源题中的具体量（数字总和）套到对象完全不同的目标上
  level_plan:
    L0: 同域同型，黑板换成 1 到 10
    L1: 同域变型，7 个杯子每步翻 4 个
    L2: 跨到棋类，马从 a1 到 h8 能否恰好 5 步，最少几步
    L3: 跨到舞蹈编排，相邻三人轮转能否得到只换两人的队形，双换位最少几次
    L4: 跨到会计，三种记账动作能否达到目标账面，差多少现金
  copy_probe: 各级记录“可以到达/可以做到”的构造性答案（ZERO=YES、FIVE=YES、SWAP=YES、REACHABLE=YES）及其对应的最小值或步数。
  lure: 更换一个参数使起点与目标同类（1 到 11、每步翻 3 个、目标改为 h7、允许两人换位、目标余额同组合），使构造性答案在 lure 中恰好正确。
  verifier: 对多重集与朝上杯数做可达状态搜索；对棋盘做广度优先搜索并核对同色格只能偶数步到达；对 8 名舞者的全部排列做广度优先搜索确认恰有一半可达；对账面用线性组合判定并以穷举交叉验证。
