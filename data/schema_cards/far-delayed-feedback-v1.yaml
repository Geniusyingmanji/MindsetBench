- schema_id: far-delayed-feedback-v1
  paradigm: P3
  thread: H-时滞反馈
  name: 有时滞时按当前误差足额修正会越过目标并来回摆动
  definition: 当修正的效果或所依据的读数存在延迟时，每期按看到的误差足额修正会把过去的误差重复修正，越过目标后反向再越过，形成摆动甚至发散；只有让每期修正量小于误差、且在被调节量会自行衰减时补上维持量的方案才能稳住。在串联的多个带延迟环节中，足额修正还会逐级放大扰动。
  required_relations:
    - 修正所依据的读数或修正的效果落后于当前状态
    - 足额修正会越过目标并在目标两侧摆动
    - 足够小的修正系数不越过目标并单调收敛
    - 被调节量若自行衰减，比例修正停在偏离目标的稳态，需要抵消衰减的维持量
    - 多个带延迟的环节串联时，每个环节的摆动成为下一个环节的输入并可能放大
  invalid_variants:
    - 差多少补多少，认为足额修正最快到位
    - 认为反应越快、跟得越紧越稳
    - 忽略被调节量自身的衰减，认为比例修正总能收敛到目标
    - 只看平均或总量不逐步模拟
  level_plan:
    L0: 同域同型，淋浴读数滞后一步，三档系数中选唯一不越过且保持的一档
    L1: 同域变型，木屋地暖读数落后三个周期
    L2: 跨到供应链采购，订货两周后到货且初始有一笔在途，按采购备忘选订货系数
    L3: 跨到临床药理，被调节量每期消散两成，比例滴定停在 60，需维持量 20
    L4: 跨到交通流，五辆车带一秒反应延迟串联，选让末车减速幅度不放大的系数
  copy_probe: L0–L2 与 L4 记录“最大系数一步到位/原样传递”的答案；L3 记录“比例修正收敛到目标、无需维持量”的答案。
  lure: 保留情境与数值，但去掉延迟或去掉消散，使足额修正或比例收敛在 lure 中恰好正确。
  verifier: 逐期模拟延迟差分方程并检查进入区间、保持与不越过；对衰减系统解稳态并用 60 周期模拟核对；对车队逐秒模拟五辆车并比较末车与头车的最大减速幅度。
