- schema_id: far-threshold-cascade-v1
  paradigm: P3
  thread: H-阈值级联
  name: 扩散的终点由门槛分布的缺口决定而非平均门槛
  definition: 当每个单元只在“已经改变的邻近单元数量或转移来的荷载达到自己的门槛”时才改变，扩散逐轮推进，直到已改变量跨不过下一批单元的门槛为止；终点由门槛分布的缺口、局部邻域结构与起点位置决定，两个平均门槛几乎相同的群体可以一个全部改变、一个几乎不动。
  required_relations:
    - 单元的改变取决于已改变的单元数量或累积到自身的量与自己门槛的比较
    - 扩散逐轮进行，每轮新改变的单元推动下一轮的比较
    - 只要有一批单元的门槛高于此刻的已改变量，扩散就停在那里
    - 门槛只对局部邻域计数时，起点位置决定能否形成连续推进
    - 传递的量若随失效累积增大，大余量的单元能吸收并阻断传递
  invalid_variants:
    - 用平均门槛一次性筛出“会参加的人”
    - 认为门槛分布相近的群体结局相近
    - 把只看局部邻域的门槛当作全局计数
    - 用总承载力与总荷载的比较代替逐轮荷载再分配
  level_plan:
    L0: 同域同型，两个镇的集会人数，只换分组与门槛
    L1: 同域变型，两栋楼的联名签字
    L2: 跨到银行挤兑，监管简报中两家银行的最终取款人数
    L3: 跨到农业技术推广，农户只看两侧各两户，比较两种种子位置
    L4: 跨到结构工程，荷载向最近完好柱再分配，比较两种承载力分布的最终失效柱数
  copy_probe: L0–L2 记录“门槛不超过平均值者参加”的人数；L3 记录按全村计数得到的全部改用；L4 记录“总承载力大于总荷载故只失去被撞一根”的答案。
  lure: 让居民只与一个公布的预计数比较一次、让农户看全村计数、或把 P 的承载力提高到 16，使平均值判断或总量判断在 lure 中恰好正确。
  verifier: 对门槛分布做固定点迭代求最终人数并与平均门槛筛法对比；对环形邻域逐轮模拟两种种子位置；对支柱按最近完好柱规则逐轮再分配荷载并统计失效柱数。
