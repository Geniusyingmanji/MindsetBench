- schema_id: defeasible-norm-precedent-v1
  paradigm: P4
  thread: I-规范规则
  name: 默认规范、成对例外与先例优先关系迁移
  definition: 识别许可与禁止理由之间的有向覆盖关系；在默认拒绝、普通规则、成对例外和终局阻却之间逐对象选取最高适用理由，并能从相邻先例的最小事实差恢复和局部修订该关系图。
  required_relations:
    - 缺少适用许可理由时执行默认拒绝，而非从缺少禁止理由推出许可
    - 普通阻却可以击败通常许可，但只在完整满足两个条件时例外才击败普通阻却
    - 命中一个例外后仍须检查更高位阻却，例外范围不能自动扩张
    - 从先例迁移时以最小事实差识别改变裁决的理由，并只更新该理由涉及的关系边
  invalid_variants:
    - 将最具体或最后出现的理由无条件视为胜者
    - 将成对例外拆成任一条件即可触发
    - 将针对普通阻却的例外扩大为对终局阻却也有效
    - 发现一个新增最高例外后让它覆盖所有种类的拒绝理由
    - 只复制源题最高规则而忽略目标题先例对单条关系的修订
  level_plan:
    L0: 三项技术权限请求，区分普通准入与优先事故禁令
    L1: 五项请求覆盖默认值、普通禁令、成对例外和终局禁令
    L2: 跨到博物馆出借委员会，迁移四层关系而不复制领域词
    L3: 从劳动集体协议与书记员纪要恢复分散的关系图并限制例外范围
    L4: 仅由公共档案先例恢复四层关系，再加入一个只修订旧最高禁令的法院例外
  copy_probe: 各级给出把局部例外错误提升为普遍最高许可、或机械保留源题旧最高禁令时的确定性拒绝集合。
  lure: 保持对象事实和大部分规范不变，只反转一条关键覆盖关系或扩大例外范围；其答案在自身规范世界中正确，但不适用于目标关系图。
  verifier: 通用有限优先规则引擎逐对象选择最高适用理由；文本记录解析器核对题面事实，负控制引擎独立计算 lure，L4 另验证五份先例能恢复交替裁决与新增局部关系。
