name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=mindsetbench --cov-fail-under=75 -q
      - run: mb validate
      - run: mb verify all
      - run: mb smoke
      - run: mb validate data/manifests/far20.json --strict-v1
      - run: mb validate-cards data/manifests/far20-cards.json data/manifests/far20.json
      - run: mb audit data/manifests/far20.json --require-complete-chains --surface
      - run: mb verify all --dataset data/manifests/far20.json
